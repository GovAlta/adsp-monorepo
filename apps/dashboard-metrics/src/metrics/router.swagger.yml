/metrics/v1/metrics/{interval}:
  get:
    tags:
      - Metrics
    summary: Get metrics for interval
    description: >
      Retrieves the platform usage metrics collected for a day. A daily job collects the previous day's metrics across
      all tenants. Anonymous access is allowed; the metrics are aggregate counts with no tenant data beyond tenant
      names. Responds with null if no metrics were collected for the interval.
    security:
      - {}
    parameters:
      - in: path
        name: interval
        required: true
        schema:
          type: string
          format: date-time
        description: Start of the UTC day of the metrics, as an ISO 8601 timestamp.
        example: '2026-11-08T00:00:00.000Z'
    responses:
      '200':
        description: Metrics of the interval, or null if none were collected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Metrics'
components:
  schemas:
    MetricCounts:
      type: object
      properties:
        logins:
          type: number
        registrations:
          type: number
        eventCount:
          type: number
        pdfGenerated:
          type: number
        notificationsSent:
          type: number
        feedbackReceived:
          type: number
        formsSubmitted:
          type: number
        filesUploaded:
          type: number
    Metrics:
      nullable: true
      allOf:
        - $ref: '#/components/schemas/MetricCounts'
        - type: object
          properties:
            tenants:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/MetricCounts'
                  - type: object
                    properties:
                      id:
                        type: string
                        description: Tenant ID, without the URN prefix.
                      name:
                        type: string
      example:
        logins: 1250
        registrations: 34
        eventCount: 48210
        pdfGenerated: 312
        notificationsSent: 2040
        feedbackReceived: 57
        formsSubmitted: 189
        filesUploaded: 420
        tenants:
          - id: 61f2e3a8c9b1d2e3f4a5b6c7
            name: Test Tenant
            logins: 120
            registrations: 4
            eventCount: 3100
            pdfGenerated: 12
            notificationsSent: 85
            feedbackReceived: 6
            formsSubmitted: 9
            filesUploaded: 30
