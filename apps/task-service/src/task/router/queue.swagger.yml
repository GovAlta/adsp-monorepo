components:
  parameters:
    QueueNamespace:
      name: namespace
      description: Namespace of the queue.
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 50
      example: support
    QueueName:
      name: name
      description: Name of the queue.
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 50
      example: intake-processing
  responses:
    QueueNotFound:
      description: Queue not found in the configuration of the tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskError'
          example:
            errorMessage: "queue with ID 'support:intake-processing' could not be found."
    QueuedTaskNotFound:
      description: Queue not found, or task not found in the queue of the tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskError'
          example:
            errorMessage: "task with ID 'f3a3bc74-494e-4bb5-b5f3-d29a34edd275' could not be found."
  schemas:
    Queue:
      type: object
      properties:
        namespace:
          type: string
          description: The namespace in which the queue resides.
          example: support
        name:
          type: string
          description: The name of the queue.
          example: intake-processing
        displayName:
          type: string
          nullable: true
          description: Display name of the queue.
          example: Intake processing
        context:
          type: object
          description: An application-defined JSON object to describe the context for the queue.
          example: {}
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        assignerRoles:
          type: array
          description: Roles that allow a user to assign tasks in the queue to others, and to set task priority.
          items:
            type: string
          example: [intake-supervisor]
        workerRoles:
          type: array
          description: Roles that allow a user to assign themselves tasks in the queue, and to work on them.
          items:
            type: string
          example: [intake-assessor]
      example:
        namespace: support
        name: intake-processing
        displayName: Intake processing
        context: {}
        assignerRoles: [intake-supervisor]
        workerRoles: [intake-assessor, 'urn:ads:example:intake-app:assessor']
    QueueDurationMetric:
      type: object
      nullable: true
      properties:
        avg:
          type: number
        min:
          type: number
        max:
          type: number
    QueueMetrics:
      type: object
      properties:
        namespace:
          type: string
          description: The namespace in which the queue resides.
        name:
          type: string
          description: The name of the queue.
        status:
          type: object
          description: Number of tasks by status.
          additionalProperties:
            type: number
        priority:
          type: object
          description: Number of tasks by priority.
          additionalProperties:
            type: number
        assignedTo:
          type: object
          description: Number of tasks by assigned user, keyed by user ID.
          additionalProperties:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              count:
                type: number
        queue:
          allOf:
            - $ref: '#/components/schemas/QueueDurationMetric'
          description: >
            Weekly time in seconds tasks wait between created and started. Only set when includeEventMetrics is true.
        completion:
          allOf:
            - $ref: '#/components/schemas/QueueDurationMetric'
          description: >
            Weekly time in seconds tasks take between started and completed. Only set when includeEventMetrics is true.
        rate:
          type: object
          nullable: true
          description: Number of tasks created, completed, and cancelled in the last 7 days. Only set when
            includeEventMetrics is true.
          properties:
            since:
              type: string
              format: date-time
            created:
              type: integer
            completed:
              type: integer
            cancelled:
              type: integer
      example:
        namespace: support
        name: intake-processing
        status:
          Pending: 12
          In Progress: 4
          Stopped: 0
          Cancelled: 1
          Completed: 30
        priority:
          Normal: 40
          High: 6
          Urgent: 1
        assignedTo:
          ed2243ed-948a-4f84-a785-c9cf2d5f355e:
            id: ed2243ed-948a-4f84-a785-c9cf2d5f355e
            name: Test User
            count: 4
        queue:
          avg: 5400
          min: 120
          max: 86400
        completion:
          avg: 1800
          min: 60
          max: 7200
        rate:
          since: '2026-02-23T15:30:00.000Z'
          created: 20
          completed: 15
          cancelled: 1
    QueueUser:
      type: object
      properties:
        id:
          type: string
          description: The user's ID.
        name:
          type: string
          description: The user's first and last name, or username if the name isn't set.
        email:
          type: string
          description: The user's email address.
      example:
        id: ed2243ed-948a-4f84-a785-c9cf2d5f355e
        name: Test User
        email: test.user@gov.ab.ca
    NewTask:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: The name of the task.
        description:
          type: string
          description: A short summary of the task to be performed.
        recordId:
          type: string
          description: An optional, application defined ID for cross-referencing purposes.
        context:
          type: object
          description: A JSON object used to provide an application-defined context for the task. Defaults to {}.
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        data:
          type: object
          description: An optional, application-defined JSON object to further define the task. Defaults to {}.
        definition:
          type: object
          description: Optional application-defined task definition the task is created from.
          properties:
            namespace:
              type: string
            name:
              type: string
        priority:
          type: string
          description: The task priority. Defaults to Normal.
          enum: [Normal, High, Urgent]
      required: [name]
      example:
        name: process-application-123
        description: Process application 123
        recordId: f669be59-bd38-4ca4-8749-19248060fc63
        context:
          application: intake
        priority: High

/task/v1/queues:
  get:
    tags:
      - Queue
    description: >
      Retrieves the queues configured for the tenant. Available to any authenticated user of the tenant; no task service
      role is required. Core users must set the tenantId parameter.
    parameters:
      - $ref: '#/components/parameters/TaskTenantId'
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Queue'
      400:
        $ref: '#/components/responses/TaskBadRequest'
      401:
        $ref: '#/components/responses/TaskUnauthorized'

/task/v1/queues/{namespace}/{name}:
  get:
    tags:
      - Queue
    description: >
      Retrieves a specified queue of the tenant. Available to any authenticated user of the tenant; no task service role
      is required. Core users must set the tenantId parameter.
    parameters:
      - $ref: '#/components/parameters/TaskTenantId'
      - $ref: '#/components/parameters/QueueNamespace'
      - $ref: '#/components/parameters/QueueName'
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Queue'
      400:
        $ref: '#/components/responses/TaskBadRequest'
      401:
        $ref: '#/components/responses/TaskUnauthorized'
      404:
        $ref: '#/components/responses/QueueNotFound'

/task/v1/queues/{namespace}/{name}/metrics:
  get:
    tags:
      - Queue
    description: >
      Retrieves task counts for a specified queue of the tenant, and optionally duration and rate metrics from the value
      service. Requires the task-admin or task-reader role, or one of the worker or assigner roles of the queue. Core
      users with one of those roles can retrieve metrics using the tenantId parameter.
    parameters:
      - $ref: '#/components/parameters/TaskTenantId'
      - $ref: '#/components/parameters/QueueNamespace'
      - $ref: '#/components/parameters/QueueName'
      - name: notEnded
        description: Set to true to only include tasks that are not completed or cancelled in the counts.
        in: query
        required: false
        schema:
          type: boolean
        example: true
      - name: includeEventMetrics
        description: Set to true to include the queue, completion, and rate metrics.
        in: query
        required: false
        schema:
          type: boolean
        example: true
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueMetrics'
      400:
        $ref: '#/components/responses/TaskBadRequest'
      401:
        $ref: '#/components/responses/TaskUnauthorized'
      403:
        $ref: '#/components/responses/TaskForbidden'
      404:
        $ref: '#/components/responses/QueueNotFound'

/task/v1/queues/{namespace}/{name}/tasks:
  get:
    tags:
      - Queue
    description: >
      Retrieves the tasks in a queue that are not completed or cancelled, ordered with the highest priority first and,
      within each priority, oldest first. Requires the task-admin or task-reader role, or one of the worker or assigner
      roles of the queue. Core users with one of those roles can retrieve tasks using the tenantId parameter.
    parameters:
      - $ref: '#/components/parameters/TaskTenantId'
      - $ref: '#/components/parameters/QueueNamespace'
      - $ref: '#/components/parameters/QueueName'
      - $ref: '#/components/parameters/TaskTop'
      - $ref: '#/components/parameters/TaskAfter'
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskResults'
      400:
        $ref: '#/components/responses/TaskBadRequest'
      401:
        $ref: '#/components/responses/TaskUnauthorized'
      403:
        $ref: '#/components/responses/TaskForbidden'
      404:
        $ref: '#/components/responses/QueueNotFound'
  post:
    tags:
      - Queue
    description: >
      Creates a task in a queue of the tenant, with status Pending. Requires the task-admin or task-writer role. Core
      users with one of those roles can create tasks using the tenantId parameter. Also creates a comment topic for the
      task in the comment service.
    parameters:
      - $ref: '#/components/parameters/TaskTenantId'
      - $ref: '#/components/parameters/QueueNamespace'
      - $ref: '#/components/parameters/QueueName'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewTask'
    responses:
      200:
        description: Task successfully created.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
      400:
        $ref: '#/components/responses/TaskBadRequest'
      401:
        $ref: '#/components/responses/TaskUnauthorized'
      403:
        $ref: '#/components/responses/TaskForbidden'
      404:
        $ref: '#/components/responses/QueueNotFound'

/task/v1/queues/{namespace}/{name}/tasks/{id}:
  get:
    tags:
      - Queue
    description: >
      Retrieves a task in a specified queue. Requires the task-admin or task-reader role, or one of the worker or
      assigner roles of the queue. Core users with one of those roles can retrieve the task using the tenantId
      parameter. Tasks of other tenants or other queues respond 404. Responds 400 without a tenant context.
    parameters:
      - $ref: '#/components/parameters/TaskTenantId'
      - $ref: '#/components/parameters/QueueNamespace'
      - $ref: '#/components/parameters/QueueName'
      - $ref: '#/components/parameters/TaskId'
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
      400:
        $ref: '#/components/responses/TaskBadRequest'
      401:
        $ref: '#/components/responses/TaskUnauthorized'
      403:
        $ref: '#/components/responses/TaskForbidden'
      404:
        $ref: '#/components/responses/QueuedTaskNotFound'
  patch:
    tags:
      - Queue
    description: >
      Updates a task in a specified queue. Requires the task-admin role, or the task-writer role together with a role
      that grants access to the task (task-reader, or a worker or assigner role of the queue), in the tenant of the
      task; core users can't update tasks. Tasks of other tenants or other queues respond 404.
    parameters:
      - $ref: '#/components/parameters/TaskTenantId'
      - $ref: '#/components/parameters/QueueNamespace'
      - $ref: '#/components/parameters/QueueName'
      - $ref: '#/components/parameters/TaskId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskUpdate'
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
      400:
        $ref: '#/components/responses/TaskBadRequest'
      401:
        $ref: '#/components/responses/TaskUnauthorized'
      403:
        $ref: '#/components/responses/TaskForbidden'
      404:
        $ref: '#/components/responses/QueuedTaskNotFound'
  post:
    tags:
      - Queue
    description: >
      Executes an operation on a task in a specified queue. The roles are the same as for POST /task/v1/tasks/{id}: the
      user must be able to access the task (the task-admin or task-reader role, or a worker or assigner role of the
      queue); assign requires the task-admin role or an assigner role, except that a worker can assign the task to
      themselves; set-priority requires the task-admin or task-writer role or an assigner role; start and complete
      require a worker role, and the task must be unassigned or assigned to the user; cancel is allowed for any user who
      can access the task. Tasks of other tenants or other queues respond 404. Responds 400 for an unrecognized
      operation, or when the task's status doesn't allow the operation.
    parameters:
      - $ref: '#/components/parameters/TaskTenantId'
      - $ref: '#/components/parameters/QueueNamespace'
      - $ref: '#/components/parameters/QueueName'
      - $ref: '#/components/parameters/TaskId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskOperation'
          examples:
            assign:
              $ref: '#/components/examples/AssignTaskExample'
            unassign:
              $ref: '#/components/examples/UnassignTaskExample'
            set-priority:
              $ref: '#/components/examples/SetTaskPriorityExample'
            start:
              $ref: '#/components/examples/StartTaskExample'
            complete:
              $ref: '#/components/examples/CompleteTaskExample'
            cancel:
              $ref: '#/components/examples/CancelTaskExample'
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
      400:
        $ref: '#/components/responses/TaskBadRequest'
      401:
        $ref: '#/components/responses/TaskUnauthorized'
      403:
        $ref: '#/components/responses/TaskForbidden'
      404:
        $ref: '#/components/responses/QueuedTaskNotFound'

/task/v1/queues/{namespace}/{name}/tasks/{id}/data:
  patch:
    tags:
      - Queue
    description: >
      Replaces the data of a task in a specified queue. The task must be In Progress. Requires a worker role of the
      queue in the tenant of the task, and the task must be unassigned or assigned to the user. Tasks of other tenants
      or other queues respond 404.
    parameters:
      - $ref: '#/components/parameters/TaskTenantId'
      - $ref: '#/components/parameters/QueueNamespace'
      - $ref: '#/components/parameters/QueueName'
      - $ref: '#/components/parameters/TaskId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskData'
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
      400:
        $ref: '#/components/responses/TaskBadRequest'
      401:
        $ref: '#/components/responses/TaskUnauthorized'
      403:
        $ref: '#/components/responses/TaskForbidden'
      404:
        $ref: '#/components/responses/QueuedTaskNotFound'

/task/v1/queues/{namespace}/{name}/assigners:
  get:
    tags:
      - Queue
    description: >
      Retrieves the users of the tenant's Keycloak realm that hold one of the assigner roles of the queue. No task
      service role is required, but the request is made to the Keycloak admin API with the caller's token, so the user
      must hold the realm-management roles to view users (view-users) and, for client roles, clients (view-clients).
      Responds 403 if Keycloak denies the request. Roles that don't exist in the realm are skipped.
    parameters:
      - $ref: '#/components/parameters/TaskTenantId'
      - $ref: '#/components/parameters/QueueNamespace'
      - $ref: '#/components/parameters/QueueName'
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/QueueUser'
      400:
        $ref: '#/components/responses/TaskBadRequest'
      401:
        $ref: '#/components/responses/TaskUnauthorized'
      403:
        $ref: '#/components/responses/TaskForbidden'
      404:
        $ref: '#/components/responses/QueueNotFound'

/task/v1/queues/{namespace}/{name}/workers:
  get:
    tags:
      - Queue
    description: >
      Retrieves the users of the tenant's Keycloak realm that hold one of the worker roles of the queue. No task service
      role is required, but the request is made to the Keycloak admin API with the caller's token, so the user must
      hold the realm-management roles to view users (view-users) and, for client roles, clients (view-clients).
      Responds 403 if Keycloak denies the request. Roles that don't exist in the realm are skipped.
    parameters:
      - $ref: '#/components/parameters/TaskTenantId'
      - $ref: '#/components/parameters/QueueNamespace'
      - $ref: '#/components/parameters/QueueName'
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/QueueUser'
      400:
        $ref: '#/components/responses/TaskBadRequest'
      401:
        $ref: '#/components/responses/TaskUnauthorized'
      403:
        $ref: '#/components/responses/TaskForbidden'
      404:
        $ref: '#/components/responses/QueueNotFound'
