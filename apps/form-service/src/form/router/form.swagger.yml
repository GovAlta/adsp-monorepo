/form/v1/forms/{formId}/submissions:
  parameters:
    - name: formId
      description: ID of the form.
      required: true
      in: path
      schema:
        type: string
  get:
    tags:
      - Form Submission
    description: |
      Retrieves submissions of a specified form matching search criteria. Requires the form-service admin role,
      one of the form definition's assessor roles, or the export-service export-job role.
    parameters:
      - name: formId
        description: ID of the form.
        in: path
        required: true
        schema:
          type: string
      - name: top
        description: Number of submissions to return in a page. Defaults to 100.
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 5000
      - name: after
        description: Cursor for retrieving additional pages.
        in: query
        required: false
        schema:
          type: string
      - name: sortBy
        description: |
          Column to sort results on. Use 'created', 'submissionStatus', or 'disposition' for submission
          fields, and 'data.' followed by the path into the form data for a data value
          (e.g. 'data.applicant.lastName').
        in: query
        required: false
        schema:
          type: string
      - name: sortDirection
        description: Direction of the sort. Defaults to descending.
        in: query
        required: false
        schema:
          type: string
          enum: [asc, desc]
      - name: criteria
        description: Criteria for form submissions to retrieve.
        in: query
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                createDateBefore:
                  description: The form submission create date that it was created before.
                  type: string
                  format: date-time
                createDateAfter:
                  description: The form submission create date that it was created after.
                  type: string
                  format: date-time
                dispositionStatusEquals:
                  description: The disposition status for the form submission.
                  type: string
                dispositionDateBefore:
                  description: The disposition before date for the form submission was updated.
                  type: string
                  format: date-time
                dispositionDateAfter:
                  description: The disposition after date for the form submission was updated
                  type: string
                  format: date-time
                createdByIdEquals:
                  description: Name of the user the form submission was created by.
                  type: string
                definitionIdEquals:
                  description: ID of the form definition of the submissions.
                  type: string
                submissionStatusEquals:
                  description: The status of the form submission.
                  type: string
                dispositioned:
                  description: True to only include submissions with a disposition; false to only include submissions without one.
                  type: boolean
                dataCriteria:
                  description: >
                    Values to match in the submission data, keyed by the path into the data (e.g. 'applicant.lastName').
                    Text values are case-insensitive partial matches.
                  type: object
                  additionalProperties: true
    responses:
      200:
        description: Successfully retrieves the form submissions.
        content:
          application/json:
            schema:
              type: object
              properties:
                results:
                  type: array
                  items:
                    $ref: '#/components/schemas/FormSubmission'
                page:
                  type: object
                  properties:
                    after:
                      type: string
                    next:
                      type: string
                    size:
                      type: number
                    total:
                      type: number
                      description: Total number of available submissions before filters are applied.
      400:
        $ref: '#/components/responses/FormBadRequest'
      401:
        $ref: '#/components/responses/FormUnauthorized'
      403:
        $ref: '#/components/responses/FormForbidden'

