components:
  responses:
    FormBadRequest:
      description: Request is invalid, for example a path, query, or body parameter failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormError'
          example:
            errorMessage: 'Validation failed with error(s): formId (params) - Invalid value'
    FormUnauthorized:
      description: Request does not include a valid bearer token.
    FormForbidden:
      description: User does not have the role required for the operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormError'
          example:
            errorMessage: 'User Test User (ID: 1234) not permitted to find submissions.'
    FormNotFound:
      description: Form definition, form, or submission not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormError'
          example:
            errorMessage: Form submission with ID '5f1e2d3c-4b5a-4f6e-8d7c-9b0a1c2d3e4f' could not be found.
  schemas:
    FormError:
      type: object
      properties:
        errorMessage:
          type: string
    FormDefinition:
      type: object
      required:
        - name
        - anonymousApply
        - applicantRoles
        - assessorRoles
      properties:
        id:
          type: string
          readOnly: true
          description: Unique identifier for the form definition. Always auto-generated from the name in kebab-case format. Cannot be set by the client.
        created:
          type: string
          format: date-time
          readOnly: true
          description: Date the form definition (latest revision) was created.
        name:
          type: string
        description:
          type: string
        anonymousApply:
          type: boolean
          default: false
          description: Whether anonymous (unauthenticated) applicants can submit the form. Defaults to false.
        oneFormPerApplicant:
          type: boolean
        applicantRoles:
          type: array
          description: Roles allowed to submit the form.
          items:
            type: string
        assessorRoles:
          type: array
          description: Roles allowed to assess submitted forms.
          items:
            type: string
        clerkRoles:
          type: array
          items:
            type: string
        formDraftUrlTemplate:
          type: string
          minLength: 6
          maxLength: 500
          pattern: '^https?://.+$'
          description: Optional URL template for linking applicants back to their draft. Use '{{id}}' as a placeholder for the form ID (e.g. https://example.com/form/{{id}}). Must be between 6 and 500 characters.
        dataSchema:
          type: object
        uiSchema:
          type: object
        dispositionStates:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              description:
                type: string
        submissionRecords:
          type: boolean
        submissionPdfTemplate:
          type: string
        scheduledIntakes:
          type: boolean
          description: Allow this form definition to accept schedule intakes
        supportTopic:
          type: boolean
        securityClassification:
          type: string
          enum: [public, 'protected a', 'protected b', 'protected c']
          description: The security classification for the form definition
        queueTaskToProcess:
          type: object
          properties:
            queueNameSpace:
              type: string
            queueName:
              type: string
        customSubmissionEvent:
          type: object
          properties:
            namespace:
              type: string
            name:
              type: string
        includeDataInSubmission:
          type: boolean
        reviewConfiguration:
          type: object
          description: Ordered form data fields shown as columns in the Form Admin submission and form lists.
          additionalProperties: false
          properties:
            columns:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - path
                properties:
                  path:
                    type: string
                    description: Dot-separated path of a leaf field in the form data schema.
                    minLength: 1
            questionsEmail:
              type: string
              description: >-
                Address that applicant questions are forwarded to while no reviewer is part of the
                conversation. Not returned by the form APIs.
        dryRun:
          type: boolean
        intake:
          type: object
          properties:
            urn:
              type: string
              description: The urn of the form schedule intake
            name:
              type: string
              description: The description of the form schedule intake
            description:
              type: string
              description: The description of the form schedule intake
            start:
              type: string
              format: date-time
              description: The start date time of the form schedule intake
            end:
              type: string
              format: date-time
              description: The end date time of the form schedule intake
            isAllDay:
              type: boolean
              description: Is form schedule intake all day
            isUpcoming:
              type: boolean
              description: Is the form schedule intake upcoming
    FormDefinitionCreate:
      type: object
      description: Payload for creating a new form definition. Only name and description are accepted; all other fields are set to defaults.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
      additionalProperties: false
    FormDefinitionPatch:
      type: object
      description: Partial update payload for a form definition. Only provided fields will be updated; omitted fields will not be changed.
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        dataSchema:
          type: object
        uiSchema:
          type: object
      additionalProperties: false
    Form:
      type: object
      properties:
        urn:
          type: string
        id:
          type: string
        jobId:
          type: string
        definition:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            description:
              type: string
        applicant:
          type: object
          properties:
            addressAs:
              type: string
        status:
          type: string
          enum: [draft, locked, submitted, archived]
        securityClassification:
          type: string
          enum: [public, protected a, protected b, protected c]
        formDraftUrl:
          type: string
          description: URL of the draft form in the application, based on the definition's formDraftUrlTemplate.
        data:
          type: object
          description: Form data; only included when requested with includeData.
        files:
          type: object
          description: Form files as file-service URNs; only included when requested with includeData.
          additionalProperties:
            type: string
        dryRun:
          type: boolean
          description: Indicates the form was created as a dry run and was not saved.
        created:
          type: string
          format: date-time
        createdBy:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
          required: [id, name]
        lastAccessed:
          type: string
          format: date-time
        locked:
          type: string
          format: date-time
        submitted:
          type: string
          format: date-time
        submission:
          type: object
          description: submission for the form if form is submitted.
          properties:
            id:
              type: string
            urn:
              type: string
    FormData:
      type: object
      properties:
        data:
          type: object
        files:
          type: object
          additionalProperties:
            type: string
            format: uri
    FormSubmissionCriteria:
      type: object
      properties:
        createDateBefore:
          type: string
          format: date-time
        createDateAfter:
          type: string
          format: date-time
        dispositioned:
          type: boolean
        dispositionStatusEquals:
          type: string
        dispositionDateBefore:
          type: string
          format: date-time
        dispositionDateAfter:
          type: string
          format: date-time
        createdByIdEquals:
          type: string
    FormDisposition:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        reason:
          type: string
        date:
          type: string
          format: date-time
    FormSubmission:
      type: object
      properties:
        urn:
          type: string
        id:
          type: string
        formId:
          type: string
        formDefinitionId:
          type: string
        formDefinitionRevision:
          type: number
          description: Revision of the form definition the form was submitted with.
        formData:
          type: object
        formFiles:
          type: object
          additionalProperties:
            type: string
        securityClassification:
          type: string
          enum: [public, protected a, protected b, protected c]
        hash:
          type: string
          description: Hash of the submitted data.
        created:
          type: string
          format: date-time
        createdBy:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        updatedBy:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        updated:
          type: string
          format: date-time
        disposition:
          $ref: '#/components/schemas/FormDisposition'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/FormSubmissionNote'
    FormSubmissionNote:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        created:
          type: string
          format: date-time
        createdBy:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
    SendCodeOperation:
      type: object
      properties:
        operation:
          type: string
          enum: [send-code]
    UnlockFormOperation:
      type: object
      properties:
        operation:
          type: string
          enum: [unlock]
    SubmitFormOperation:
      type: object
      properties:
        operation:
          type: string
          enum: [submit]
    ArchiveFormOperation:
      type: object
      properties:
        operation:
          type: string
          enum: [archive]
    SetToDraftOperation:
      type: object
      properties:
        operation:
          type: string
          enum: [to-draft]
    PutIntakeParameters:
      type: object
      description: Payload for updating schedule intake
      required:
        - name
        - calendarEventId
        - start
        - end
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        calendarEventId:
          type: integer
          description: ID of the calendar service event for the intake period.
      example:
        name: Spring intake
        calendarEventId: 42
        start: '2026-10-01T15:00:00.000Z'
        end: '2026-10-31T23:00:00.000Z'

/form/v1/definitions:
  get:
    tags:
      - Form
    description: Retrieves form definitions with optional name search. Requires the form-service admin role.
    parameters:
      - name: top
        description: Number of definitions to return in a page.
        in: query
        required: false
        schema:
          type: number
      - name: after
        description: Cursor for retrieving additional pages.
        in: query
        required: false
        schema:
          type: string
      - name: name
        description: Search for form definitions by name (partial match, case-insensitive).
        in: query
        required: false
        schema:
          type: string
      - name: createDateAfter
        description: Only include definitions created on or after this date (ISO-8601).
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: createDateBefore
        description: Only include definitions created on or before this date (ISO-8601).
        in: query
        required: false
        schema:
          type: string
          format: date-time
    responses:
      200:
        description: Successfully retrieved form definitions.
        content:
          application/json:
            schema:
              type: object
              properties:
                results:
                  type: array
                  items:
                    $ref: '#/components/schemas/FormDefinition'
                page:
                  type: object
                  properties:
                    after:
                      type: string
                    next:
                      type: string
                    size:
                      type: number
                    total:
                      type: number
                      description: Total number of available form definitions before filters are applied.
      400:
        $ref: '#/components/responses/FormBadRequest'
      401:
        $ref: '#/components/responses/FormUnauthorized'
      403:
        $ref: '#/components/responses/FormForbidden'
  post:
    tags:
      - Form
    description: |
      Creates a new form definition. Requires the form-service admin role.

      Only `name` and `description` are accepted in the request body. All other fields are set automatically:
      - `id`: auto-generated from `name` in kebab-case
      - `anonymousApply`: `false`
      - `applicantRoles`: `[]`
      - `assessorRoles`: `[]`
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormDefinitionCreate'
          example:
            name: My Application Form
    responses:
      201:
        description: Successfully created the form definition.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormDefinition'
      400:
        description: Validation failed or ID could not be generated from the provided name.
      401:
        description: User is not authorized to create form definitions.
      409:
        description: Form definition with the generated ID already exists.

/form/v1/definitions/{definitionId}:
  get:
    tags:
      - Form
    description: >
      Retrieves a form definition. Requires the form-service admin or intake-application role, or one of the
      definition's applicant or clerk roles.


      If the definition allows anonymous applications, the request does not need a bearer token. Anonymous
      requests have no token to determine the tenant from, so they must include the tenantId query parameter.
    security:
      - {}
      - accessToken: []
    parameters:
      - name: definitionId
        description: ID of the form definition.
        required: true
        in: path
        schema:
          type: string
          maxLength: 50
      - name: version
        description: Revision of the form definition to retrieve. Defaults to the active revision.
        in: query
        required: false
        schema:
          type: number
      - name: tenantId
        description: ID of the tenant of the definition. Required for anonymous requests.
        in: query
        required: false
        schema:
          type: string
        example: urn:ads:platform:tenant-service:v2:/tenants/61f2e3a8c9b1d2e3f4a5b6c7
    responses:
      200:
        description: Successfully retrieved a form definition.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormDefinition'
      400:
        description: Request is invalid, or the tenant cannot be determined for an anonymous request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormError'
            example:
              errorMessage: Cannot determine tenant context of request.
      403:
        $ref: '#/components/responses/FormForbidden'
      404:
        $ref: '#/components/responses/FormNotFound'
  patch:
    tags:
      - Form
    description: Partially updates an existing form definition. Requires the form-service admin role. Only the provided fields are changed; omitted fields are left unchanged.
    parameters:
      - name: definitionId
        description: ID of the form definition to patch.
        required: true
        in: path
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormDefinitionPatch'
    responses:
      200:
        description: Successfully patched the form definition.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormDefinition'
      401:
        description: User is not authorized to patch form definitions.
      404:
        description: Form definition not found.
  put:
    tags:
      - Form
    description: Updates an existing form definition. Requires the form-service admin role.
    parameters:
      - name: definitionId
        description: ID of the form definition to update.
        required: true
        in: path
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormDefinition'
    responses:
      200:
        description: Successfully updated the form definition.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormDefinition'
      401:
        description: User is not authorized to update form definitions.
      404:
        description: Form definition not found.
  delete:
    tags:
      - Form
    description: Deletes a form definition. Requires the form-service admin role.
    parameters:
      - name: definitionId
        description: ID of the form definition to delete.
        required: true
        in: path
        schema:
          type: string
    responses:
      204:
        description: Successfully deleted the form definition.
      401:
        description: User is not authorized to delete form definitions.
      404:
        description: Form definition not found.

/form/v1/definitions/{definitionId}/schemas:
  put:
    tags:
      - Form
    description: Updates the data and UI schemas for an existing form definition. Requires the form-service admin role.
    parameters:
      - name: definitionId
        description: ID of the form definition whose schemas are to be updated.
        required: true
        in: path
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              data-schema:
                type: object
                description: JSON Schema describing the shape of the form data. If omitted, the existing data schema is preserved.
              ui-schema:
                type: object
                description: UI schema describing the layout and controls of the form. If omitted, the existing UI schema is preserved.
    responses:
      204:
        description: Schemas updated successfully. No content is returned.
      400:
        description: Request body does not conform to the required schema.
      401:
        description: User is not authenticated.
      403:
        description: User does not have the form-admin role.
      404:
        description: Form definition not found.

/form/v1/definitions/{definitionId}/roles:
  put:
    tags:
      - Form
    description: Replaces the applicant, assessor, and clerk roles of an existing form definition. Requires the form-service admin role. The provided roles replace the existing roles entirely; any role array omitted from the request is reset to empty.
    parameters:
      - name: definitionId
        description: ID of the form definition whose roles are to be replaced.
        required: true
        in: path
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              applicantRoles:
                type: array
                items:
                  type: string
                description: Roles permitted to apply. Replaces the existing applicant roles entirely.
              assessorRoles:
                type: array
                items:
                  type: string
                description: Roles permitted to assess submissions. Replaces the existing assessor roles entirely.
              clerkRoles:
                type: array
                items:
                  type: string
                description: Roles permitted to act as clerks. Replaces the existing clerk roles entirely.
    responses:
      200:
        description: Successfully replaced form definition roles.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormDefinition'
      400:
        description: Request body does not conform to the required schema.
      401:
        description: User is not authenticated.
      403:
        description: User does not have the form-admin role.
      404:
        description: Form definition not found.

/form/v1/definitions/{definitionId}/lifecycle:
  patch:
    tags:
      - Form
    description: Partially updates the lifecycle settings of an existing form definition. Requires the form-service admin role. Only provided fields are changed; omitted fields are left unchanged.
    parameters:
      - name: definitionId
        description: ID of the form definition whose lifecycle settings are to be updated.
        required: true
        in: path
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              allowAnonymousApplication:
                type: boolean
                description: Whether anonymous (unauthenticated) applicants can submit the form.
              allowMultipleFormsPerApplicant:
                type: boolean
                description: Whether an applicant can submit more than one form. When false, only one form per applicant is allowed.
              createSupportTopic:
                type: boolean
                description: Whether a support topic is created when the form is submitted.
              securityClassification:
                type: string
                enum:
                  - protected a
                  - protected b
                  - protected c
                  - public
                description: Security classification of the form definition.
    responses:
      200:
        description: Successfully updated lifecycle settings.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormDefinition'
      400:
        description: Request body does not conform to the required schema.
      401:
        description: User is not authenticated.
      403:
        description: User does not have the form-admin role.
      404:
        description: Form definition not found.

/form/v1/definitions/{definitionId}/submission-actions:
  patch:
    tags:
      - Form
    description: Partially updates the actions invoked when a form is submitted. Requires the form-service admin role. Only provided fields are changed; omitted fields are left unchanged.
    parameters:
      - name: definitionId
        description: ID of the form definition whose submission actions are to be updated.
        required: true
        in: path
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              createPDF:
                type: boolean
                description: Whether to generate a submission PDF using the default submitted-form template.
              createSubmissionRecords:
                type: boolean
                description: Whether to create submission records when the form is submitted.
              event:
                type: string
                nullable: true
                pattern: '^[^:]+:[^:]+$'
                description: Custom submission event in namespace:name format. Set to null to clear.
              includeDataInEvent:
                type: boolean
                description: Whether submitted form data is included in the submission event payload.
              taskQueue:
                type: string
                nullable: true
                pattern: '^[^:]+:[^:]+$'
                description: Queue task target in queueNameSpace:queueName format. Set to null to clear.
              dispositionStates:
                type: array
                items:
                  type: object
                  required:
                    - name
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    description:
                      type: string
    responses:
      200:
        description: Successfully updated submission actions.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormDefinition'
      400:
        description: Request body does not conform to the required schema.
      401:
        description: User is not authenticated.
      403:
        description: User does not have the form-admin role.
      404:
        description: Form definition not found.

/form/v1/forms:
  get:
    tags:
      - Form
    description: >
      Find forms. Users with the form-service admin role, or the export-service export-job role, can find all
      forms of the tenant. When the criteria include definitionIdEquals, users with one of that definition's
      assessor roles can find its submitted forms. Other users only find the forms they created, and cannot
      use includeData.
    parameters:
      - name: top
        description: Number of forms to return in a page. Defaults to 10.
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 5000
      - name: includeData
        description: Flag indicating if form data should be included in results.
        in: query
        required: false
        schema:
          type: boolean
      - name: after
        description: Cursor for retrieving additional pages.
        in: query
        required: false
        schema:
          type: string
      - name: sortBy
        description: |
          Column to sort results on. Use 'created' or 'status' for form fields, and 'data.' followed by
          the path into the form data for a data value (e.g. 'data.applicant.lastName').
        in: query
        required: false
        schema:
          type: string
      - name: sortDirection
        description: Direction of the sort. Defaults to descending.
        in: query
        required: false
        schema:
          type: string
          enum: [asc, desc]
      - name: criteria
        description: Criteria for the forms to retrieve.
        in: query
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                anonymousApplicantEquals:
                  type: boolean
                definitionIdEquals:
                  type: string
                statusEquals:
                  type: string
                  enum: [draft, locked, submitted, archived]
                lastAccessedBefore:
                  type: string
                  format: date-time
                lockedBefore:
                  type: string
                  format: date-time
                createdByIdEquals:
                  type: string
                hashEquals:
                  type: string
                dataCriteria:
                  type: object
                  description: >
                    Values to match in the form data, keyed by the path into the data (e.g. 'applicant.lastName').
                    Text values are case-insensitive partial matches.
                  additionalProperties: true
    responses:
      200:
        description: Successfully retrieved forms.
        content:
          application/json:
            schema:
              type: object
              properties:
                results:
                  type: array
                  items:
                    $ref: '#/components/schemas/Form'
                page:
                  type: object
                  properties:
                    after:
                      type: string
                    next:
                      type: string
                    size:
                      type: number
                    total:
                      type: number
                      description: Total number of available forms before filters are applied.
      400:
        $ref: '#/components/responses/FormBadRequest'
      401:
        $ref: '#/components/responses/FormUnauthorized'
      403:
        $ref: '#/components/responses/FormForbidden'
  post:
    tags:
      - Form
    description: Creates a draft form.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              definitionId:
                type: string
              applicant:
                type: object
                properties:
                  id:
                    type: string
                    description: ID of an existing notification service subscriber to use as the applicant.
                  userId:
                    type: string
                  addressAs:
                    type: string
                  channels:
                    type: array
                    items:
                      type: object
                      properties:
                        channel:
                          type: string
                          enum: [email, sms]
                        address:
                          type: string
                      required: [channel, address]
              data:
                type: object
              files:
                type: object
                additionalProperties:
                  type: string
                  format: uri
              submit:
                type: boolean
