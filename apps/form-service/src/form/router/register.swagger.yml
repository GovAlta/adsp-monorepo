components:
  schemas:
    DataRegister:
      type: object
      required:
        - name
      properties:
        namespace:
          type: string
          description: Namespace of the data register. Always data-register.
        name:
          type: string
          description: Name of the data register.
        description:
          type: string
          description: Human-readable description of what the register contains.
        entries:
          type: array
          description: >
            List of values stored in the register, from its active revision, or its latest revision if none is
            active.
          items:
            oneOf:
              - type: string
              - type: object
    DataRegisterCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: >
            Name of the data register. Unique within the tenant. 1 to 50 letters, numbers, spaces, hyphens and
            underscores, not starting or ending with a space.
          pattern: '^[a-zA-Z0-9\-_](?:[a-zA-Z0-9\-_ ]{0,48}[a-zA-Z0-9\-_])?$'
        description:
          type: string
          description: Human-readable description of what the register contains.
        entries:
          type: array
          description: Initial list of values stored in the register. Defaults to an empty array.
          items:
            oneOf:
              - type: string
              - type: object
      additionalProperties: false
    DataRegisterUpdate:
      type: object
      description: >
        Partial update payload for a data register. Only provided fields are changed; omitting entries leaves the
        existing entries unchanged.
      properties:
        description:
          type: string
          description: Updated description for the register.
        entries:
          type: array
          description: Replacement list of values for the register.
          items:
            oneOf:
              - type: string
              - type: object
      additionalProperties: false

/form/v1/registers:
  get:
    tags:
      - Form
    description: >
      Retrieves the data registers that have both a definition and a data document, i.e. the registers manageable
      through this API. Requires the form-service admin role or the configuration-service configuration-admin role.
    responses:
      200:
        description: Successfully retrieved the list of data registers.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DataRegister'
            example:
              - namespace: data-register
                name: weekdays
                description: Days of the week
                entries:
                  - Monday
                  - Tuesday
                  - Wednesday
                  - Thursday
                  - Friday
      400:
        description: Request has no tenant context. A core user must specify the tenantId query parameter.
      401:
        description: User is not authenticated.
      403:
        description: User is not authorized. Requires the form-service admin or configuration-admin role.
      502:
        description: configuration-service returned an unexpected error.
  post:
    tags:
      - Form
    description: >
      Creates a new data register: its definition in the shared platform/configuration-service document, followed
      by its entries in a data-register/<name> configuration document. Requires the form-service admin role or the
      configuration-service configuration-admin role.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DataRegisterCreate'
          example:
            name: weekdays
            description: Days of the week
            entries:
              - Monday
              - Tuesday
              - Wednesday
              - Thursday
              - Friday
    responses:
      201:
        description: Successfully created the data register.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataRegister'
            example:
              namespace: data-register
              name: weekdays
              description: Days of the week
              entries:
                - Monday
                - Tuesday
                - Wednesday
                - Thursday
                - Friday
      400:
        description: >
          Request is not valid or has no tenant context, or configuration-service rejected the request.
      401:
        description: User is not authenticated.
      403:
        description: User is not authorized. Requires the form-service admin or configuration-admin role.
      409:
        description: A data register with this name already exists.
      502:
        description: configuration-service returned an unexpected error.

/form/v1/registers/{name}:
  get:
    tags:
      - Form
    description: >
      Retrieves a data register by name. Requires the form-service admin role or the configuration-service
      configuration-admin role.
    parameters:
      - name: name
        description: Name of the data register.
        required: true
        in: path
        schema:
          type: string
          pattern: '^[a-zA-Z0-9\-_](?:[a-zA-Z0-9\-_ ]{0,48}[a-zA-Z0-9\-_])?$'
    responses:
      200:
        description: Successfully retrieved the data register.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataRegister'
            example:
              namespace: data-register
              name: weekdays
              description: Days of the week
              entries:
                - Monday
                - Tuesday
                - Wednesday
                - Thursday
                - Friday
      400:
        description: Name is not valid, or the request has no tenant context.
      401:
        description: User is not authenticated.
      403:
        description: User is not authorized. Requires the form-service admin or configuration-admin role.
      404:
        description: >
          No data register with this name was found; it must have both a definition and a data document to be
          considered to exist.
      502:
        description: configuration-service returned an unexpected error.
  patch:
    tags:
      - Form
    description: >
      Updates the description and/or entries of an existing data register. Only provided fields are changed:
      sending description alone leaves the entries unchanged, and vice versa. Entries are written to the latest
      revision; if an older revision is pinned as active, the pin moves to that revision so the new entries are
      live. Requires the form-service admin role or the configuration-service configuration-admin role.
    parameters:
      - name: name
        description: Name of the data register.
        required: true
        in: path
        schema:
          type: string
          pattern: '^[a-zA-Z0-9\-_](?:[a-zA-Z0-9\-_ ]{0,48}[a-zA-Z0-9\-_])?$'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DataRegisterUpdate'
          example:
            description: Updated list of weekdays
            entries:
              - Monday
              - Tuesday
              - Wednesday
              - Thursday
              - Friday
    responses:
      200:
        description: Successfully updated the data register.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataRegister'
      400:
        description: >
          Request is not valid or has no tenant context, or configuration-service rejected the request.
      401:
        description: User is not authenticated.
      403:
        description: User is not authorized. Requires the form-service admin or configuration-admin role.
      404:
        description: No data register with this name was found.
      502:
        description: configuration-service returned an unexpected error.
  delete:
    tags:
      - Form
    description: >
      Deletes a data register: its entries and its definition. Removes whichever of the two parts still exists, so
      a retry after a partial failure succeeds. Forms that reference the register in a dropdown or list will lose
      its options. Requires the form-service admin role or the configuration-service configuration-admin role.
    parameters:
      - name: name
        description: Name of the data register to delete.
        required: true
        in: path
        schema:
          type: string
          pattern: '^[a-zA-Z0-9\-_](?:[a-zA-Z0-9\-_ ]{0,48}[a-zA-Z0-9\-_])?$'
    responses:
      204:
        description: Successfully deleted the data register.
      400:
        description: Name is not valid, or the request has no tenant context.
      401:
        description: User is not authenticated.
      403:
        description: User is not authorized. Requires the form-service admin or configuration-admin role.
      404:
        description: No data register with this name was found; neither a definition nor a data document exists.
      502:
        description: configuration-service returned an unexpected error.
