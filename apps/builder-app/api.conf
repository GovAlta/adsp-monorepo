# Token handler proxy for the preview of an application in the builder. The preview is served from the builder's
# origin, so the token handler's session cookie is set for the builder's site.
location /token-handler/ {
    proxy_pass http://token-handler:3333/token-handler/v1/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}
