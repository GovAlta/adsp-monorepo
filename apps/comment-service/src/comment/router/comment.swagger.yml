/comment/v1/comments:
  get:
    tags:
      - Comment
    description: >
      Searches comments across the topics of the tenant, newest first. Core users must set tenantId. With
      `criteria.typeIdEquals`, requires read access to the topic type: its admin, commenter, or reader roles (or
      comment-admin) in the tenant, or the export-service export-job role (`urn:ads:platform:export-service:export-job`)
      in the tenant; an unknown type responds 404. Without it, requires the comment-admin or export-job role in the
      tenant. Core roles don't grant access.
    parameters:
      - $ref: '#/components/parameters/CommentTenantId'
      - name: top
        description: Maximum number of comments to return. Defaults to 10. Must be a positive integer.
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 10
        example: 10
      - name: after
        description: >
          Cursor of the page to retrieve. Use the `page.next` value of the previous response to page sequentially
          through the results.
        in: query
        required: false
        schema:
          type: string
        example: MTA=
      - name: criteria
        description: >
          Criteria for the comments to retrieve, as URL-encoded JSON. Must be valid JSON. The text criteria are
          PostgreSQL full text searches of a single word or phrase.
        in: query
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                typeIdEquals:
                  type: string
                  description: Only comments on topics of the topic type.
                topicIdEquals:
                  type: integer
                titleLike:
                  type: string
                contentLike:
                  type: string
                titleOrContentLike:
                  type: string
                idGreaterThan:
                  type: integer
            example:
              typeIdEquals: case-notes
              titleOrContentLike: address
    responses:
      200:
        description: Comments retrieved successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                results:
                  type: array
                  items:
                    $ref: '#/components/schemas/Comment'
                page:
                  $ref: '#/components/schemas/CommentResultsPage'
            example:
              results:
                - topicId: 42
                  id: 1203
                  title: Follow up call
                  content: Called the applicant to confirm the mailing address.
                  context:
                    step: address-verification
                  createdBy:
                    id: 7d3c2a1b-4e5f-4a6b-8c9d-0e1f2a3b4c5d
                    name: Test User
                  createdOn: '2026-11-02T16:20:00.000Z'
                  lastUpdatedBy:
                    id: 7d3c2a1b-4e5f-4a6b-8c9d-0e1f2a3b4c5d
                    name: Test User
                  lastUpdatedOn: '2026-11-02T16:20:00.000Z'
              page:
                after: MTA=
                size: 1
      400:
        $ref: '#/components/responses/CommentBadRequest'
      401:
        $ref: '#/components/responses/CommentUnauthorized'
      403:
        $ref: '#/components/responses/CommentForbidden'
      404:
        $ref: '#/components/responses/CommentNotFound'
