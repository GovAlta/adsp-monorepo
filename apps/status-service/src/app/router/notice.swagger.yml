components:
  parameters:
    StatusNoticeId:
      name: id
      description: ID of the notice.
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      example: 6730c4f1a2b3c4d5e6f70812
  schemas:
    NoticeApplicationRef:
      type: object
      properties:
        id:
          description: The application's appKey (or ID).
          type: string
          example: my-application
        name:
          description: The name of the Application.
          type: string
          example: My Application
    Notice:
      description: Detailed information to be posted about an application's status.  The notice may include a message, a time period to which the notice applies, and the application status for the period.
      type: object
      properties:
        id:
          description: ID of the notice.
          type: string
          readOnly: true
          example: 6730c4f1a2b3c4d5e6f70812
        message:
          description: The message portion the notice.
          type: string
          example: My Application will be down for weekly maintenance during the following hours.
        tennantServRef:
          description: >
            The tennantServRef (sic) identifies which applications the notice applies to. Use isAllApplications for a
            notice that applies to all applications of the tenant.
          type: array
          items:
            $ref: '#/components/schemas/NoticeApplicationRef'
        isAllApplications:
          description: Indicates the notice applies to all applications of the tenant.
          type: boolean
          example: false
        startDate:
          description: The start of the time period to which the notice applies.
          type: string
          format: date-time
          example: '2026-11-15T02:00:00.000Z'
        endDate:
          description: The end of the time period to which the notice applies.
          type: string
          format: date-time
          example: '2026-11-15T04:00:00.000Z'
        mode:
          description: >
            A notice is created in draft mode, can be published, and a published notice can be archived. Only
            published notices are displayed on the public status page.
          type: string
          enum: [draft, published, archived]
          readOnly: true
          example: draft
        created:
          description: Time the notice was created.
          type: string
          format: date-time
          readOnly: true
          example: '2026-11-10T16:00:00.000Z'
        tenantId:
          description: URN identifying the tenant of the notice.
          type: string
          readOnly: true
          example: urn:ads:platform:tenant-service:v2:/tenants/61e9adcc9423490012a9ae46
        tenantName:
          description: Name of the tenant of the notice.
          type: string
          readOnly: true
          example: My Tenant
      example:
        id: 6730c4f1a2b3c4d5e6f70812
        message: My Application will be down for weekly maintenance during the following hours.
        tennantServRef:
          - id: my-application
            name: My Application
        isAllApplications: false
        startDate: '2026-11-15T02:00:00.000Z'
        endDate: '2026-11-15T04:00:00.000Z'
        mode: draft
        created: '2026-11-10T16:00:00.000Z'
        tenantId: urn:ads:platform:tenant-service:v2:/tenants/61e9adcc9423490012a9ae46
        tenantName: My Tenant
    Page:
      description: Page descriptor, used when paging through a list of items.
      type: object
      properties:
        after:
          description: Number of items skipped before this page.
          type: number
          example: 0
        size:
          description: The number of list items fetched.
          type: number
          example: 10
        next:
          description: >
            Query string for the next page (for example `after=10&top=10`), or null if this is the last page.
          type: string
          nullable: true
          example: after=10&top=10
        total:
          description: The total number of items in the list.
          type: number
          example: 231
      example:
        after: 0
        size: 10
        next: after=10&top=10
        total: 231

/notice/v1/notices:
  get:
    tags: [Notices]
    description: >
      Retrieves notices, newest first. Anonymous requests are accepted.

      - Anonymous requests read published notices; set `name` to read only the notices of that tenant (the name must
        be the name of an existing tenant).

      - Authenticated tenant users read the published notices of the tenant of their token; `name` is ignored.

      - Users with the status-admin role read all notices of the tenant of their token, or the notices in `mode`.
    security:
      - {}
      - accessToken: []
    parameters:
      - name: top
        description: Number of results to read.
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 50
          example: 10
      - name: after
        description: Number of results to skip, as returned in the _next_ query string of a previous page.
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          example: 10
      - name: mode
        description: >
          Mode of notices to read. Only used for users with the status-admin role; `active` reads all notices except
          archived ones.
        in: query
        required: false
        schema:
          type: string
          enum: [active, draft, published, archived]
      - name: name
        description: Name of the tenant to read published notices for (case insensitive). Only used for anonymous requests.
        in: query
        required: false
        schema:
          type: string
        example: my-tenant
    responses:
      200:
        description: Notices successfully retrieved.
        content:
          application/json:
            schema:
              type: object
              properties:
                results:
                  description: A list of notices that match the query
                  type: array
                  items:
                    $ref: '#/components/schemas/Notice'
                page:
                  $ref: '#/components/schemas/Page'
            example:
              results:
                - id: 6730c4f1a2b3c4d5e6f70812
                  message: My Application will be down for weekly maintenance during the following hours.
                  tennantServRef:
                    - id: my-application
                      name: My Application
                  isAllApplications: false
                  startDate: '2026-11-15T02:00:00.000Z'
                  endDate: '2026-11-15T04:00:00.000Z'
                  mode: published
                  created: '2026-11-10T16:00:00.000Z'
                  tenantId: urn:ads:platform:tenant-service:v2:/tenants/61e9adcc9423490012a9ae46
                  tenantName: My Tenant
              page:
                after: 0
                size: 1
                next: null
                total: 1
  post:
    tags: [Notices]
    description: >
      Creates a notice in draft mode for the tenant of the token. Requires the status-admin role.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [message, tennantServRef, startDate, endDate]
            properties:
              message:
                type: string
              tennantServRef:
                description: Applications the notice applies to. Send an empty array with isAllApplications set to true for all applications.
                type: array
                items:
                  $ref: '#/components/schemas/NoticeApplicationRef'
              isAllApplications:
                type: boolean
                default: false
              startDate:
                type: string
                format: date-time
              endDate:
                type: string
                format: date-time
          example:
            message: My Application will be down for weekly maintenance during the following hours.
            tennantServRef:
              - id: my-application
                name: My Application
            isAllApplications: false
            startDate: '2026-11-15T02:00:00.000Z'
            endDate: '2026-11-15T04:00:00.000Z'
    responses:
      201:
        description: Notice successfully created.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Notice'
      401:
        $ref: '#/components/responses/StatusUnauthorized'

/notice/v1/notices/{id}:
  parameters:
    - $ref: '#/components/parameters/StatusNoticeId'
  get:
    tags: [Notices]
    description: >
      Retrieves a notice of the tenant of the token. Requires an authenticated tenant user; published notices can be
      read by any user of the tenant, and other notices require the status-admin role.
    responses:
      200:
        description: Notice successfully retrieved.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Notice'
      401:
        $ref: '#/components/responses/StatusUnauthorized'
      404:
        $ref: '#/components/responses/StatusNotFound'
  patch:
    tags: [Notices]
    description: >
      Updates a notice of the tenant of the token. Requires the status-admin role. All fields of a draft notice can be
      updated, and a draft notice can be published but not archived. Only the mode of a published notice can be
      updated, to archive it or return it to draft. Archived notices cannot be updated. Publishing a notice sends the application-notice-published event.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              tennantServRef:
                type: array
                items:
                  $ref: '#/components/schemas/NoticeApplicationRef'
              isAllApplications:
                type: boolean
              startDate:
                type: string
                format: date-time
              endDate:
                type: string
                format: date-time
              mode:
                type: string
                enum: [draft, published, archived]
          examples:
            edit:
              summary: Edit a draft notice
              value:
                message: My Application will be down for maintenance during the following hours.
                endDate: '2026-11-15T05:00:00.000Z'
            publish:
              summary: Publish a draft notice
              value:
                mode: published
            archive:
              summary: Archive a published notice
              value:
                mode: archived
    responses:
      200:
        description: Notice successfully updated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Notice'
      400:
        description: The mode is not valid, or the change is not allowed for the current mode of the notice.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusError'
            example:
              errorMessage: 'Value not valid for Update notice: Archived notice cannot be updated.'
      401:
        $ref: '#/components/responses/StatusUnauthorized'
      404:
        $ref: '#/components/responses/StatusNotFound'
  delete:
    tags: [Notices]
    description: >
      Deletes a draft notice of the tenant of the token. Requires the status-admin role. Published and archived
      notices cannot be deleted and respond 401.
    responses:
      200:
        description: Notice successfully deleted. The response is the deleted notice.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Notice'
      401:
        $ref: '#/components/responses/StatusUnauthorized'
      404:
        $ref: '#/components/responses/StatusNotFound'
