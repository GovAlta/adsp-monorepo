components:
  schemas:
    Application:
      type: object
      properties:
        appKey:
          description: A unique ID generated when the application is added to the Status Service for monitoring.
          example: my-application
          type: string
        name:
          description: The name of the application being monitored.  The name must be unique for your Tenant.
          example: My Application
          type: string
        description:
          description: An optional, brief, description of the application being monitored.
          type: string
          example: The application which is mine!
        status:
          description: The operational status of the Application, set via the API or through the Tenant Admin Webapp
          type: string
          enum: [operational, reported-issues, maintenance, outage]
        monitorOnly:
          description: Indicates whether or not this application will be displayed on the public status page.
          type: boolean
        tenantId:
          description: URN identifying the tenant to which the application belongs.
          type: string
          example: urn:ads:platform:tenant-service:v2:/tenants/61e9adcc9423490012a9ae46
        enabled:
          description: Indicates whether or not monitoring for the application has been turned on.
          type: boolean
    PingData:
      type: object
      properties:
        url:
          description: The URL pinged.
          type: string
          example: 'http://google.com'
        ok:
          description: The success of the ping; set to false if the ping resulted in a 400 or 500 error.
          type: boolean
        timestamp:
          description: The time of the ping.
          type: string
          format: date-time
        responseTime:
          description: The response time of the ping, in ms.
          type: number
          example: 178
        status:
          description: The http status-code of the response.
          type: string
          example: 200
        applicationId:
          description: The application key, AKA application ID.
          type: string
          example: my-application

/status/v1/applications:
  get:
    tags: ['Application Monitoring']
    description: Retrieves tenant applications and their statuses.
    responses:
      200:
        description: Applications retrieved successfully.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Application'
  post:
    tags: ['Application Monitoring']
    description: >
      Adds an application to the tenant for monitoring. The application key is generated from the name if it is not
      provided. Requires an authenticated tenant user.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, endpoint]
            properties:
              appKey:
                type: string
                description: Key of the application. Generated from the name if not set.
                example: my-application
              name:
                type: string
                description: Name of the application. Must be unique for the tenant.
                example: My Application
              description:
                type: string
              endpoint:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    description: URL of the application endpoint to monitor.
                    example: https://my-application.alberta.ca/health
              monitorOnly:
                type: boolean
                description: If true, the application is not displayed on the public status page.
              status:
                type: string
                enum: [operational, reported-issues, maintenance, outage]
    responses:
      201:
        description: Application added.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Application'
      400:
        description: An application with the same key or name already exists.
      401:
        $ref: '#/components/responses/Unauthorized'

/status/v1/applications/{appKey}:
  parameters:
    - name: appKey
      description: The application key, AKA application ID.
      in: path
      required: true
      schema:
        type: string
        example: my-application
  put:
    tags: ['Application Monitoring']
    description: Updates the configuration of an application. Requires an authenticated tenant user.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [endpoint]
            properties:
              name:
                type: string
              description:
                type: string
              endpoint:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
              monitorOnly:
                type: boolean
              autoChangeStatus:
                type: boolean
                description: >
                  If true, health checks change the status from operational to reported-issues after failing for 5
                  minutes, and back to operational after succeeding for 5 minutes.
    responses:
      200:
        description: Application updated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Application'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        description: Application not found.
  delete:
    tags: ['Application Monitoring']
    description: >
      Deletes an application, and stops monitoring it if monitoring is enabled. Requires an authenticated tenant
      user.
    responses:
      204:
        description: Application deleted.
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        description: Application not found.

/status/v1/applications/{appKey}/enable:
  patch:
    tags: ['Application Monitoring']
    description: Request to start monitoring the application.
    parameters:
      - name: appKey
        description: The application key, AKA application ID.
        in: path
        required: true
        schema:
          type: string
          example: my-application
    responses:
      200:
        description: Monitoring has been enabled.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Application'

/status/v1/applications/{appKey}/disable:
  patch:
    tags: ['Application Monitoring']
    description: Request to stop monitoring the application.
    parameters:
      - name: appKey
        description: The application key, AKA application ID.
        in: path
        required: true
        schema:
          type: string
          example: my-application
    responses:
      200:
        description: Monitoring has been disabled.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Application'

/status/v1/applications/{appKey}/toggle:
  patch:
    tags: ['Application Monitoring']
    description: Request to toggle application monitoring, from enabled to disabled or vice versa.
    parameters:
      - name: appKey
        description: The application key, AKA application ID.
        in: path
        required: true
        schema:
          type: string
          example: my-application
    responses:
      200:
        description: Monitoring has been toggled.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Application'

/status/v1/applications/{appKey}/endpoint-status-entries:
  get:
    tags: ['Application Monitoring']
    description: Retrieves the raw results of the _pings_, gathered for the specified application.
    parameters:
      - name: appKey
        description: The application key, AKA application ID.
        in: path
        required: true
        schema:
          type: string
          example: my-application
      - name: top
        description: Number of results to read, defaults to 200
        in: query
        required: false
        schema:
          type: number
          example: 20
    responses:
      200:
        description: Data retrieved successfully
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PingData'
/status/v1/applications/endpoint-status-entries:
  get:
    tags: ['Application Monitoring']
    description: Retrieves the raw results of the _pings_, gathered for every application.
    parameters:
      - name: timeInMinutes
        description: Number of minutes to read data for, defaults to 30
        in: query
        required: false
        schema:
          type: number
          example: 20
    responses:
      200:
        description: Data retrieved successfully
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PingData'

/status/v1/webhook/{id}/test/{eventName}:
  get:
    tags: ['Application Monitoring']
    description: >
      Sends a test event to a webhook of a monitored application. The response is sent after a 2 second delay.
      Requires an authenticated tenant user.
    parameters:
      - name: id
        description: ID of the webhook.
        in: path
        required: true
        schema:
          type: string
      - name: eventName
        description: >
          Event to send. monitored-service-down sends a service down event; any other value sends a service up event.
        in: path
        required: true
        schema:
          type: string
          example: monitored-service-down
    responses:
      200:
        description: Test event sent. The response is a text summary of the event.
        content:
          application/json:
            schema:
              type: string
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        description: Webhook, or the application it targets, not found.
