components:
  parameters:
    CacheTenantId:
      name: tenantId
      description: >
        ID of the tenant to act on. Used by core (platform) users and by anonymous requests, which have no tenant in a
        token. Tenant users always act on the tenant of their token and this parameter is ignored for tenant
        resolution. The parameter is also forwarded to the upstream request as part of the query.
      in: query
      required: false
      schema:
        type: string
      example: urn:ads:platform:tenant-service:v2:/tenants/61f2e3a8c9b1d2e3f4a5b6c7
  responses:
    CacheBadRequest:
      description: >
        Request is invalid: there is no tenant context, tenantId isn't a valid ADSP URN, the client doesn't accept
        gzip encoding, or the resource path isn't allowed for the target (for example a path that resolves outside the
        upstream API, or an access service path for a realm other than the tenant's).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CacheError'
          example:
            errorMessage: Tenant context is required to read through cache.
    CacheUnauthorized:
      description: Request is anonymous, and the target doesn't allow anonymous requests (the access service target).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CacheError'
          example:
            errorMessage: Anonymous request through target is not allowed.
    CacheForbidden:
      description: Request has a user context, and the user doesn't have the cache-reader role.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CacheError'
          example:
            errorMessage: 'User Test User (ID: 0f6c3b2e-5a1d-4f7e-9b8c-2d4e6f8a1b3c) not permitted to read through cache.'
    CacheNotFound:
      description: The target isn't configured for the tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CacheError'
          example:
            errorMessage: cache target with ID 'urn:ads:platform:pdf-service:v1' could not be found.
  schemas:
    CacheError:
      type: object
      properties:
        errorMessage:
          type: string

/cache/v1/cache/{target}/{resource}:
  get:
    tags:
      - Cache
    description: >
      Reads a resource from an upstream target through the cache. The response, including its status, is cached and
      returned on subsequent matching requests until the target's TTL expires or an invalidation event removes it.
      The resource path may contain several segments (for example files/{fileId}/download); the route matches
      everything after the target as the resource path, and the query string is forwarded to the upstream request.


      Access: anonymous requests are allowed and share cache entries across anonymous users, except for the access
      service target (urn:ads:platform:access-service:v1), which requires a user. Requests with a bearer token require
      the cache-reader role in the tenant; core users with the cache-reader role are also allowed. The bearer token is
      passed to the upstream request and cache entries are per user context. A bearer token that fails validation is
      treated as an anonymous request.


      Tenancy: tenant users act on the tenant of their token. Core users and anonymous requests set the tenant with the
      tenantId query parameter; without a tenant the request is rejected with 400. Targets are read from the tenant's
      cache-service configuration combined with platform configuration; a target not configured for the tenant
      responds 404.
    parameters:
      - name: target
        description: >
          Service or API URN of the upstream target. Must be configured as a target for the tenant, and registered in
          the directory service.
        in: path
        required: true
        schema:
          type: string
          pattern: '^urn:ads:[a-zA-Z0-9-]{1,50}:[a-zA-Z0-9-]{1,50}(?::[a-zA-Z0-9-]{1,50})?$'
        example: urn:ads:platform:file-service:v1
      - name: resource
        description: >
          Path of the resource relative to the upstream target's URL. May contain `/`; send it unencoded. For the
          access service target, the path must start with the tenant's realm.
        in: path
        required: true
        schema:
          type: string
        example: files/52269261-45c0-434e-9467-a888f0bcb4b7
      - $ref: '#/components/parameters/CacheTenantId'
      - name: Accept-Encoding
        description: >
          Content encodings the client accepts. If set, it must include gzip or *, since cached content is returned in
          the encoding received from upstream.
        in: header
        required: false
        schema:
          type: string
        example: gzip, deflate, br
    responses:
      200:
        description: >
          Resource read through the cache. The status, content, and the Content-Type, Content-Encoding,
          Content-Length, Cache-Control, and Content-Disposition headers are those of the upstream response.
        headers:
          adsp-cache-status:
            description: HIT if the response was returned from cache, and MISS if it was requested from upstream.
            schema:
              type: string
              enum: [HIT, MISS]
            example: HIT
        content:
          application/json:
            schema:
              type: object
              description: Upstream response content; the shape depends on the target and resource.
              example:
                id: 52269261-45c0-434e-9467-a888f0bcb4b7
                filename: application-form.pdf
                size: 248133
                typeName: Application attachment
                recordId: urn:ads:my-tenant:my-service:v1:/applications/63a0d1f5e4b0c2a1d3e5f7a9
                created: '2026-01-15T17:42:08.000Z'
                lastAccessed: '2026-01-16T09:12:44.000Z'
                scanned: true
                infected: false
      400:
        $ref: '#/components/responses/CacheBadRequest'
      401:
        $ref: '#/components/responses/CacheUnauthorized'
      403:
        $ref: '#/components/responses/CacheForbidden'
      404:
        $ref: '#/components/responses/CacheNotFound'
      default:
        description: >
          Any other status returned by the upstream target (for example 404 for a resource the upstream API doesn't
          have) is passed through with its content and the adsp-cache-status header. Upstream responses with a 5xx
          status are passed through but not cached.
