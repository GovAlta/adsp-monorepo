components:
  parameters:
    TokenHandlerClientId:
      name: clientId
      description: ID of the client, as configured in the token handler configuration of the tenant or the core configuration.
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 50
      example: my-client
    TokenHandlerTenantHeader:
      name: X-ADSP-TENANT
      description: >-
        Name or URN of the tenant, for example set by the reverse proxy of an application to restrict it to one tenant.
        The name can be the tenant name as it is (ignoring case) or in kebab-case form, with hyphens in place of
        spaces.
      in: header
      required: false
      schema:
        type: string
        maxLength: 100
      example: my-tenant
  responses:
    TokenHandlerBadRequest:
      description: Request is invalid, for example a path, query, or body parameter failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenHandlerError'
          example:
            errorMessage: 'Validation failed with error(s): id (params) - Invalid value'
    TokenHandlerUnauthorized:
      description: >-
        Request does not include a valid bearer token from a tenant realm. Tokens from the core (platform) realm are
        not accepted.
      content:
        text/plain:
          schema:
            type: string
          example: Unauthorized
    TokenHandlerForbidden:
      description: User does not have the token-handler-admin role in the tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenHandlerError'
          example:
            errorMessage: 'User Test User (ID: 0a1b2c3d-4e5f-6789-abcd-ef0123456789) not permitted to get clients.'
    TokenHandlerClientNotFound:
      description: No client with the ID is configured for the tenant or in the core configuration.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenHandlerError'
          example:
            errorMessage: client with ID 'my-client' could not be found.
    TokenHandlerTooManyRequests:
      description: >-
        Sign in, callback, and logout requests are rate limited to 100 requests per 5 minutes for each client IP
        address. The RateLimit and RateLimit-Policy headers describe the limit.
      content:
        text/plain:
          schema:
            type: string
          example: Too many requests, please try again later.
  schemas:
    TokenHandlerError:
      type: object
      properties:
        errorMessage:
          type: string
      example:
        errorMessage: client with ID 'my-client' could not be found.
    AuthenticationClient:
      type: object
      properties:
        id:
          type: string
          description: ID of the client.
        clientId:
          type: string
          readOnly: true
          description: Client ID of the registered client in access service. Not set if the client is not registered.
        authCallbackUrl:
          type: string
          deprecated: true
          description: Deprecated callback URL of the client configuration. Use the callbackUrl query parameter to sign in instead.
        successRedirectUrl:
          type: string
          description: URL the browser is redirected to after sign in succeeds. Defaults to the root of the site.
        failureRedirectUrl:
          type: string
          description: URL the browser is redirected to after sign in fails. Defaults to the root of the site.
      example:
        id: my-client
        clientId: 3f2a9c1e-7b4d-4e8a-9c2f-1a2b3c4d5e6f
        successRedirectUrl: /
        failureRedirectUrl: /sign-in-failed
    ClientSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        core:
          type: boolean
          readOnly: true
          description: Whether the client is from the core configuration, which provides it to all tenants.
        idpHint:
          type: string
          description: Identity provider hint passed to access service when signing in.
        successRedirectUrl:
          type: string
        failureRedirectUrl:
          type: string
        redirectUris:
          type: array
          description: Redirect URIs that are registered with access service when the client is registered.
          items:
            type: string
        targets:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              upstream:
                type: string
                description: URN of the upstream service or API, resolved by the directory service.
        registered:
          type: boolean
          readOnly: true
          description: Whether the client is registered with access service for the tenant.
        clientId:
          type: string
          readOnly: true
          description: Client ID of the registered client in access service. Not set if the client is not registered.
      example:
        id: my-client
        name: My application
        description: Client for the my application frontend.
        core: false
        successRedirectUrl: /
        failureRedirectUrl: /
        redirectUris:
          - https://myapp.example.ca/token-handler/clients/my-client/callback
        targets:
          - id: form-service
            upstream: urn:ads:platform:form-service
        registered: true
        clientId: 3f2a9c1e-7b4d-4e8a-9c2f-1a2b3c4d5e6f

/token-handler/v1/clients:
  get:
    tags:
      - Client
    description: >-
      Retrieves the clients available to the tenant, including the clients of the core configuration that are available
      to all tenants, with their registration status.


      Requires the token-handler-admin role. The caller acts on the tenant of their bearer token, which must be from a
      tenant realm.
    parameters:
      - name: core
        description: Set to true to only retrieve the clients of the core configuration.
        in: query
        required: false
        schema:
          type: boolean
        example: true
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ClientSummary'
      400:
        $ref: '#/components/responses/TokenHandlerBadRequest'
      401:
        $ref: '#/components/responses/TokenHandlerUnauthorized'
      403:
        $ref: '#/components/responses/TokenHandlerForbidden'

/token-handler/v1/clients/{clientId}:
  parameters:
    - $ref: '#/components/parameters/TokenHandlerClientId'
  get:
    tags:
      - Client
    description: >-
      Retrieves an authentication client and its registration.


      Requires the token-handler-admin role. The caller acts on the tenant of their bearer token, which must be from a
      tenant realm. The client is looked up before the role is checked, so an unknown client responds 404 for any
      caller.
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationClient'
      400:
        $ref: '#/components/responses/TokenHandlerBadRequest'
      401:
        $ref: '#/components/responses/TokenHandlerUnauthorized'
      403:
        $ref: '#/components/responses/TokenHandlerForbidden'
      404:
        $ref: '#/components/responses/TokenHandlerClientNotFound'
  post:
    tags:
      - Client
    description: >-
      Registers an authentication client in the tenant's realm in access service. If provided, the authCallbackUrl is
      registered with access service as a valid redirect URI, together with the redirectUris of the client
      configuration, and is not stored in the token handler configuration. Otherwise the client is registered with only
      the configured redirectUris, and more can be added directly in access service. Registering a client that is
      already registered replaces its registration; the previously registered client in access service is deleted,
      including any redirect URIs configured on it. Sends the client-registered event.


      Requires the token-handler-admin role. The caller acts on the tenant of their bearer token, which must be from a
      tenant realm.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - registrationToken
            properties:
              registrationToken:
                type: string
                minLength: 1
                maxLength: 8192
                description: Initial access token for client registration, from the tenant realm in access service.
              authCallbackUrl:
                type: string
                format: uri
                maxLength: 2048
                description: >-
                  Optional http or https callback URL to register with access service as a valid redirect URI. Add
                  redirect URIs for additional environments directly in access service after registration.
          example:
            registrationToken: eyJhbGciOiJIUzI1NiJ9.eyJ0eXAiOiJJbml0aWFsQWNjZXNzVG9rZW4ifQ.c2lnbmF0dXJl
            authCallbackUrl: https://myapp.example.ca/token-handler/clients/my-client/callback
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                registered:
                  type: boolean
            example:
              registered: true
      400:
        description: >-
          Request is invalid, for example a parameter failed validation, or access service rejected the registration
          token.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenHandlerError'
            example:
              errorMessage: Registration request failed. Verify registration token.
      401:
        $ref: '#/components/responses/TokenHandlerUnauthorized'
      403:
        $ref: '#/components/responses/TokenHandlerForbidden'
      404:
        $ref: '#/components/responses/TokenHandlerClientNotFound'
  put:
    tags:
      - Client
    description: >-
      Updates the registered redirect URIs for the authentication client in access service, replacing the current
      ones. Uses the stored management token from the registration; no external token is required. Sends the
      client-registered event.


      Requires the token-handler-admin role. The caller acts on the tenant of their bearer token, which must be from a
      tenant realm.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - redirectUris
            properties:
              redirectUris:
                type: array
                minItems: 1
                items:
                  type: string
                  format: uri
                  maxLength: 2048
                description: List of http or https redirect URIs to register with access service.
          example:
            redirectUris:
              - https://myapp.example.ca/token-handler/clients/my-client/callback
              - http://localhost:4200/token-handler/clients/my-client/callback
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                updated:
                  type: boolean
            example:
              updated: true
      400:
        description: >-
          Request is invalid, for example a parameter failed validation, the client is not registered, or access
          service rejected the stored registration token.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenHandlerError'
            example:
              errorMessage: Client not registered.
      401:
        $ref: '#/components/responses/TokenHandlerUnauthorized'
      403:
        $ref: '#/components/responses/TokenHandlerForbidden'
      404:
        $ref: '#/components/responses/TokenHandlerClientNotFound'

/token-handler/v1/clients/{clientId}/auth:
  parameters:
    - $ref: '#/components/parameters/TokenHandlerClientId'
    - name: tenant
      description: >-
        Name or URN of the tenant. The tenant is kept in the session for the callback. Required unless the
        X-ADSP-TENANT header is provided, which is used instead if both are provided.
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 100
      example: my-tenant
    - name: callbackUrl
      description: >-
        http or https URL of the callback of the application, which is a valid redirect URI of the client in access
        service. Required unless the client has the deprecated authCallbackUrl configuration.
      in: query
      required: false
      schema:
        type: string
        format: uri
        maxLength: 2048
      example: https://myapp.example.ca/token-handler/clients/my-client/callback
    - $ref: '#/components/parameters/TokenHandlerTenantHeader'
  get:
    tags:
      - Client
    description: >-
      Initiates sign in via the client by redirecting the browser to the access service authorization endpoint of the
      tenant's realm. This is a browser navigation, not an API call.


      Anonymous: no bearer token or role is required. The tenant comes from the X-ADSP-TENANT header or the tenant
      query parameter, and the client must be registered for that tenant.
    security: []
    responses:
      302:
        description: Redirect to the access service authorization endpoint to sign in.
        headers:
          Location:
            description: URL of the access service authorization endpoint.
            schema:
              type: string
            example: >-
              https://access.adsp.alberta.ca/auth/realms/my-realm/protocol/openid-connect/auth?response_type=code&client_id=3f2a9c1e-7b4d-4e8a-9c2f-1a2b3c4d5e6f&redirect_uri=https%3A%2F%2Fmyapp.example.ca%2Ftoken-handler%2Fclients%2Fmy-client%2Fcallback&scope=openid&state=Zm9vYmFy
      400:
        description: >-
          Request is invalid, for example a parameter failed validation, no tenant is provided, no callbackUrl is
          provided for a client without authCallbackUrl, or the client is not registered for the tenant.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenHandlerError'
            example:
              errorMessage: Tenant identity is required in the x-adsp-tenant header or the tenant query parameter.
      404:
        description: The tenant or the client is not found.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenHandlerError'
            example:
              errorMessage: tenant with ID 'my-tenant' could not be found.
      429:
        $ref: '#/components/responses/TokenHandlerTooManyRequests'

/token-handler/v1/clients/{clientId}/callback:
  parameters:
    - $ref: '#/components/parameters/TokenHandlerClientId'
    - name: code
      description: Authorization code from access service.
      in: query
      required: false
      schema:
        type: string
      example: 1b2c3d4e-5f60-7182-93a4-b5c6d7e8f901
    - name: state
      description: State from access service, which must match the state of the sign in started on the same session.
      in: query
      required: false
      schema:
        type: string
      example: Zm9vYmFy
    - name: X-ADSP-TENANT
      description: >-
        Name or URN of the tenant. If it is not provided, the tenant that was provided to sign in on the same session
        is used.
      in: header
      required: false
      schema:
        type: string
        maxLength: 100
      example: my-tenant
  get:
    tags:
      - Client
    description: >-
      Completes sign in via the client. Access service redirects the browser here with the authorization code. On
      success the token handler starts a session (the adsp_tk_session cookie), sets the XSRF-TOKEN cookie, and
      redirects to the successRedirectUrl of the client. Otherwise, including when sign in was not started on the same
      session, the client is not registered, or access service responds with an error, it redirects to the
      failureRedirectUrl.


      Anonymous: no bearer token or role is required. The request must be on the session in which sign in was started.
    security: []
    responses:
      302:
        description: Redirect to the successRedirectUrl or the failureRedirectUrl of the client.
        headers:
          Location:
            description: The successRedirectUrl or the failureRedirectUrl of the client. Both default to the root of the site.
            schema:
              type: string
            example: /
          Set-Cookie:
            description: The adsp_tk_session session cookie and the XSRF-TOKEN cookie, set when sign in succeeds.
            schema:
              type: string
            example: XSRF-TOKEN=6f1c2d3e4a5b69788796a5b4c3d2e1f0; Path=/; Secure; SameSite=Strict
      400:
        description: >-
          Request is invalid: the client ID failed validation, or no tenant is provided in the X-ADSP-TENANT header
          or from signing in on the same session.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenHandlerError'
            example:
              errorMessage: >-
                Tenant identity is required in the x-adsp-tenant header, or from signing in on the same session.
      404:
        description: The tenant or the client is not found.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenHandlerError'
            example:
              errorMessage: client with ID 'my-client' could not be found.
      429:
        $ref: '#/components/responses/TokenHandlerTooManyRequests'

/token-handler/v1/clients/{clientId}/logout:
  parameters:
    - $ref: '#/components/parameters/TokenHandlerClientId'
  get:
    tags:
      - Client
    description: >-
      Logs the user out by ending their session in the token handler, and redirects to the root of the site. If the
      client is configured with keycloakLogout, redirects to the access service end session endpoint instead, which
      ends the user's session there and returns to the root of the site. Requests that another site caused the browser
      to make (Sec-Fetch-Site cross-site) only end the token handler session.


      Requires a signed in user on the session cookie, authenticated by the same client; no role is required.
    security:
      - sessionCookie: []
    responses:
      302:
        description: User logged out and redirected.
        headers:
          Location:
            description: The root of the site, or the access service end session endpoint if the client has keycloakLogout.
            schema:
              type: string
            example: /
      400:
        description: No user is signed in, the user was not authenticated by the client, or the client ID failed validation.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenHandlerError'
            example:
              errorMessage: No user to logout.
      429:
        $ref: '#/components/responses/TokenHandlerTooManyRequests'
