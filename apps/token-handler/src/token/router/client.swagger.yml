components:
  schemas:
    AuthenticationClient:
      type: object
      properties:
        id:
          type: string
        clientId:
          type: string
        authCallbackUrl:
          type: string
        successRedirectUrl:
          type: string
        failureRedirectUrl:
          type: string

/token-handler/v1/clients/{clientId}:
  parameters:
    - name: clientId
      description: ID of the client.
      in: path
      required: true
      schema:
        type: string
  get:
    tags:
      - Client
    description: Retrieves authentication client.
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticationClient"
      401:
        description: Not authorized.
      403:
        description: User not permitted for requested operation.
  post:
    tags:
      - Client
    description: Registers an authentication client. If provided, the authCallbackUrl is registered with access service as a valid redirect URI and is not stored in the token handler configuration. Otherwise the client is registered without redirect URIs, which can be added directly in access service. Registering a client that is already registered replaces its registration; the previously registered client in access service is deleted, including any redirect URIs configured on it.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              registrationToken:
                type: string
                description: Client registration token from tenant realm.
              authCallbackUrl:
                type: string
                description: Optional callback URL to register with access service as a valid redirect URI. Add redirect URIs for additional environments directly in access service after registration.
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                registered:
                  type: boolean
      401:
        description: Not authorized.
      403:
        description: User not permitted for requested operation.
  put:
    tags:
      - Client
    description: Updates the registered redirect URIs for the authentication client in access service. Uses the stored management token from initial registration; no external token required.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              redirectUris:
                type: array
                items:
                  type: string
                description: List of redirect URIs to register with access service.
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                updated:
                  type: boolean
      401:
        description: Not authorized.
      403:
        description: User not permitted for requested operation.

/token-handler/v1/clients/{clientId}/auth:
  parameters:
    - name: clientId
      description: ID of the client.
      in: path
      required: true
      schema:
        type: string
    - name: tenant
      description: >-
        Name or URN of the tenant. The tenant is kept in the session for the callback. Required unless the
        X-ADSP-TENANT header is provided, which is used instead if both are provided.
      in: query
      required: false
      schema:
        type: string
    - name: callbackUrl
      description: >-
        URL of the callback of the application, which is a valid redirect URI of the client in access service. Required
        unless the client has the deprecated authCallbackUrl configuration.
      in: query
      required: false
      schema:
        type: string
    - name: X-ADSP-TENANT
      description: >-
        Name or URN of the tenant, for example set by the reverse proxy of an application to restrict it to one tenant.
        Used instead of the tenant query parameter.
      in: header
      required: false
      schema:
        type: string
  get:
    tags:
      - Client
    description: Initiates authentication via the client.
    security: []
    responses:
      302:
        description: Redirect to authenticate.
      400:
        description: Bad request.
      401:
        description: Not authorized.

/token-handler/v1/clients/{clientId}/callback:
  parameters:
    - name: clientId
      description: ID of the client.
      in: path
      required: true
      schema:
        type: string
    - name: X-ADSP-TENANT
      description: >-
        Name or URN of the tenant. If it is not provided, the tenant that was provided to sign in on the same session
        is used.
      in: header
      required: false
      schema:
        type: string
  get:
    tags:
      - Client
    description: Completes authentication via the client.
    security: []
    responses:
      200:
        description: Request completed successfully.

/token-handler/v1/clients/{clientId}/logout:
  parameters:
    - name: clientId
      description: ID of the client.
      in: path
      required: true
      schema:
        type: string
  get:
    tags:
      - Client
    description: >-
      Logs the user out by ending their session in the token handler, and redirects to the root of the site. If the
      client is configured with keycloakLogout, redirects to the access service end session endpoint instead, which
      ends the user's session there and returns to the root of the site.
    security:
      - sessionCookie: []
    responses:
      302:
        description: User logged out and redirected.
      400:
        description: No user is logged in, or the user was not authenticated by the client.
