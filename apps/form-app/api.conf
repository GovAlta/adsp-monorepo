# API proxy routes for form-app
location /api/ {
    # nginx defaults to 1m, which rejects anonymous file uploads with 413 (CS-3853).
    # Upper bound for anonymous uploads (1GB); the extra 1m leaves room for multipart headers.
    # Forms show a 5MB limit by default and can raise it up to 1GB.
    client_max_body_size 1025m;
    proxy_pass http://form-gateway:3333/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}
