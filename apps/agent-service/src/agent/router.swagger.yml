components:
  schemas:
    TextPart:
      type: object
      properties:
        type:
          type: string
          enum: [text]
        text:
          type: string
      required: [type, text]
    ImagePart:
      type: object
      properties:
        type:
          type: string
          enum: [image]
        image:
          type: string
        mediaType:
          type: string
      required: [type, image]
    FilePart:
      type: object
      properties:
        type:
          type: string
          enum: [file]
        filename:
          type: string
        data:
          type: string
        mediaType:
          type: string
      required: [type, data, mediaType]
    UserMessage:
      type: object
      properties:
        content:
          oneOf:
            - type: array
              items:
                oneOf:
                  - $ref: "#/components/schemas/TextPart"
                  - $ref: "#/components/schemas/ImagePart"
                  - $ref: "#/components/schemas/FilePart"
                discriminator:
                  propertyName: type
                  mapping:
                    text: "#/components/schemas/TextPart"
                    image: "#/components/schemas/ImagePart"
                    file: "#/components/schemas/FilePart"
            - type: string

/agent/v1/access/scope:
  get:
    tags:
      - Agent
    description: >-
      Gets the Access Service environment and realm the current user may inspect (read-only). Determined from the
      verified user token only; no AI is involved. Returns status "unavailable" with a reason and message, rather
      than an error, when the user cannot inspect (for example, a missing role).
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [available, unavailable]
                reason:
                  type: string
                  enum: [NO_SESSION, MISSING_ROLE, UNKNOWN_ENVIRONMENT, ENVIRONMENT_MISMATCH, REALM_MISMATCH]
                message:
                  type: string
                missingRoles:
                  type: array
                  items:
                    type: string
                readOnly:
                  type: boolean
                environment:
                  type: object
                  properties:
                    id:
                      type: string
                      enum: [dev, uat, prod, local]
                    label:
                      type: string
                    host:
                      type: string
                    readOnly:
                      type: boolean
                realm:
                  type: object
                  properties:
                    id:
                      type: string
                    kind:
                      type: string
                      enum: [tenant, core]
              required: [status, message]

/agent/v1/agents:
  get:
    tags:
      - Agent
    description: Gets all agent names.
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string

/agent/v1/agents/{agentId}:
  parameters:
    - name: agentId
      description: ID of the agent.
      example: userGuideAgent
      in: path
      required: true
      schema:
        type: string
  get:
    tags:
      - Agent
    description: Gets a specified agent.
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
  post:
    tags:
      - Agent
    description: Sends a generate request to an agent.
    requestBody:
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/UserMessage"
              - type: array
                items:
                  $ref: "#/components/schemas/UserMessage"
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                agent:
                  type: string
                content:
                  type: string
                output:
                  type: object
                  additionalProperties: true
                  nullable: true

/agent/v1/agents/{agentId}/threads/{threadId}:
  parameters:
    - name: agentId
      description: ID of the agent.
      example: AccessServiceAgent
      in: path
      required: true
      schema:
        type: string
    - name: threadId
      description: ID of the conversation thread.
      example: 0f8fad5b-d9cb-469f-a165-70867728950e
      in: path
      required: true
      schema:
        type: string
  delete:
    tags:
      - Agent
    description: >-
      Deletes one of the signed-in user's own conversation threads, with its stored messages, observations and
      workspace, so a new chat starts without its context. Returns deleted false when the user has no thread with
      this ID, including one that belongs to another user, so repeating the request is harmless.
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                deleted:
                  type: boolean
              required: [deleted]
