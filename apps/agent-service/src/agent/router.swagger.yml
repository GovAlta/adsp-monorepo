components:
  parameters:
    AgentTenantId:
      name: tenantId
      description: >-
        ID of the tenant to act on. Only used for core (platform) users; tenant users always act on the tenant of
        their token and this parameter is ignored. Without it, core users see only the platform (core) agents. Must be
        the full URN of an existing tenant.
      in: query
      required: false
      schema:
        type: string
      example: urn:ads:platform:tenant-service:v2:/tenants/61f2e3a8c9b1d2e3f4a5b6c7
    AgentId:
      name: agentId
      description: ID of the agent, as configured in the agent-service configuration.
      in: path
      required: true
      schema:
        type: string
      example: formGenerationAgent
    ThreadId:
      name: threadId
      description: ID of the conversation thread, as sent as threadId on the socket.io message event.
      in: path
      required: true
      schema:
        type: string
      example: 0f8fad5b-d9cb-469f-a165-70867728950e
  responses:
    AgentBadRequest:
      description: >-
        Request is invalid, for example the tenantId query parameter is not a valid ADSP ID, or the request body is
        not valid JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentError'
          example:
            errorMessage: 'ADSP ID (my-tenant) must begin with: urn:ads:'
    AgentUnauthorized:
      description: Request does not include a valid bearer token.
      content:
        text/plain:
          schema:
            type: string
          example: Unauthorized
    AgentForbidden:
      description: The agent is configured with userRoles and the user does not have any of them in the tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentError'
          example:
            errorMessage: 'User Test User (ID: 7d2b6c3e-1f4a-4b8e-9c0d-2a5e6f7b8c9d) not permitted to use agent.'
    AgentNotFound:
      description: No agent with the ID is configured for the tenant or the platform.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentError'
          example:
            errorMessage: Agent with ID 'my-assistant' could not be found.
  schemas:
    AgentError:
      type: object
      properties:
        errorMessage:
          type: string
      required: [errorMessage]
    TextPart:
      type: object
      properties:
        type:
          type: string
          enum: [text]
        text:
          type: string
      required: [type, text]
      example:
        type: text
        text: Which fields should a business licence renewal form include?
    ImagePart:
      type: object
      properties:
        type:
          type: string
          enum: [image]
        image:
          type: string
          description: Image as a base64 string, data URL, or URL.
        mediaType:
          type: string
      required: [type, image]
      example:
        type: image
        image: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==
        mediaType: image/png
    FilePart:
      type: object
      properties:
        type:
          type: string
          enum: [file]
        filename:
          type: string
        data:
          type: string
          description: File content as a base64 string or data URL.
        mediaType:
          type: string
      required: [type, data, mediaType]
      example:
        type: file
        filename: renewal-application.pdf
        data: JVBERi0xLjQKJcOkw7zDtsOfCjIgMCBvYmoKPDwvTGVuZ3RoIDMgMCBSPj4Kc3RyZWFtCg==
        mediaType: application/pdf
    UserMessage:
      type: object
      description: >-
        A message from the user. content is required: either text, or an array of text, image, and file parts.
      properties:
        content:
          oneOf:
            - type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/TextPart'
                  - $ref: '#/components/schemas/ImagePart'
                  - $ref: '#/components/schemas/FilePart'
                discriminator:
                  propertyName: type
                  mapping:
                    text: '#/components/schemas/TextPart'
                    image: '#/components/schemas/ImagePart'
                    file: '#/components/schemas/FilePart'
            - type: string
      required: [content]
      example:
        content: Which fields should a business licence renewal form include?
    AgentSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required: [id, name]
      example:
        id: formGenerationAgent
        name: Form Generation Agent
    AgentList:
      type: object
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentSummary'
      required: [agents]
      example:
        agents:
          - id: formGenerationAgent
            name: Form Generation Agent
          - id: my-assistant
            name: My Assistant
    AgentGenerateResponse:
      type: object
      properties:
        agent:
          type: string
          description: ID of the agent that responded.
        content:
          type: string
          description: Text of the agent's response.
        output:
          type: object
          additionalProperties: true
          nullable: true
          description: >-
            Structured output matching the agent's outputSchema. Absent when the agent has no outputSchema, or when
            the output did not match it.
      required: [agent, content]
      example:
        agent: data-extractor
        content: The message mentions one organization and is positive overall.
        output:
          entities:
            - name: Service Alberta
              type: organization
          sentiment: positive
    AccessScope:
      type: object
      properties:
        status:
          type: string
          enum: [available, unavailable]
        reason:
          type: string
          description: Why the scope is unavailable. Only present when status is unavailable.
          enum: [NO_SESSION, MISSING_ROLE, UNKNOWN_ENVIRONMENT, ENVIRONMENT_MISMATCH, REALM_MISMATCH]
        message:
          type: string
        missingRoles:
          type: array
          description: Roles the user needs. Only present when reason is MISSING_ROLE.
          items:
            type: string
        readOnly:
          type: boolean
        environment:
          type: object
          properties:
            id:
              type: string
              enum: [dev, uat, prod, local]
            label:
              type: string
            host:
              type: string
            readOnly:
              type: boolean
        realm:
          type: object
          properties:
            id:
              type: string
            kind:
              type: string
              enum: [tenant, core]
      required: [status, message]
      example:
        status: available
        message: You can inspect the 3c1f9a52-6b7d-4e8a-9f0b-1c2d3e4f5a6b realm in Production (read-only).
        environment:
          id: prod
          label: Production
          host: https://access.alberta.ca
          readOnly: true
        realm:
          id: 3c1f9a52-6b7d-4e8a-9f0b-1c2d3e4f5a6b
          kind: tenant
        readOnly: true
    ThreadDeletion:
      type: object
      properties:
        deleted:
          type: boolean
      required: [deleted]
      example:
        deleted: true

/agent/v1/access/scope:
  get:
    tags:
      - Agent
    description: >-
      Gets the Access Service environment and realm the current user may inspect (read-only). Available to any
      authenticated user; it deliberately does not require the agent-user role, so that it can tell users which role
      they are missing. Determined from the verified user token only; no AI is involved and no tenant data is read.
      Returns status "unavailable" with a reason and message, rather than an error, when the user cannot inspect (for
      example, without the urn:ads:platform:agent-service:agent-user role).
    parameters:
      - $ref: '#/components/parameters/AgentTenantId'
    responses:
      200:
        description: Access scope successfully determined.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessScope'
            examples:
              available:
                summary: User can inspect their tenant realm
                value:
                  status: available
                  message: You can inspect the 3c1f9a52-6b7d-4e8a-9f0b-1c2d3e4f5a6b realm in Production (read-only).
                  environment:
                    id: prod
                    label: Production
                    host: https://access.alberta.ca
                    readOnly: true
                  realm:
                    id: 3c1f9a52-6b7d-4e8a-9f0b-1c2d3e4f5a6b
                    kind: tenant
                  readOnly: true
              missingRole:
                summary: User does not have the agent-user role
                value:
                  status: unavailable
                  reason: MISSING_ROLE
                  message: >-
                    You do not have the role needed to inspect the Access Service. Ask your tenant administrator to
                    assign it.
                  missingRoles:
                    - urn:ads:platform:agent-service:agent-user
      400:
        $ref: '#/components/responses/AgentBadRequest'
      401:
        $ref: '#/components/responses/AgentUnauthorized'

/agent/v1/agents:
  get:
    tags:
      - Agent
    description: >-
      Gets the ID and name of every agent available in the tenant: the platform (core) agents and the agents the
      tenant has configured. Available to any authenticated user; no role is required, and agents restricted by
      userRoles are listed too. A platform agent replaces a tenant agent with the same ID.
    parameters:
      - $ref: '#/components/parameters/AgentTenantId'
    responses:
      200:
        description: Agents successfully retrieved.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentList'
      400:
        $ref: '#/components/responses/AgentBadRequest'
      401:
        $ref: '#/components/responses/AgentUnauthorized'

/agent/v1/agents/{agentId}:
  parameters:
    - $ref: '#/components/parameters/AgentId'
    - $ref: '#/components/parameters/AgentTenantId'
  get:
    tags:
      - Agent
    description: >-
      Gets the ID and name of an agent. Available to any authenticated user; no role is required, even for agents
      restricted by userRoles. An agent ID that is not configured for the tenant or the platform responds 404.
    responses:
      200:
        description: Agent successfully retrieved.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSummary'
      400:
        $ref: '#/components/responses/AgentBadRequest'
      401:
        $ref: '#/components/responses/AgentUnauthorized'
      404:
        $ref: '#/components/responses/AgentNotFound'
  post:
    tags:
      - Agent
    description: >-
      Sends one or more user messages to an agent and responds with its complete reply. Available to any
      authenticated user when the agent has no userRoles; otherwise the user needs one of the agent's userRoles in the
      tenant, so core users can only use agents without userRoles. The agent-user role is not checked on this
      operation. Each request starts a new thread, so the agent has no context from earlier requests; use the
      socket.io interface for multi-turn conversations and streaming.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/UserMessage'
              - type: array
                items:
                  $ref: '#/components/schemas/UserMessage'
          examples:
            text:
              summary: Text message
              value:
                content: Which fields should a business licence renewal form include?
            parts:
              summary: Message with a file attachment
              value:
                content:
                  - type: text
                    text: Summarize the attached application.
                  - type: file
                    filename: renewal-application.pdf
                    data: JVBERi0xLjQKJcOkw7zDtsOfCjIgMCBvYmoKPDwvTGVuZ3RoIDMgMCBSPj4Kc3RyZWFtCg==
                    mediaType: application/pdf
            multiple:
              summary: Several messages
              value:
                - content: My business is a food truck in Edmonton.
                - content: Which permits do I need to renew?
    responses:
      200:
        description: Agent successfully responded.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentGenerateResponse'
      400:
        $ref: '#/components/responses/AgentBadRequest'
      401:
        $ref: '#/components/responses/AgentUnauthorized'
      403:
        $ref: '#/components/responses/AgentForbidden'
      404:
        $ref: '#/components/responses/AgentNotFound'

/agent/v1/agents/{agentId}/threads/{threadId}:
  parameters:
    - $ref: '#/components/parameters/AgentId'
    - $ref: '#/components/parameters/ThreadId'
    - $ref: '#/components/parameters/AgentTenantId'
  delete:
    tags:
      - Agent
    description: >-
      Deletes one of the signed-in user's own conversation threads, with its stored messages, observations and
      workspace, so a new chat starts without its context. Available to any authenticated user when the agent has no
      userRoles; otherwise the user needs one of the agent's userRoles in the tenant. Returns deleted false when the
      user has no thread with this ID in the tenant, including one that belongs to another user or tenant, so
      repeating the request is harmless.
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadDeletion'
            examples:
              deleted:
                summary: Thread deleted
                value:
                  deleted: true
              notFound:
                summary: User has no thread with the ID
                value:
                  deleted: false
      400:
        $ref: '#/components/responses/AgentBadRequest'
      401:
        $ref: '#/components/responses/AgentUnauthorized'
      403:
        $ref: '#/components/responses/AgentForbidden'
      404:
        $ref: '#/components/responses/AgentNotFound'
