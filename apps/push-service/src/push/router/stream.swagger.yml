components:
  schemas:
    StreamEvent:
      type: object
      properties:
        namespace:
          type: string
        name:
          type: string
        map:
          type: object
          additionalProperties:
            type: string
        criteria:
          type: object
          properties:
            correlationId:
              type: string
            context:
              type: object
              additionalProperties:
                oneOf:
                  - type: string
                  - type: boolean
                  - type: number
      required: [namespace, name]
    Stream:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/StreamEvent"
        subscriberRoles:
          type: array
          items:
            type: string
        publicSubscribe:
          type: boolean
      required: [id, name, events, subscriberRoles, publicSubscribe]

/stream/v1/streams:
  get:
    tags:
      - Stream
    description: Retrieves available streams.
    parameters:
      - in: query
        name: tenant
        description: ID of the tenant to retrieve streams for.
        schema:
          type: string
    responses:
      200:
        description: Event successfully sent.
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/Stream"
      401:
        description: User not authorized to get streams.

/stream/v1/streams/{stream}:
  get:
    tags:
      - Stream
    description: >-
      Retrieve server side events for stream.
      When the replay buffer is enabled, tenant stream events carry an `id` cursor. A client that reconnects with that
      cursor (`Last-Event-ID` header or `after` query parameter) receives the events it missed, then live events.
      Control events: `adsp:ready` (live, with the current cursor as `id`), `adsp:reset` (missed events can't be recovered;
      resync) and `adsp:reconnect` (the server is closing the connection, e.g. on token expiry).
    parameters:
      - in: query
        name: tenant
        description: Name of the tenant associated with the stream for in kebab case.
        schema:
          type: string
      - in: path
        required: true
        name: stream
        description: ID of the stream to retrieve.
        schema:
          type: string
      - in: header
        name: Last-Event-ID
        description: Cursor of the last event processed; missed events after it are replayed.
        schema:
          type: string
      - in: query
        name: after
        description: Alternative to the Last-Event-ID header.
        schema:
          type: string
      - in: query
        name: criteria
        description: JSON criteria (correlationId, context) that events must match.
        schema:
          type: string
    responses:
      200:
        description: Event successfully sent.
        content:
          text/event-stream:
            schema:
              type: object
      401:
        description: User not authorized to get stream.
/stream/v1/streams/{stream}/events:
  get:
    tags:
      - Stream
    description: >-
      Retrieve buffered stream events after a cursor. Used for polling and diagnostics. Only available when the replay
      buffer is enabled, and only for tenant streams.
    parameters:
      - in: query
        name: tenant
        description: Name of the tenant associated with the stream for in kebab case.
        schema:
          type: string
      - in: path
        required: true
        name: stream
        description: ID of the stream.
        schema:
          type: string
      - in: query
        name: after
        description: Cursor to read after. If not specified, no items are returned and next is the current cursor.
        schema:
          type: string
      - in: query
        name: top
        description: Maximum number of buffered events to read.
        schema:
          type: integer
      - in: query
        name: criteria
        description: JSON criteria (correlationId, context) that events must match.
        schema:
          type: string
    responses:
      200:
        description: Buffered events successfully retrieved.
        content:
          application/json:
            schema:
              type: object
              properties:
                reset:
                  type: string
                  nullable: true
                  description: Reason the cursor can't be honoured (invalid-cursor, epoch-changed, cursor-expired).
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      cursor:
                        type: string
                      eventId:
                        type: string
                      namespace:
                        type: string
                      name:
                        type: string
                next:
                  type: string
                  description: Cursor to use for the next read.
      401:
        description: User not authorized to get stream.
