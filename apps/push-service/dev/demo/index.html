<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ADSP event client demo</title>
    <style>
      :root { color-scheme: light dark; --ok: #2e7d32; --warn: #b26a00; --bad: #c62828; --muted: #777; }
      body { font-family: system-ui, sans-serif; margin: 16px; max-width: 1100px; }
      h1 { font-size: 1.3rem; margin: 0 0 8px; }
      fieldset { border: 1px solid #8884; border-radius: 6px; margin: 0 0 12px; padding: 8px 12px; }
      legend { font-weight: 600; }
      button { margin: 2px 4px 2px 0; }
      .status { display: inline-block; padding: 2px 8px; border-radius: 10px; color: #fff; background: var(--muted); }
      .status.live { background: var(--ok); } .status.replaying { background: var(--warn); } .status.offline { background: var(--bad); }
      table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
      td, th { border-bottom: 1px solid #8883; padding: 3px 6px; text-align: left; vertical-align: top; }
      tr.gap td { color: var(--bad); font-weight: 600; } tr.dup td { color: var(--warn); } tr.info td { color: var(--muted); } tr.fail td { color: var(--bad); }
      code { font-size: 0.8rem; }
      .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/demo.js"></script>
  </body>
</html>
