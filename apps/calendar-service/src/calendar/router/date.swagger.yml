components:
  schemas:
    CalendarDate:
      type: object
      properties:
        id:
          type: integer
          description: ID of the date in the format yyyyMMdd.
        date:
          type: string
          format: date-time
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO day of the week, from 1 (Monday) to 7 (Sunday).
        isWeekend:
          type: boolean
        isHoliday:
          type: boolean
          description: >
            Indicates Government of Alberta offices are closed for a holiday, so it's a day off for GoA staff. This is
            true for general and staff holidays, and for the optional holidays GoA observes (Easter Monday, Heritage
            Day, and Boxing Day).
        isBusinessDay:
          type: boolean
        holiday:
          type: string
          nullable: true
          description: Name of the holiday, if the date is a holiday.
        holidayType:
          type: string
          nullable: true
          enum: [general, optional, staff, null]
          description: >
            Type of the holiday, if the date is a holiday. general is an Alberta general (statutory) holiday, optional
            is an Alberta optional general holiday that employers choose whether to observe, and staff is a GoA staff
            holiday that isn't a public holiday, such as the Christmas closure.
        isInLieuOfDay:
          type: boolean
          description: Indicates the date is a day off in lieu of a holiday that falls on a weekend.
      example:
        id: 20261111
        date: '2026-11-11T00:00:00.000Z'
        dayOfWeek: 3
        isWeekend: false
        isHoliday: true
        isBusinessDay: false
        holiday: Remembrance Day
        holidayType: general
        isInLieuOfDay: false
    CalendarDatesPage:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/CalendarDate'
        page:
          $ref: '#/components/schemas/CalendarPage'
      example:
        results:
          - id: 20260930
            date: '2026-09-30T00:00:00.000Z'
            dayOfWeek: 3
            isWeekend: false
            isHoliday: false
            isBusinessDay: true
            holiday: National Day for Truth and Reconciliation
            holidayType: optional
            isInLieuOfDay: false
          - id: 20261226
            date: '2026-12-26T00:00:00.000Z'
            dayOfWeek: 6
            isWeekend: true
            isHoliday: true
            isBusinessDay: false
            holiday: Boxing Day
            holidayType: optional
            isInLieuOfDay: false
        page:
          next: Mg==
          size: 2

/calendar/v1/dates:
  get:
    tags:
      - Dates
    description: >
      Retrieves calendar dates in ascending order, with information about weekends, holidays, and business days in
      Alberta. Public: no roles are required and anonymous requests are allowed. Dates are platform data and the same
      for every tenant, so no tenant context is used.
    security:
      - {}
      - accessToken: []
    parameters:
      - name: top
        description: Number of dates to return in a page. Must be an integer from 1 to 5000.
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 5000
          default: 10
        example: 50
      - name: after
        description: Cursor for the page of results to retrieve, from page.next of the previous page.
        in: query
        required: false
        schema:
          type: string
        example: Mg==
      - name: criteria
        description: >
          JSON criteria for the dates to retrieve. Must be valid JSON. min and max are inclusive date IDs in the
          format yyyyMMdd. holidayType is one type or an array of types; for example, use ["general", "optional"] for
          all Alberta public holidays, and isHoliday true for every day off for GoA staff.
        in: query
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                max:
                  type: integer
                  example: 20261231
                min:
                  type: integer
                  example: 20260101
                isWeekend:
                  type: boolean
                isHoliday:
                  type: boolean
                isBusinessDay:
                  type: boolean
                isInLieuOfDay:
                  type: boolean
                holidayType:
                  oneOf:
                    - type: string
                      enum: [general, optional, staff]
                    - type: array
                      items:
                        type: string
                        enum: [general, optional, staff]
            example:
              min: 20260101
              max: 20261231
              holidayType: optional
    responses:
      200:
        description: Dates successfully retrieved.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarDatesPage'
      400:
        $ref: '#/components/responses/CalendarBadRequest'

/calendar/v1/dates/{id}:
  parameters:
    - name: id
      description: ID of the date to retrieve, in the format yyyyMMdd.
      in: path
      required: true
      schema:
        type: integer
        minimum: 20200000
        maximum: 20600000
      example: 20261111
  get:
    tags:
      - Dates
    description: >
      Retrieves information about a calendar date. Public: no roles are required and anonymous requests are allowed.
      Dates are platform data and the same for every tenant, so no tenant context is used.
    security:
      - {}
      - accessToken: []
    responses:
      200:
        description: Date successfully retrieved.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarDate'
      400:
        $ref: '#/components/responses/CalendarBadRequest'
      404:
        $ref: '#/components/responses/CalendarNotFound'
