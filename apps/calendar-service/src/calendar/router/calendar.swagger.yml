components:
  schemas:
    Calendar:
      type: object
      properties:
        urn:
          type: string
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        readRoles:
          type: array
          items:
            type: string
        updateRoles:
          type: array
          items:
            type: string
    CalendarDefinition:
      allOf:
        - $ref: "#/components/schemas/Calendar"
        - type: object
          required: [source]
          properties:
            source:
              type: string
              enum: [tenant, core]
    CalendarDefinitionInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: '^[a-zA-Z0-9-_ ]{1,50}$'
          description: Must not be the reserved __proto__ property.
        displayName:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '\S'
        description:
          type: string
          maxLength: 250
        readRoles:
          type: array
          items:
            type: string
        updateRoles:
          type: array
          items:
            type: string
      required: [name, displayName, readRoles, updateRoles]
    CalendarEvent:
      type: object
      properties:
        urn:
          type: string
        id:
          type: number
        recordId:
          type: string
        context:
          type: object
        name:
          type: string
        description:
          type: string
        isPublic:
          type: boolean
        isAllDay:
          type: boolean
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/Attendee"
    Attendee:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: string
          format: email
    CalendarEventCriteria:
      type: object
      properties:
        recordId:
          type: string
        context:
          type: object
        isPublic:
          type: boolean
        startsAfter:
          type: string
          format: date-time
        endsBefore:
          type: string
          format: date-time
        activeOn:
          type: string
          format: date-time
        attendeeCriteria:
          type: object
          properties:
            nameEquals:
              type: string
            emailEquals:
              type: string
        orderBy:
          type: string
          enum: [id, start]

/calendar/v1/calendars:
  get:
    tags:
      - Calendar
    description: Retrieves separate tenant and core calendar definitions, including definitions with the same name. Anonymous requests receive only core definitions; authenticated tenant requests receive both.
    security:
      - {}
      - accessToken: []
    parameters:
      - name: tenantId
        in: query
        required: false
        description: Tenant ID when requesting definitions as a core user.
        schema:
          type: string
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/CalendarDefinition"
      502:
        description: Configuration service is unavailable or returned invalid calendar definitions.
  post:
    tags:
      - Calendar
    description: Creates a tenant calendar definition. Requires the calendar-admin role; core administrators must specify tenantId.
    security:
      - accessToken: []
    parameters:
      - name: tenantId
        in: query
        required: false
        description: Tenant ID when acting as a core administrator.
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CalendarDefinitionInput"
    responses:
      201:
        description: Tenant calendar definition created.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarDefinition"
      400:
        description: Invalid definition or missing tenant context.
      401:
        description: Authentication required.
      403:
        description: The caller does not have the calendar-admin role for this tenant.
      409:
        description: A tenant or core calendar with this name already exists.

/calendar/v1/calendars/{name}:
  get:
    tags:
      - Calendar
    description: Retrieves a specific calendar.
    parameters:
      - name: tenant
        description: Name of the tenant.
        in: query
        required: false
        schema:
          type: string
      - name: name
        description: Name of the calendar.
        in: path
        required: true
        schema:
          type: string
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Calendar"
  put:
    tags:
      - Calendar
    description: Updates an existing tenant calendar definition. Core definitions are read-only. Requires the calendar-admin role.
    security:
      - accessToken: []
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-zA-Z0-9-_ ]{1,50}$'
      - name: tenantId
        in: query
        required: false
        description: Tenant ID when acting as a core administrator.
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CalendarDefinitionInput"
    responses:
      200:
        description: Tenant calendar definition updated.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarDefinition"
      400:
        description: Invalid definition, name mismatch, or missing tenant context.
      401:
        description: Authentication required.
      403:
        description: The caller does not have the calendar-admin role for this tenant.
      404:
        description: No tenant calendar with this name exists.
  delete:
    tags:
      - Calendar
    description: Deletes an existing tenant calendar definition only if it has no events. Core definitions are read-only. Requires the calendar-admin role.
    security:
      - accessToken: []
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-zA-Z0-9-_ ]{1,50}$'
      - name: tenantId
        in: query
        required: false
        description: Tenant ID when acting as a core administrator.
        schema:
          type: string
    responses:
      204:
        description: Tenant calendar definition deleted.
      400:
        description: Invalid name or missing tenant context.
      401:
        description: Authentication required.
      403:
        description: The caller does not have the calendar-admin role for this tenant.
      404:
        description: No tenant calendar with this name exists.
      409:
        description: The calendar contains events and cannot be deleted.

/calendar/v1/calendars/{name}/export:
  get:
    tags:
      - Calendar
    description: Retrieves export of calendar and events.
    parameters:
      - name: tenant
        description: Name of the tenant.
        in: query
        required: false
        schema:
          type: string
      - name: name
        description: Name of the calendar.
        in: path
        required: true
        schema:
          type: string
      - name: top
        description: Number of events to return in a page.
        in: query
        required: false
        schema:
          type: number
      - name: after
        description: Cursor for retrieving additional pages.
        in: query
        required: false
        schema:
          type: string
      - name: includeAttendees
        description: Flag indicating if attendees should be included in events.
        in: query
        required: false
        schema:
          type: boolean
      - name: criteria
        description: Criteria for events to retrieve.
        in: query
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventCriteria"
    responses:
      200:
        description: Request completed successfully.

/calendar/v1/calendars/{name}/events:
  parameters:
    - name: name
      description: Name of the calendar.
      in: path
      required: true
      schema:
        type: string
  get:
    tags:
      - Calendar
    description: Retrieves calendar events.
    parameters:
      - name: tenant
        description: Name of the tenant.
        in: query
        required: false
        schema:
          type: string
      - name: top
        description: Number of events to return in a page.
        in: query
        required: false
        schema:
          type: number
      - name: after
        description: Cursor for retrieving additional pages.
        in: query
        required: false
        schema:
          type: string
      - name: includeAttendees
        description: Flag indicating if attendees should be included in events.
        in: query
        required: false
        schema:
          type: boolean
      - name: criteria
        description: Criteria for events to retrieve.
        in: query
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventCriteria"
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                results:
                  type: array
                  items:
                    $ref: "#/components/schemas/CalendarEvent"
                page:
                  type: object
                  properties:
                    after:
                      type: string
                    next:
                      type: string
                    size:
                      type: number
  post:
    tags:
      - Calendar
    description: Creates a new calendar event.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              recordId:
                type: string
              context:
                type: object
              name:
                type: string
              description:
                type: string
              start:
                type: string
                format: date-time
              end:
                type: string
                format: date-time
              isPublic:
                type: boolean
            required: [name, start]
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEvent"

/calendar/v1/calendars/{name}/events/{id}:
  parameters:
    - name: name
      description: Name of the calendar.
      in: path
      required: true
      schema:
        type: string
    - name: id
      description: ID of the event.
      in: path
      required: true
      schema:
        type: string
  get:
    tags:
      - Calendar
    parameters:
      - name: tenant
        description: Name of the tenant.
        in: query
        required: false
        schema:
          type: string
      - name: includeAttendees
        description: Flag indicating if attendees should be included in events.
        in: query
        required: false
        schema:
          type: boolean
    description: Retrieves a calendar event.
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEvent"
  patch:
    tags:
      - Calendar
    description: Updates a calendar event.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              context:
                type: object
              name:
                type: string
              description:
                type: string
              start:
                type: string
                format: date-time
              end:
                type: string
                format: date-time
              isPublic:
                type: boolean
              isAllDay:
                type: boolean
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEvent"
  delete:
    tags:
      - Calendar
    description: Deletes a calendar event.
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                deleted:
                  type: boolean

/calendar/v1/calendars/{name}/events/{id}/attendees:
  parameters:
    - name: name
      description: Name of the calendar.
      in: path
      required: true
      schema:
        type: string
    - name: id
      description: ID of the event.
      in: path
      required: true
      schema:
        type: string
  get:
    tags:
      - Calendar
    description: Retrieves attendees of a calendar event.
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Attendee"
  post:
    tags:
      - Calendar
    description: Creates an attendees of a calendar event.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              email:
                type: string
                format: email
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Attendee"

/calendar/v1/calendars/{name}/events/{id}/attendees/{attendeeId}:
  parameters:
    - name: name
      description: Name of the calendar.
      in: path
      required: true
      schema:
        type: string
    - name: id
      description: ID of the event.
      in: path
      required: true
      schema:
        type: string
    - name: attendeeId
      description: ID of the attendee.
      in: path
      required: true
      schema:
        type: string
  get:
    tags:
      - Calendar
    description: Retrieves an attendee of an event.
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Attendee"
  put:
    tags:
      - Calendar
    description: Sets an attendee of an event.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              email:
                type: string
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Attendee"
  delete:
    tags:
      - Calendar
    description: Deletes a calendar event attendee.
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                deleted:
                  type: boolean
