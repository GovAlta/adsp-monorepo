components:
  schemas:
    Calendar:
      type: object
      properties:
        urn:
          type: string
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        readRoles:
          type: array
          items:
            type: string
        updateRoles:
          type: array
          items:
            type: string
    CalendarDefinition:
      allOf:
        - $ref: "#/components/schemas/Calendar"
        - type: object
          required: [source]
          properties:
            source:
              type: string
              enum: [tenant, core]
    CalendarDefinitionInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "^[a-zA-Z0-9-_ ]{1,50}$"
          description: Must not be the reserved __proto__ property.
        displayName:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '\S'
        description:
          type: string
          maxLength: 250
        readRoles:
          type: array
          items:
            type: string
        updateRoles:
          type: array
          items:
            type: string
      required: [name, displayName, readRoles, updateRoles]
    CalendarEvent:
      type: object
      properties:
        urn:
          type: string
        id:
          type: number
        recordId:
          type: string
        context:
          type: object
        name:
          type: string
        description:
          type: string
        isPublic:
          type: boolean
        isAllDay:
          type: boolean
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        recurrenceId:
          type: string
          format: date-time
          description: Original start of the occurrence (RFC 5545 RECURRENCE-ID). Only included on occurrences of recurring events returned by range retrieval; id is the recurring event.
        recurrence:
          allOf:
            - $ref: "#/components/schemas/EventRecurrence"
          description: Only included for recurring events. exclusions is only included when retrieving the recurring event itself.
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/Attendee"
    EventRecurrence:
      type: object
      description: Recurrence of an event based on a subset of the RFC 5545 RRULE. Occurrences are generated in Mountain time (America/Edmonton) and keep the local start time across daylight saving changes.
      properties:
        frequency:
          type: string
          enum: [daily, weekly, monthly, yearly]
          description: Monthly and yearly recurrence use the day of the event start; months or years without that day are skipped.
        interval:
          type: integer
          minimum: 1
          maximum: 99
          default: 1
          description: Interval of the frequency; e.g. 2 with weekly is every two weeks.
        daysOfWeek:
          type: array
          description: Weekly recurrence only. Must include the day of the event start. Defaults to the day of the event start.
          items:
            type: string
            enum: [MO, TU, WE, TH, FR, SA, SU]
        end:
          type: object
          description: Optional end of the recurrence. Specify until or count, not both.
          properties:
            until:
              type: string
              format: date
              description: Last date (inclusive) on which an occurrence can start.
            count:
              type: integer
              minimum: 1
              maximum: 1000
              description: Number of occurrences, including the first and any cancelled occurrences.
        exclusions:
          type: array
          readOnly: true
          description: Recurrence IDs of cancelled occurrences.
          items:
            type: string
            format: date-time
      required: [frequency]
    Attendee:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: string
          format: email
    CalendarEventCriteria:
      type: object
      properties:
        recordId:
          type: string
        context:
          type: object
        isPublic:
          type: boolean
        startsAfter:
          type: string
          format: date-time
        endsBefore:
          type: string
          format: date-time
        activeOn:
          type: string
          format: date-time
        attendeeCriteria:
          type: object
          properties:
            nameEquals:
              type: string
            emailEquals:
              type: string
        orderBy:
          type: string
          enum: [id, start]

/calendar/v1/calendars:
  get:
    tags:
      - Calendar
    description: Retrieves separate tenant and core calendar definitions, including definitions with the same name. Anonymous requests receive only core definitions; authenticated tenant requests receive both.
    security:
      - {}
      - accessToken: []
    parameters:
      - name: tenantId
        in: query
        required: false
        description: Tenant ID when requesting definitions as a core user.
        schema:
          type: string
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/CalendarDefinition"
      502:
        description: Configuration service is unavailable or returned invalid calendar definitions.
  post:
    tags:
      - Calendar
    description: Creates a tenant calendar definition. Requires the calendar-admin role; core administrators must specify tenantId.
    security:
      - accessToken: []
    parameters:
      - name: tenantId
        in: query
        required: false
        description: Tenant ID when acting as a core administrator.
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CalendarDefinitionInput"
    responses:
      201:
        description: Tenant calendar definition created.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarDefinition"
      400:
        description: Invalid definition or missing tenant context.
      401:
        description: Authentication required.
      403:
        description: The caller does not have the calendar-admin role for this tenant.
      409:
        description: A tenant or core calendar with this name already exists.

/calendar/v1/calendars/{name}:
  get:
    tags:
      - Calendar
    description: Retrieves a specific calendar.
    parameters:
      - name: tenant
        description: Name of the tenant.
        in: query
        required: false
        schema:
          type: string
      - name: name
        description: Name of the calendar.
        in: path
        required: true
        schema:
          type: string
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Calendar"
  put:
    tags:
      - Calendar
    description: Updates an existing tenant calendar definition. Core definitions are read-only. Requires the calendar-admin role.
    security:
      - accessToken: []
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-zA-Z0-9-_ ]{1,50}$"
      - name: tenantId
        in: query
        required: false
        description: Tenant ID when acting as a core administrator.
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CalendarDefinitionInput"
    responses:
      200:
        description: Tenant calendar definition updated.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarDefinition"
      400:
        description: Invalid definition, name mismatch, or missing tenant context.
      401:
        description: Authentication required.
      403:
        description: The caller does not have the calendar-admin role for this tenant.
      404:
        description: No tenant calendar with this name exists.
  delete:
    tags:
      - Calendar
    description: Deletes an existing tenant calendar definition only if it has no events. Core definitions are read-only. Requires the calendar-admin role.
    security:
      - accessToken: []
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-zA-Z0-9-_ ]{1,50}$"
      - name: tenantId
        in: query
        required: false
        description: Tenant ID when acting as a core administrator.
        schema:
          type: string
    responses:
      204:
        description: Tenant calendar definition deleted.
      400:
        description: Invalid name or missing tenant context.
      401:
        description: Authentication required.
      403:
        description: The caller does not have the calendar-admin role for this tenant.
      404:
        description: No tenant calendar with this name exists.
      409:
        description: The calendar contains events and cannot be deleted.

/calendar/v1/calendars/{name}/export:
  get:
    tags:
      - Calendar
    description: Retrieves export of calendar and events.
    parameters:
      - name: tenant
        description: Name of the tenant.
        in: query
        required: false
        schema:
          type: string
      - name: name
        description: Name of the calendar.
        in: path
        required: true
        schema:
          type: string
      - name: top
        description: Number of events to return in a page.
        in: query
        required: false
        schema:
          type: number
      - name: after
        description: Cursor for retrieving additional pages.
        in: query
        required: false
        schema:
          type: string
      - name: includeAttendees
        description: Flag indicating if attendees should be included in events.
        in: query
        required: false
        schema:
          type: boolean
      - name: criteria
        description: Criteria for events to retrieve.
        in: query
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventCriteria"
    responses:
      200:
        description: Request completed successfully.

/calendar/v1/calendars/{name}/events:
  parameters:
    - name: name
      description: Name of the calendar.
      in: path
      required: true
      schema:
        type: string
  get:
    tags:
      - Calendar
    description: Retrieves calendar events. Calendar date/time values use the service timezone, America/Edmonton (Mountain time; MST or MDT depending on the date). When both from and to are specified, returns the complete set of events that overlap the requested range in a single response; top and after are ignored for range retrieval, but criteria can still be used to filter the results. An event overlaps the range when it occurs at least partially within it, including events that start before from or end after to. Range retrieval supports a maximum range of 366 days. Range retrieval returns each occurrence of a recurring event that overlaps the range, excluding cancelled occurrences; without from and to, recurring events are returned once and time criteria apply to their first occurrence.
    parameters:
      - name: tenant
        description: Name of the tenant.
        in: query
        required: false
        schema:
          type: string
      - name: top
        description: Number of events to return in a page.
        in: query
        required: false
        schema:
          type: number
      - name: after
        description: Cursor for retrieving additional pages.
        in: query
        required: false
        schema:
          type: string
      - name: includeAttendees
        description: Flag indicating if attendees should be included in events.
        in: query
        required: false
        schema:
          type: boolean
      - name: from
        description: ISO 8601 date/time for the start of a calendar display range. Must be specified with to. Events overlapping this range are returned without pagination.
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: "2026-10-01T00:00:00-06:00"
      - name: to
        description: ISO 8601 date/time for the end of a calendar display range. Must be specified with from. Requests spanning more than 366 days fail with a client error.
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: "2026-10-31T23:59:59-06:00"
      - name: criteria
        description: Criteria for events to retrieve.
        in: query
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventCriteria"
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                results:
                  type: array
                  items:
                    $ref: "#/components/schemas/CalendarEvent"
                page:
                  type: object
                  properties:
                    after:
                      type: string
                    next:
                      type: string
                    size:
                      type: number
  post:
    tags:
      - Calendar
    description: Creates a new calendar event.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              recordId:
                type: string
              context:
                type: object
              name:
                type: string
              description:
                type: string
              start:
                type: string
                format: date-time
              end:
                type: string
                format: date-time
              isPublic:
                type: boolean
              recurrence:
                $ref: "#/components/schemas/EventRecurrence"
            required: [name, start]
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEvent"

/calendar/v1/calendars/{name}/events/{id}:
  parameters:
    - name: name
      description: Name of the calendar.
      in: path
      required: true
      schema:
        type: string
    - name: id
      description: ID of the event.
      in: path
      required: true
      schema:
        type: string
  get:
    tags:
      - Calendar
    parameters:
      - name: tenant
        description: Name of the tenant.
        in: query
        required: false
        schema:
          type: string
      - name: includeAttendees
        description: Flag indicating if attendees should be included in events.
        in: query
        required: false
        schema:
          type: boolean
    description: Retrieves a calendar event.
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEvent"
  patch:
    tags:
      - Calendar
    description: Updates a calendar event.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              context:
                type: object
              name:
                type: string
              description:
                type: string
              start:
                type: string
                format: date-time
              end:
                type: string
                format: date-time
              isPublic:
                type: boolean
              isAllDay:
                type: boolean
              recurrence:
                allOf:
                  - $ref: "#/components/schemas/EventRecurrence"
                nullable: true
                description: Replaces the whole recurrence. Set to null to make the event a single event.
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEvent"
  delete:
    tags:
      - Calendar
    description: Deletes a calendar event. For a recurring event, deletes all occurrences.
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                deleted:
                  type: boolean

/calendar/v1/calendars/{name}/events/{id}/occurrences/{occurrence}:
  parameters:
    - name: name
      description: Name of the calendar.
      in: path
      required: true
      schema:
        type: string
    - name: id
      description: ID of the recurring event.
      in: path
      required: true
      schema:
        type: string
    - name: occurrence
      description: Mountain time date of the occurrence (e.g. 2026-10-13), or its URL-encoded recurrenceId.
      in: path
      required: true
      schema:
        type: string
  delete:
    tags:
      - Calendar
    description: Cancels one occurrence of a recurring event. The rest of the recurring event is unchanged. Cancelled occurrences cannot be restored.
    responses:
      200:
        description: Request completed successfully. deleted is false if the occurrence was already cancelled.
        content:
          application/json:
            schema:
              type: object
              properties:
                deleted:
                  type: boolean
      400:
        description: The event is not a recurring event.
      404:
        description: The event is not found, or the date is not an occurrence of the event.

/calendar/v1/calendars/{name}/events/{id}/attendees:
  parameters:
    - name: name
      description: Name of the calendar.
      in: path
      required: true
      schema:
        type: string
    - name: id
      description: ID of the event.
      in: path
      required: true
      schema:
        type: string
  get:
    tags:
      - Calendar
    description: Retrieves attendees of a calendar event.
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Attendee"
  post:
    tags:
      - Calendar
    description: Creates an attendees of a calendar event.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              email:
                type: string
                format: email
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Attendee"

/calendar/v1/calendars/{name}/events/{id}/attendees/{attendeeId}:
  parameters:
    - name: name
      description: Name of the calendar.
      in: path
      required: true
      schema:
        type: string
    - name: id
      description: ID of the event.
      in: path
      required: true
      schema:
        type: string
    - name: attendeeId
      description: ID of the attendee.
      in: path
      required: true
      schema:
        type: string
  get:
    tags:
      - Calendar
    description: Retrieves an attendee of an event.
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Attendee"
  put:
    tags:
      - Calendar
    description: Sets an attendee of an event.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              email:
                type: string
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Attendee"
  delete:
    tags:
      - Calendar
    description: Deletes a calendar event attendee.
    responses:
      200:
        description: Request completed successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                deleted:
                  type: boolean
