components:
  responses:
    ReportBadRequest:
      description: >
        Request is invalid. A path or query parameter failed validation, `from` or `to` is not a real calendar date, or
        `from` is after `to`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportError'
          examples:
            validation:
              summary: Parameter failed validation
              value:
                errorMessage: 'Validation failed with error(s): from (query) - Invalid value'
            calendarDate:
              summary: Date is not a real calendar date
              value:
                errorMessage: from and to must be valid calendar dates.
            periodOrder:
              summary: from is after to
              value:
                errorMessage: from must be on or before to.
    ReportUnauthorized:
      description: >
        Request has no bearer token, or value-service rejected the forwarded token (responded 401 or 403), for example
        because the user does not have the value-service `value-reader` role. Both cases respond with 401 rather than
        403.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportError'
          examples:
            missingToken:
              summary: No bearer token
              value:
                errorMessage: Bearer token is required.
            rejected:
              summary: value-service rejected the token
              value:
                errorMessage: Not authorized to read report data.
    ReportNotFound:
      description: The service has no report, or does not offer that section yet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportError'
          example:
            errorMessage: report section with ID 'pdf/trends' could not be found.
  schemas:
    ReportPeriod:
      type: object
      required:
        - from
        - to
      properties:
        from:
          type: string
          format: date
          description: Inclusive start date (yyyy-mm-dd).
          example: '2026-08-20'
        to:
          type: string
          format: date
          description: >
            Inclusive end date, clipped to the last completed UTC day (the current UTC day is excluded). When `from` is
            after the last completed UTC day, `to` is earlier than `from` and the period is empty.
          example: '2026-09-17'
      example:
        from: '2026-08-20'
        to: '2026-09-17'
    ReportError:
      type: object
      properties:
        errorMessage:
          type: string
      example:
        errorMessage: report section with ID 'pdf/trends' could not be found.
    PdfSummaryData:
      type: object
      description: Keys match TMW pdfReport.summaryMetrics ids. Missing activity is 0, not null.
      properties:
        pdfRequested:
          type: number
          description: Count of pdf-generation-queued events in the period.
          example: 15
        pdfGenerated:
          type: number
          description: Count of pdf-generated events in the period.
          example: 11
        pdfFailed:
          type: number
          description: Count of pdf-generation-failed events in the period.
          example: 4
        unreconciled:
          type: number
          description: max(pdfRequested - pdfGenerated, 0). Failed jobs count as unreconciled.
          example: 4
        generationDuration:
          type: number
          description: Average successful generation time in seconds (one decimal).
          example: 2.9
        generationDurationMax:
          type: number
          description: Maximum successful generation time in seconds.
          example: 4
        templatesUsed:
          type: number
          description: Distinct templateId values on queued, generated, and failed events.
          example: 6
    ReportSectionResponse:
      type: object
      required:
        - serviceId
        - sectionId
        - period
        - data
      properties:
        serviceId:
          type: string
          example: pdf
        sectionId:
          type: string
          enum:
            - summary
            - trends
            - topResources
            - insights
            - apiDrilldown
          example: summary
        period:
          $ref: '#/components/schemas/ReportPeriod'
        data:
          description: Section payload, or zeros for an empty PDF summary period. Shape depends on serviceId and sectionId.
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/PdfSummaryData'
            - type: object
              additionalProperties: true
      example:
        serviceId: pdf
        sectionId: summary
        period:
          from: '2026-08-20'
          to: '2026-09-17'
        data:
          pdfRequested: 15
          pdfGenerated: 11
          pdfFailed: 4
          unreconciled: 4
          generationDuration: 2.9
          generationDurationMax: 4
          templatesUsed: 6

/api/tenant/v1/reports/{serviceId}/{sectionId}:
  get:
    tags:
      - Reports
    summary: Get one report section for a service and period
    description: |
      Generic reports read API. Returns one section of a service usage report for the caller's tenant.

      **Roles and tenancy:** the gateway only checks that the request has a bearer token; it does not verify the token
      or check roles itself. It forwards the token to value-service, which requires a tenant user or service account
      with the `urn:ads:platform:value-service:value-reader` role, and reads the data of the token's tenant. There is
      no `tenantId` parameter, so core (platform) tokens are not supported. A token that value-service rejects responds
      with 401.

      Implemented now:
      - `pdf` / `summary`

      Unknown `serviceId`/`sectionId` pairs return 404 so later sections (trends, topResources, insights, apiDrilldown)
      can be added without a new URL shape.

      The period is inclusive and `to` is clipped to the last completed UTC day. If the clipped period is empty (for
      example `from` is today), the PDF summary responds with zeros.
    parameters:
      - name: serviceId
        in: path
        required: true
        description: TMW report registry id (kebab-case, not the service URN). `pdf` is the only service implemented.
        schema:
          type: string
          minLength: 1
          maxLength: 50
          example: pdf
      - name: sectionId
        in: path
        required: true
        description: >
          Report section. Planned sections are `summary`, `trends`, `topResources`, `insights` and `apiDrilldown`; only
          `summary` is implemented for `pdf`. Any other value responds with 404.
        schema:
          type: string
          minLength: 1
          maxLength: 50
          example: summary
      - name: from
        in: query
        required: true
        description: Inclusive period start (yyyy-mm-dd). Must be a real calendar date on or before `to`.
        schema:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '2026-08-20'
      - name: to
        in: query
        required: true
        description: Inclusive period end (yyyy-mm-dd). Must be a real calendar date. Clipped to the last completed UTC day.
        schema:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '2026-09-18'
      - name: preset
        in: query
        required: false
        description: >
          UI preset name, for example `last7Days`, `last30Days`, `last90Days`, `last12Months` or `custom`. Not used by
          the gateway; `from` and `to` are the source of truth. Any string is accepted.
        schema:
          type: string
          example: last30Days
    responses:
      200:
        description: Section payload for the token's tenant and the effective period.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportSectionResponse'
            examples:
              pdfSummary:
                summary: PDF summary cards
                value:
                  serviceId: pdf
                  sectionId: summary
                  period:
                    from: '2026-08-20'
                    to: '2026-09-17'
                  data:
                    pdfRequested: 15
                    pdfGenerated: 11
                    pdfFailed: 4
                    unreconciled: 4
                    generationDuration: 2.9
                    generationDurationMax: 4
                    templatesUsed: 6
              emptyPeriod:
                summary: Period with no completed days
                value:
                  serviceId: pdf
                  sectionId: summary
                  period:
                    from: '2026-09-18'
                    to: '2026-09-17'
                  data:
                    pdfRequested: 0
                    pdfGenerated: 0
                    pdfFailed: 0
                    unreconciled: 0
                    generationDuration: 0
                    generationDurationMax: 0
                    templatesUsed: 0
      400:
        $ref: '#/components/responses/ReportBadRequest'
      401:
        $ref: '#/components/responses/ReportUnauthorized'
      404:
        $ref: '#/components/responses/ReportNotFound'
