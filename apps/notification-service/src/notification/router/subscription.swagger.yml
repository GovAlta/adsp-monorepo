components:
  parameters:
    SubscriptionTenantId:
      name: tenantId
      description: >
        ID of the tenant to act on. Only used for core (platform) users; tenant users always act on the tenant of
        their token and this parameter is ignored.
      in: query
      required: false
      schema:
        type: string
      example: urn:ads:platform:tenant-service:v2:/tenants/61f2e3a8c9b1d2e3f4a5b6c7
  responses:
    SubscriptionBadRequest:
      description: Request is invalid, for example a path, query, or body parameter failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubscriptionError"
          example:
            errorMessage: "Validation failed with error(s): subscriber (params) - Invalid value"
    SubscriptionUnauthorized:
      description: >
        Request does not include a valid bearer token, or the user is not permitted to act on the subscriber or
        subscription.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubscriptionError"
          example:
            errorMessage: User not authorized to update subscriber.
    SubscriptionForbidden:
      description: User does not have the role required for the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubscriptionError"
          example:
            errorMessage: "User Test User (ID: 1234) not permitted to get subscribers."
    SubscriptionNotFound:
      description: Notification type or subscriber not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubscriptionError"
          example:
            errorMessage: Subscriber with ID '63f5a0d2c9b1d2e3f4a5b6c7' could not be found.
  schemas:
    SubscriptionError:
      type: object
      properties:
        errorMessage:
          type: string
    Template:
      type: object
      properties:
        subject:
          type: string
        body:
          type: string
    NotificationType:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        manageSubscribe:
          type: boolean
          description: Indicates that users can manage their own subscription to the type.
        publicSubscribe:
          type: boolean
          description: Indicates that any authenticated user of the tenant can subscribe, regardless of subscriberRoles.
        subscriberRoles:
          type: array
          description: Roles a user needs to subscribe themselves when the type is not public.
          items:
            type: string
        channels:
          type: array
          items:
            type: string
            enum: [email, sms, bot, mail]
        events:
          type: array
          items:
            type: object
            properties:
              namespace:
                type: string
              name:
                type: string
              template:
                type: object
                properties:
                  email:
                    $ref: "#/components/schemas/Template"
                  bot:
                    $ref: "#/components/schemas/Template"
                  sms:
                    $ref: "#/components/schemas/Template"
      example:
        id: application-status
        name: Application status
        description: Notifications about changes to an application.
        manageSubscribe: true
        publicSubscribe: false
        subscriberRoles: [applicant]
        channels: [email]
        events:
          - namespace: application-service
            name: application-status-changed
            template:
              email:
                subject: Your application status changed
                body: "<p>Your application is now {{ event.payload.status }}.</p>"
    SubscriberChannel:
      type: object
      properties:
        channel:
          type: string
          enum: [email, sms, bot, mail]
        address:
          type: string
        verified:
          type: boolean
          readOnly: true
        pendingVerification:
          type: boolean
          readOnly: true
        timeCodeSent:
          type: number
          readOnly: true
    Subscriber:
      type: object
      properties:
        tenantId:
          type: string
        urn:
          type: string
        id:
          type: string
        userId:
          type: string
        addressAs:
          type: string
        channels:
          type: array
          items:
            $ref: "#/components/schemas/SubscriberChannel"
        subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/Subscription"
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
      example:
        tenantId: urn:ads:platform:tenant-service:v2:/tenants/61f2e3a8c9b1d2e3f4a5b6c7
        urn: urn:ads:platform:notification-service:v1:/subscribers/63f5a0d2c9b1d2e3f4a5b6c7
        id: 63f5a0d2c9b1d2e3f4a5b6c7
        userId: 9c1f2b7e-4d3a-4f6b-8a2e-1b2c3d4e5f60
        addressAs: Test User
        channels:
          - channel: email
            address: test.user@gov.ab.ca
            verified: true
        created: "2026-09-01T17:00:00.000Z"
        updated: "2026-09-01T17:00:00.000Z"
    SubscriptionCriteria:
      type: object
      properties:
        description:
          type: string
        correlationId:
          type: string
        context:
          type: object
          additionalProperties: true
    Subscription:
      type: object
      properties:
        typeId:
          type: string
        subscriberId:
          type: string
        subscriber:
          $ref: "#/components/schemas/Subscriber"
        criteria:
          anyOf:
            - $ref: "#/components/schemas/SubscriptionCriteria"
            - type: array
              items:
                $ref: "#/components/schemas/SubscriptionCriteria"
      example:
        typeId: application-status
        subscriberId: 63f5a0d2c9b1d2e3f4a5b6c7
        subscriber:
          id: 63f5a0d2c9b1d2e3f4a5b6c7
          addressAs: Test User
          channels:
            - channel: email
              address: test.user@gov.ab.ca
              verified: true
        criteria:
          correlationId: application-1234
    SubscriptionPage:
      type: object
      properties:
        after:
          type: string
        size:
          type: number
        next:
          type: string
    SendVerifyCodeOperation:
      type: object
      properties:
        operation:
          type: string
          enum: [send-code]
        channel:
          type: string
          enum: [email, sms, bot]
        address:
          type: string
        reason:
          type: string
      required: [operation, channel, address]
    SendVerifyCodeWithLinkOperation:
      type: object
      properties:
        operation:
          type: string
          enum: [send-code-with-link]
        channel:
          type: string
          enum: [email, sms, bot]
        address:
          type: string
        reason:
          type: string
        expireIn:
          type: number
          description: Number of minutes before the code expires.
        verificationLink:
          type: string
          description: Link included in the message, for example to a page where the user enters the code.
      required: [operation, channel, address]
    MySubscriberSubscriptions:
      type: object
      properties:
        typeId:
          type: string
        subscriberId:
          type: string
        type:
          $ref: "#/components/schemas/NotificationType"
        criteria:
          anyOf:
            - $ref: "#/components/schemas/SubscriptionCriteria"
            - type: array
              items:
                $ref: "#/components/schemas/SubscriptionCriteria"
    MySubscriberDetails:
      type: object
      properties:
        tenantId:
          type: string
        urn:
          type: string
        id:
          type: string
        userId:
          type: string
        addressAs:
          type: string
        channels:
          type: array
          items:
            $ref: "#/components/schemas/SubscriberChannel"
        subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/MySubscriberSubscriptions"
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
    CheckCodeOperation:
      type: object
      properties:
        operation:
          type: string
          enum: [check-code]
        channel:
          type: string
          enum: [email, sms, bot]
        address:
          type: string
        code:
          type: string
      required: [operation, channel, address, code]
    VerifyChannelOperation:
      type: object
      properties:
        operation:
          type: string
          enum: [verify-channel]
        channel:
          type: string
          enum: [email, sms, bot]
        address:
          type: string
        code:
          type: string
      required: [operation, channel, address, code]

/subscription/v1/types:
  get:
    tags:
      - Subscription
    description: >
      Retrieves notification types available to subscribe to. Available to any authenticated user. Includes the
      platform notification types and the types configured by the tenant; a tenant type with the same ID as a
      platform type replaces it.
    parameters:
      - $ref: "#/components/parameters/SubscriptionTenantId"
    responses:
      200:
        description: Notification types successfully retrieved.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/NotificationType"
      401:
        $ref: "#/components/responses/SubscriptionUnauthorized"
/subscription/v1/types/{type}:
  get:
    tags:
      - Subscription
    description: Retrieves a notification type. Available to any authenticated user.
    parameters:
      - name: type
        description: ID of the notification type.
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 50
      - $ref: "#/components/parameters/SubscriptionTenantId"
    responses:
      200:
        description: Notification type successfully retrieved.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationType"
      400:
        $ref: "#/components/responses/SubscriptionBadRequest"
      401:
        $ref: "#/components/responses/SubscriptionUnauthorized"
      404:
        $ref: "#/components/responses/SubscriptionNotFound"
/subscription/v1/types/{type}/subscriptions:
  parameters:
    - name: type
      description: ID of the notification type.
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 50
    - $ref: "#/components/parameters/SubscriptionTenantId"
  get:
    tags:
      - Subscription
    description: Retrieves subscriptions for a notification type. Requires the subscription-admin or subscription-app role.
    parameters:
      - name: top
        description: Number of results to retrieve. Defaults to 10.
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 5000
      - name: after
        description: Cursor for page of results to retrieve.
        in: query
        required: false
        schema:
          type: string
      - name: subscriberCriteria
        description: Criteria for the subscriber of the subscription.
        in: query
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
      - name: subscriptionMatch
        description: Criteria for the subscription criteria.
        in: query
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                correlationId:
                  type: string
                context:
                  type: object
                  additionalProperties: true
    responses:
      200:
        description: Subscriptions successfully retrieved.
        content:
          application/json:
            schema:
              type: object
              properties:
                results:
                  type: array
                  items:
                    $ref: "#/components/schemas/Subscription"
                page:
                  $ref: "#/components/schemas/SubscriptionPage"
      400:
        $ref: "#/components/responses/SubscriptionBadRequest"
      401:
        $ref: "#/components/responses/SubscriptionUnauthorized"
      403:
        $ref: "#/components/responses/SubscriptionForbidden"
      404:
        $ref: "#/components/responses/SubscriptionNotFound"
  post:
    tags:
      - Subscription
    description: >
      Creates a subscription for a notification type, creating the subscriber first if it does not exist.
      Users with the subscription-admin or subscription-app role can subscribe anyone. Other users can only
      subscribe themselves, and only when the type allows users to manage their own subscription and is public or
      the user has one of the type's subscriber roles.
    parameters:
      - name: userSub
        description: >
          Flag indicating the subscription is for the current user. When true, the subscriber is created from the
          user's token (name and email) and only the criteria property of the body is used.
        in: query
        required: false
        schema:
          type: boolean
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              criteria:
                $ref: "#/components/schemas/SubscriptionCriteria"
              id:
                type: string
                description: ID of an existing subscriber to subscribe.
              userId:
                type: string
                description: User ID of the subscriber; an existing subscriber for the user is reused.
              addressAs:
                type: string
              channels:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriberChannel"
          examples:
            self:
              summary: Current user (with userSub=true)
              value:
                criteria:
                  correlationId: application-1234
            other:
              summary: New subscriber (subscription admin)
              value:
                addressAs: Test User
                channels:
                  - channel: email
                    address: test.user@gov.ab.ca
    responses:
      200:
        description: Subscription successfully created.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Subscription"
      400:
        $ref: "#/components/responses/SubscriptionBadRequest"
      401:
        $ref: "#/components/responses/SubscriptionUnauthorized"
      403:
        $ref: "#/components/responses/SubscriptionForbidden"
      404:
        $ref: "#/components/responses/SubscriptionNotFound"

/subscription/v1/types/{type}/subscriptions/{subscriber}:
  parameters:
    - name: type
      description: ID of the notification type.
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 50
    - name: subscriber
      description: ID of the subscriber.
      in: path
      required: true
      schema:
        type: string
    - $ref: "#/components/parameters/SubscriptionTenantId"
  get:
    tags:
      - Subscription
    description: >
      Gets a subscription for a notification type and subscriber. Requires the subscription-admin role.
      Responds with null if the subscriber is not subscribed to the type.
    responses:
      200:
        description: Subscription successfully retrieved.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Subscription"
      400:
        $ref: "#/components/responses/SubscriptionBadRequest"
      401:
        $ref: "#/components/responses/SubscriptionUnauthorized"
      403:
        $ref: "#/components/responses/SubscriptionForbidden"
      404:
        $ref: "#/components/responses/SubscriptionNotFound"
  post:
    tags:
      - Subscription
    description: >
      Adds or updates the subscription of a subscriber to the notification type. If a subscription exists, its
      criteria are replaced; otherwise a new subscription is created, which requires a single criteria object.
      Same permissions as creating a subscription.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [criteria]
            properties:
              criteria:
                anyOf:
                  - $ref: "#/components/schemas/SubscriptionCriteria"
                  - type: array
                    minItems: 1
                    maxItems: 200
                    items:
                      $ref: "#/components/schemas/SubscriptionCriteria"
          example:
            criteria:
              - correlationId: application-1234
              - correlationId: application-5678
    responses:
      200:
        description: Subscription successfully added or updated.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Subscription"
      400:
        $ref: "#/components/responses/SubscriptionBadRequest"
      401:
        $ref: "#/components/responses/SubscriptionUnauthorized"
      403:
        $ref: "#/components/responses/SubscriptionForbidden"
      404:
        $ref: "#/components/responses/SubscriptionNotFound"

  delete:
    tags:
      - Subscription
    description: >
      Removes a subscription from a notification type. Same permissions as creating a subscription. Responds with
      deleted false if the subscriber or subscription does not exist.
    responses:
      200:
        description: Subscription removal processed.
        content:
          application/json:
            schema:
              type: object
              properties:
                deleted:
                  type: boolean
            example:
              deleted: true
      400:
        $ref: "#/components/responses/SubscriptionBadRequest"
      401:
        $ref: "#/components/responses/SubscriptionUnauthorized"
      404:
        $ref: "#/components/responses/SubscriptionNotFound"

/subscription/v1/types/{type}/subscriptions/{subscriber}/criteria:
  parameters:
    - name: type
      description: ID of the notification type.
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 50
    - name: subscriber
      description: ID of the subscriber.
      in: path
      required: true
      schema:
        type: string
    - name: criteria
      description: >
        JSON encoded criteria for deletion of subscription criteria. Deletion criteria can match multiple
        subscription criteria. The subscription is deleted when its last criteria is removed.
      in: query
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubscriptionCriteria"
          example:
            correlationId: application-1234
    - $ref: "#/components/parameters/SubscriptionTenantId"

  delete:
    tags:
      - Subscription
    description: Removes a subscription criteria. Same permissions as creating a subscription.
    responses:
      200:
        description: Subscription criteria removal processed.
        content:
          application/json:
            schema:
              type: object
              properties:
                deleted:
                  type: boolean
            example:
              deleted: true
      400:
        $ref: "#/components/responses/SubscriptionBadRequest"
      401:
        $ref: "#/components/responses/SubscriptionUnauthorized"
      403:
        $ref: "#/components/responses/SubscriptionForbidden"
      404:
        $ref: "#/components/responses/SubscriptionNotFound"

/subscription/v1/subscribers:
  get:
    tags:
      - Subscription
    description: Retrieves subscribers of the tenant. Requires the subscription-admin role.
    parameters:
      - name: top
        description: Number of results to retrieve. Defaults to 10.
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 5000
      - name: after
        description: Cursor for page of results to retrieve.
        in: query
        required: false
        schema:
          type: string
      - name: email
        description: Email address of subscriber.
        in: query
        required: false
        schema:
          type: string
      - name: sms
        description: SMS number of subscriber.
        in: query
        required: false
        schema:
          type: string
      - name: name
        description: Name (address as) of subscriber.
        in: query
        required: false
        schema:
          type: string
      - name: search
        description: Value matched against the name, email address, or SMS number of the subscriber; a subscriber matching any of them is included.
        in: query
        required: false
        schema:
          type: string
      - name: sortBy
        description: Column to sort results on. Defaults to name.
        in: query
        required: false
        schema:
          type: string
          enum: [name, email, sms, verified, created, updated]
      - name: sortDirection
        description: Direction to sort results in. Defaults to asc.
        in: query
        required: false
        schema:
          type: string
          enum: [asc, desc]
      - $ref: "#/components/parameters/SubscriptionTenantId"
    responses:
      200:
        description: Subscribers successfully retrieved.
        content:
          application/json:
            schema:
              type: object
              properties:
                results:
                  type: array
                  items:
                    $ref: "#/components/schemas/Subscriber"
                page:
                  allOf:
                    - $ref: "#/components/schemas/SubscriptionPage"
                    - type: object
                      properties:
                        total:
                          type: number
                          description: Number of subscribers matching the criteria, across all pages.
      400:
        $ref: "#/components/responses/SubscriptionBadRequest"
      401:
        $ref: "#/components/responses/SubscriptionUnauthorized"
      403:
        $ref: "#/components/responses/SubscriptionForbidden"
  post:
    tags:
      - Subscription
    description: >
      Creates a subscriber. Users with the subscription-admin or subscription-app role can create any subscriber;
      other users can only create a subscriber for themselves.
    parameters:
      - name: userSub
        description: >
          Flag indicating the subscriber is the current user. When true, the subscriber is created from the user's
          token (name and email) and the body is ignored.
        in: query
        required: false
        schema:
          type: boolean
      - $ref: "#/components/parameters/SubscriptionTenantId"
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              userId:
                type: string
              addressAs:
                type: string
              channels:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriberChannel"
          example:
            addressAs: Test User
            channels:
              - channel: email
                address: test.user@gov.ab.ca
    responses:
      200:
        description: Subscriber successfully created.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Subscriber"
      401:
        $ref: "#/components/responses/SubscriptionUnauthorized"

/subscription/v1/subscribers/{subscriber}:
  parameters:
    - name: subscriber
      description: ID of the subscriber.
      in: path
      required: true
      schema:
        type: string
    - $ref: "#/components/parameters/SubscriptionTenantId"
  get:
    tags:
      - Subscription
    description: >
      Retrieves a subscriber. Users with the subscription-admin or subscription-app role can retrieve any
      subscriber of the tenant; other users can only retrieve their own subscriber.
    parameters:
      - name: includeSubscriptions
        description: Flag indicating whether to include subscriptions or not.
        in: query
        required: false
        schema:
          type: boolean
    responses:
      200:
        description: Subscriber successfully retrieved.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Subscriber"
      400:
        $ref: "#/components/responses/SubscriptionBadRequest"
      401:
        $ref: "#/components/responses/SubscriptionUnauthorized"
      403:
        $ref: "#/components/responses/SubscriptionForbidden"
      404:
        $ref: "#/components/responses/SubscriptionNotFound"
  patch:
    tags:
      - Subscription
    description: Updates a subscriber. Same permissions as retrieving the subscriber.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              addressAs:
                type: string
              channels:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriberChannel"
          example:
            addressAs: Test User
            channels:
              - channel: email
                address: test.user@gov.ab.ca
              - channel: sms
                address: "7805551234"
    responses:
      200:
        description: Subscriber successfully updated.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Subscriber"
      400:
        $ref: "#/components/responses/SubscriptionBadRequest"
      401:
        $ref: "#/components/responses/SubscriptionUnauthorized"
      403:
        $ref: "#/components/responses/SubscriptionForbidden"
      404:
        $ref: "#/components/responses/SubscriptionNotFound"
  post:
    tags:
      - Subscription
    description: >
      Executes a subscriber operation to send or check a verification code for a channel. Same permissions as
      retrieving the subscriber.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/SendVerifyCodeOperation"
              - $ref: "#/components/schemas/SendVerifyCodeWithLinkOperation"
              - $ref: "#/components/schemas/VerifyChannelOperation"
              - $ref: "#/components/schemas/CheckCodeOperation"
            discriminator:
              propertyName: operation
              mapping:
                send-code: "#/components/schemas/SendVerifyCodeOperation"
                send-code-with-link: "#/components/schemas/SendVerifyCodeWithLinkOperation"
                check-code: "#/components/schemas/CheckCodeOperation"
                verify-channel: "#/components/schemas/VerifyChannelOperation"
          examples:
            send-code:
              summary: Send a verification code
              value:
                operation: send-code
                channel: email
                address: test.user@gov.ab.ca
                reason: Verify your email address.
            verify-channel:
              summary: Verify the channel with the code
              value:
                operation: verify-channel
                channel: email
                address: test.user@gov.ab.ca
                code: "123456"
    responses:
      200:
        description: Subscriber operation successfully executed.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    verified:
                      type: boolean
                - type: object
                  properties:
                    sent:
                      type: boolean
            example:
              sent: true
      400:
        $ref: "#/components/responses/SubscriptionBadRequest"
      401:
        $ref: "#/components/responses/SubscriptionUnauthorized"
      403:
        $ref: "#/components/responses/SubscriptionForbidden"
      404:
        $ref: "#/components/responses/SubscriptionNotFound"
  delete:
    tags:
      - Subscription
    description: Deletes a subscriber. Same permissions as retrieving the subscriber.
    responses:
      200:
        description: Subscriber successfully deleted.
        content:
          application/json:
            schema:
              type: object
              properties:
                deleted:
                  type: boolean
            example:
              deleted: true
      400:
        $ref: "#/components/responses/SubscriptionBadRequest"
      401:
        $ref: "#/components/responses/SubscriptionUnauthorized"
      403:
        $ref: "#/components/responses/SubscriptionForbidden"
      404:
        $ref: "#/components/responses/SubscriptionNotFound"

/subscription/v1/subscribers/{subscriber}/subscriptions:
  parameters:
    - name: subscriber
      description: ID of the subscriber.
      in: path
      required: true
      schema:
        type: string
    - name: top
      description: Number of results to retrieve. Defaults to 10.
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 5000
    - name: after
      description: Cursor for page of results to retrieve.
      in: query
      required: false
      schema:
        type: string
    - $ref: "#/components/parameters/SubscriptionTenantId"
  get:
    tags:
      - Subscription
    description: Retrieves subscriptions for a subscriber. Same permissions as retrieving the subscriber.
    responses:
      200:
        description: Subscriptions successfully retrieved.
        content:
          application/json:
            schema:
              type: object
              properties:
                results:
                  type: array
                  items:
                    $ref: "#/components/schemas/MySubscriberSubscriptions"
                page:
                  $ref: "#/components/schemas/SubscriptionPage"
      400:
        $ref: "#/components/responses/SubscriptionBadRequest"
      401:
        $ref: "#/components/responses/SubscriptionUnauthorized"
      403:
        $ref: "#/components/responses/SubscriptionForbidden"
      404:
        $ref: "#/components/responses/SubscriptionNotFound"

/subscription/v1/subscribers/my-subscriber:
  parameters:
    - name: includeSubscriptions
      description: Flag indicating whether to include subscriptions or not.
      in: query
      required: false
      schema:
        type: boolean
  get:
    tags:
      - Subscription
    description: >
      Retrieves the subscriber of the current user, along with their current subscriptions if requested.
      Available to any authenticated user.
    responses:
      200:
        description: User subscriber and subscriptions information retrieved successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MySubscriberDetails"
      401:
        $ref: "#/components/responses/SubscriptionUnauthorized"
      404:
        $ref: "#/components/responses/SubscriptionNotFound"
