<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ADSP Project Planner (local)</title>
    <link rel="stylesheet" href="/ds/index.css" />
    <link rel="stylesheet" href="/tokens/tokens.css" />
    <script type="module" src="/ds/index.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <style>
      body { margin: 0; font-family: var(--goa-font-family-sans, 'acumin-pro-semi-condensed', Arial, sans-serif); background: #fff; color: #333; }
      main { max-width: 1280px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
      .layout > * { min-width: 0; }
      .layout { display: grid; grid-template-columns: 320px 1fr; gap: 1.5rem; align-items: start; }
      @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
      .sol-item { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid #dcdcdc; border-radius: 4px; padding: .75rem; margin-bottom: .5rem; cursor: pointer; font: inherit; }
      .sol-item:hover { background: #f1f1f1; }
      .sol-item[aria-current='true'] { border: 2px solid #0081a2; padding: calc(.75rem - 1px); }
      .sol-item small { color: #666; display: block; margin-top: .25rem; }
      .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
      .stack > * + * { margin-top: 1rem; }
      .muted { color: #666; }
      ul.plain { margin: .25rem 0; padding-left: 1.25rem; }
      main.wide { max-width: 1840px; }
      .cv-rail { gap: .2rem; padding-right: .5rem; }
      .cv { display: grid; grid-template-columns: 205px 1fr; gap: 1rem; align-items: start; }
      @media (max-width: 1100px) { .cv { grid-template-columns: 1fr; } }
      .cv-rail { display: flex; flex-direction: column; gap: .35rem; border-right: 1px solid #dcdcdc; padding-right: .75rem; }
      .cv-rail goa-button { display: block; }
      .cv-rail h4 { margin: .75rem 0 .25rem; color: #666; text-transform: uppercase; font-size: .75rem; letter-spacing: .04em; }
      .cv-panes { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 1rem; align-items: start; }
      .cv-panes h3 { margin: 0; font-size: 1.1rem; }
      .pane { max-height: calc(100vh - 250px); min-height: 320px; overflow: auto; padding-right: .5rem; }
      .pane > * + * { margin-top: .6rem; }
      .cv-panes goa-container { min-width: 0; }
    </style>
  </head>
  <body>
    <goa-microsite-header type="alpha" version="local dev build"></goa-microsite-header>
    <goa-app-header heading="ADSP Project Planner" url="/ui"></goa-app-header>

    <main>
      <div id="message"></div>
      <div class="layout">
        <aside aria-label="Solutions">
          <goa-container accent="thick">
            <h2 style="margin-top: 0">Solutions</h2>
            <div class="stack">
              <goa-input id="newName" name="newName" placeholder="Name for a new solution" width="100%" aria-label="New solution name"></goa-input>
              <goa-button id="createBtn" type="primary">Create solution</goa-button>
            </div>
            <goa-spacer vspacing="m"></goa-spacer>
            <div id="solutions" role="list"></div>
          </goa-container>
        </aside>

        <section aria-label="Solution workspace" id="workspace">
          <goa-callout type="information" heading="No solution selected">
            Create a solution or choose one from the list to describe a business problem and get a pattern match.
          </goa-callout>
        </section>
      </div>
    </main>

    <script type="module">
      const API = '/planner/v1';
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
      let solutions = [];
      let current = null;
      let section = 'problem';
      let view = 'default';
      let chatCounts = {};
      let refineLabel = 'Refine analysis with my answers';
      let altReply = '';
      const SOL_MODES = [['mode1', 'Mode 1: Initial solution, I refine'], ['mode2', 'Mode 2: AI asks, final solution'], ['mode3', 'Mode 3: Alternative workflows']];
      const solModeKey = (id) => `planner-solmode-${id}`;
      const finalKey = (id) => `planner-final-${id}`;
      const getSolMode = () => (current && localStorage.getItem(solModeKey(current.id))) || 'mode1';
      const isFinal = () => !!current && (localStorage.getItem(finalKey(current.id)) === '1' || (!!current.state.analysis && current.state.questions.length === 0));
      let renaming = false;
      let nameDraft = '';
      let cvFocus = 'solution';
      let draftText = '';
      let consultResult = null;
      let patterns = null;
      let specialists = null;
      let newName = '';
      let options = { modes: ['rules'], defaultMode: 'rules' };
      let mode = 'rules';
      let busy = false;
      let chatDraft = '';
      let patternEdit = null;
      let spec = { service: null, chatId: null, intent: 'ask', messages: [], draft: '', chats: [] };
      const INTENTS = [['ask', 'Ask'], ['recommend', 'Recommend'], ['design', 'Refine design'], ['validate', 'Validate'], ['sample', 'Sample code']];
      const answerDrafts = {};

      const api = async (method, path, body) => {
        const res = await fetch(API + path, {
          method,
          headers: body ? { 'Content-Type': 'application/json' } : undefined,
          body: body ? JSON.stringify(body) : undefined,
        });
        const text = await res.text();
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch { data = { error: text }; }
        if (!res.ok) throw new Error((data && (data.errorMessage || data.error || data.message)) || `${res.status} ${res.statusText}`);
        return data;
      };

      const notify = (type, text) => {
        $('message').innerHTML = text ? `<goa-callout type="${type}" heading="${type === 'emergency' ? 'Error' : 'Done'}">${esc(text)}</goa-callout><goa-spacer vspacing="m"></goa-spacer>` : '';
        if (text && type !== 'emergency') setTimeout(() => ($('message').innerHTML = ''), 3500);
      };
      const run = async (fn) => {
        try { await fn(); } catch (e) { notify('emergency', e.message); }
      };

      const levelType = (l) => (l === 'high' ? 'success' : l === 'medium' ? 'important' : 'information');

      async function loadSolutions() {
        solutions = (await api('GET', '/solutions?top=50')).results || [];
        renderList();
      }
      function renderList() {
        $('solutions').innerHTML = solutions.length
          ? solutions.map((s) => `<button class="sol-item" role="listitem" data-id="${s.id}" ${current?.id === s.id ? 'aria-current="true"' : ''}>
              <strong>${esc(s.name)}</strong>
              <small>${esc(s.status)} · rev ${s.revision}</small></button>`).join('')
          : '<p class="muted">No solutions yet.</p>';
        $('solutions').querySelectorAll('.sol-item').forEach((b) => b.addEventListener('click', () => run(() => select(b.dataset.id))));
      }
      async function select(id) {
        current = await api('GET', `/solutions/${id}`);
        draftText = current.state.problemStatement || '';
        consultResult = null;
        spec = newSpec();
        await loadChatCounts();
        altReply = '';
        cvFocus = 'solution';
        renaming = false;
        renderList();
        renderWorkspace();
      }

      const list = (items, empty = 'None') => (items?.length ? `<ul class="plain">${items.map((i) => `<li>${i}</li>`).join('')}</ul>` : `<p class="muted">${empty}</p>`);

      const newSpec = (service = null) => ({ service, chatId: null, intent: 'ask', messages: [], draft: '', chats: [] });
      const fmtDate = (d) => new Date(d).toLocaleString();

      function renderSpecialistChat() {
        if (!spec.service) return '<p class="muted">Choose Chat on a service to talk with its specialist directly: ask questions, get recommendations, refine a design, validate a plan or get sample code. Your conversations are saved and can be reopened or downloaded.</p>';
        const def = (specialists || []).find((s) => s.service === spec.service);
        const list = (items, title) => items?.length ? `<p><strong>${title}</strong></p><ul>${items.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>` : '';
        const sample = (x) => `<goa-details heading="${esc(x.title || x.language)}"><pre style="white-space:pre-wrap;overflow:auto">${esc(x.code)}</pre></goa-details>`;
        const turn = (m) => m.role === 'user'
          ? `<goa-callout type="important" heading="You">${esc(m.content)}</goa-callout>`
          : `<goa-callout type="information" heading="${esc(def?.displayName || spec.service)}${m.mode === 'rules' ? ' (rule-based)' : ''}">
              <div style="white-space:pre-wrap">${esc(m.content)}</div>
              ${m.warning ? `<p class="muted">${esc(m.warning)}</p>` : ''}
              ${m.consult ? `<p><strong>Fit:</strong> ${esc(m.consult.fit)}</p>${list(m.consult.supports, 'Can support')}${list(m.consult.constraints, 'Constraints')}${list(m.consult.risks, 'Risks')}` : ''}
              ${m.validation ? `<p><strong>Verdict:</strong> ${esc(m.validation.verdict)}</p>${list(m.validation.findings, 'Findings')}` : ''}
              ${list(m.suggestions, 'Recommendations')}
              ${(m.samples || []).map(sample).join('')}
              ${m.followUps?.length ? `<div class="row">${m.followUps.map((f) => `<goa-button type="tertiary" size="compact" data-followup="${esc(f)}">${esc(f)}</goa-button>`).join('')}</div>` : ''}
            </goa-callout>`;
        const history = spec.chats.length
          ? `<goa-details heading="Saved chats (${spec.chats.length})" open="true"><ul>${spec.chats.map((c) => `<li><div class="row"><span>${esc(c.title)} <span class="muted">· ${c.messageCount} messages · ${esc(fmtDate(c.updatedOn))}</span></span>
              <goa-button type="tertiary" size="compact" data-chat-open="${c.id}">${spec.chatId === c.id ? 'Open (current)' : 'Open'}</goa-button>
              <goa-button type="tertiary" size="compact" data-chat-delete="${c.id}">Delete</goa-button></div></li>`).join('')}</ul></goa-details>`
          : '<p class="muted">No saved chats with this specialist yet.</p>';
        return `<div class="stack"><h3>Specialist chat: ${esc(def?.displayName || spec.service)}</h3>
          ${history}
          <div class="row"><goa-button type="secondary" size="compact" id="newChat">New chat</goa-button>
            <goa-button type="secondary" size="compact" id="dlAllMd">Download all chats (Markdown)</goa-button>
            <goa-button type="secondary" size="compact" id="dlAllJson">Download all chats (JSON)</goa-button>
            ${spec.chatId ? '<goa-button type="secondary" size="compact" id="dlChatMd">Download this chat (Markdown)</goa-button><goa-button type="secondary" size="compact" id="dlChatJson">Download this chat (JSON)</goa-button>' : ''}</div>
          <div class="row">${INTENTS.map(([k, label]) => `<goa-button type="${spec.intent === k ? 'primary' : 'secondary'}" size="compact" data-intent="${k}">${label}</goa-button>`).join('')}</div>
          ${spec.messages.map(turn).join('')}
          <goa-textarea id="specInput" name="spec" rows="3" width="100%" value="${esc(spec.draft)}" aria-label="Message to the specialist"></goa-textarea>
          <div class="row"><goa-button id="specSend">Send</goa-button></div></div>`;
      }

      async function loadChatCounts() {
        chatCounts = {};
        if (!current) return;
        for (const c of (await api('GET', `/specialists/chats?solutionId=${current.id}`)).results) chatCounts[c.service] = (chatCounts[c.service] || 0) + 1;
      }
      async function loadChats() {
        spec.chats = (await api('GET', `/specialists/chats?service=${spec.service}`)).results;
        await loadChatCounts();
      }
      async function openChat(id) {
        const chat = await api('GET', `/specialists/chats/${id}`);
        spec.chatId = chat.id;
        spec.messages = chat.messages;
        renderWorkspace();
      }
      async function sendSpecialist(text) {
        if (busy || !text.trim()) return;
        const message = text.trim();
        spec.draft = '';
        const res = await api('POST', `/specialists/${spec.service}/chat`, { message, chatId: spec.chatId || undefined, intent: spec.intent, solutionId: current?.id, mode });
        spec.chatId = res.chatId;
        const at = new Date().toISOString();
        spec.messages.push({ role: 'user', content: message, at }, { role: 'assistant', content: res.reply, at, mode: res.mode, warning: res.warning, validation: res.validation, suggestions: res.suggestions, samples: res.samples, followUps: res.followUps });
        await loadChats();
        renderWorkspace();
      }

      function chatToMarkdown(chat) {
        const bullets = (title, items) => (items?.length ? ['', `**${title}**`, ...items.map((i) => `- ${i}`)] : []);
        const out = [`## ${chat.title}`, '', `Specialist: ${chat.service} · Started ${fmtDate(chat.createdOn)} · Last updated ${fmtDate(chat.updatedOn)}`];
        for (const m of chat.messages) {
          out.push('', m.role === 'user' ? `### You (${fmtDate(m.at)})` : `### ${chat.service} (${fmtDate(m.at)}${m.mode === 'rules' ? ', rule-based' : ''})`, '', m.content);
          if (m.consult) out.push(`Fit: ${m.consult.fit}`, ...bullets('Can support', m.consult.supports), ...bullets('Constraints', m.consult.constraints), ...bullets('Risks', m.consult.risks));
          if (m.validation) out.push('', `**Verdict:** ${m.validation.verdict}`, ...bullets('Findings', m.validation.findings));
          out.push(...bullets('Recommendations', m.suggestions));
          for (const s of m.samples || []) out.push('', `**${s.title || 'Sample'}**`, '', '```' + s.language, s.code, '```');
        }
        return out.join('\n');
      }
      const PATTERN_FIELDS = [
        ['name', 'Business pattern (name)', 1],
        ['description', 'Purpose', 3],
        ['domainLanguage', 'Common domain language (one per line)', 4],
        ['commonFeatures', 'Common features (one per line)', 4],
        ['strongSignals', 'Strong confidence signals (one per line: description | keyword, keyword)', 5],
        ['weakSignals', 'Weak or misleading signals (one per line: description | keyword, keyword)', 4],
        ['serviceMappings', 'Likely ADSP service mappings (one per line: service-name: reason)', 5],
        ['clarifyingQuestions', 'Clarifying questions (one per line)', 4],
        ['assumptions', 'Assumptions (one per line)', 3],
        ['knownUnknowns', 'Known unknowns (one per line)', 3],
      ];
      const lines = (s) => String(s || '').split('\n').map((x) => x.trim()).filter(Boolean);
      const signalText = (list) => (list || []).map((s) => `${s.description} | ${s.keywords.join(', ')}`).join('\n');
      const toSignals = (s) => lines(s).map((l) => { const [d, k = ''] = l.split('|'); return { description: d.trim(), keywords: k.split(',').map((x) => x.trim()).filter(Boolean) }; });
      const toMappings = (s) => lines(s).map((l) => { const i = l.indexOf(':'); return { service: (i < 0 ? l : l.slice(0, i)).trim(), reason: i < 0 ? '' : l.slice(i + 1).trim() }; });
      function patternToFields(p) {
        return {
          name: p.name || '', description: p.description || '',
          domainLanguage: (p.domainLanguage || []).join('\n'), commonFeatures: (p.commonFeatures || []).join('\n'),
          strongSignals: signalText(p.strongSignals), weakSignals: signalText(p.weakSignals),
          serviceMappings: (p.serviceMappings || []).map((m) => `${m.service}: ${m.reason}`).join('\n'),
          clarifyingQuestions: (p.clarifyingQuestions || []).join('\n'), assumptions: (p.assumptions || []).join('\n'), knownUnknowns: (p.knownUnknowns || []).join('\n'),
        };
      }
      function fieldsToPattern(f) {
        return {
          name: f.name.trim(), description: f.description.trim(), domainLanguage: lines(f.domainLanguage), commonFeatures: lines(f.commonFeatures),
          strongSignals: toSignals(f.strongSignals), weakSignals: toSignals(f.weakSignals), serviceMappings: toMappings(f.serviceMappings),
          clarifyingQuestions: lines(f.clarifyingQuestions), assumptions: lines(f.assumptions), knownUnknowns: lines(f.knownUnknowns),
        };
      }
      function renderPatternEditor() {
        return `<div class="stack"><h3>${patternEdit.id ? `Edit pattern: ${esc(patternEdit.id)}` : 'New pattern'}</h3>
          ${PATTERN_FIELDS.map(([k, label, rows]) => `<goa-form-item label="${esc(label)}"><goa-textarea data-pf="${k}" name="pf-${k}" rows="${rows}" width="100%" value="${esc(patternEdit.fields[k])}" aria-label="${esc(label)}"></goa-textarea></goa-form-item>`).join('')}
          <p class="muted">Valid services: ${(specialists || []).map((s) => esc(s.service)).join(', ')}</p>
          <div class="row"><goa-button id="savePattern">Save pattern</goa-button><goa-button type="tertiary" id="cancelPattern">Cancel</goa-button></div></div>`;
      }
      async function reloadPatterns() {
        patterns = (await api('GET', '/patterns')).results;
      }      function renderObject(o) {
        const { advice, ...rest } = o;
        const adviceHtml = advice ? `<h4 style="margin-bottom:0">Guidance</h4>${advice.split(/\n{2,}/).map((p) => `<p style="margin-top:0">${esc(p)}</p>`).join('')}` : '';
        return adviceHtml + Object.entries(rest)
          .filter(([k]) => k !== 'service')
          .map(([k, v]) => `<h4 style="margin-bottom:0">${esc(k)}</h4>${Array.isArray(v) ? list(v.map((i) => (typeof i === 'object' ? esc(JSON.stringify(i)) : esc(i)))) : `<p style="margin-top:0">${esc(typeof v === 'object' ? JSON.stringify(v) : v)}</p>`}`)
          .join('');
      }

      function sectionHtml(sec = section) {
        const st = current.state;
        if (sec === 'problem') {
          return `<div class="stack">
            <goa-textarea id="problem" name="problem" rows="6" width="100%" value="${esc(draftText)}" aria-label="Problem statement"></goa-textarea>
            <div class="row" role="group" aria-label="Analysis mode" style="flex-wrap:nowrap">
              <span><strong>Analysis mode:</strong></span>
              <goa-button type="${mode === 'ai' ? 'primary' : 'secondary'}" size="compact" data-mode="ai" ${options.modes.includes('ai') ? '' : 'disabled="true"'}>AI analysis</goa-button>
              <goa-button type="${mode === 'rules' ? 'primary' : 'secondary'}" size="compact" data-mode="rules">Rule-based</goa-button>
            </div>
            <div class="row"><goa-button id="analyzeBtn" type="primary">${busy ? 'Analyzing…' : 'Save &amp; analyze'}</goa-button>
            <goa-button id="deleteBtn" type="tertiary" variant="destructive">Delete solution</goa-button></div>
            ${busy ? '<goa-circular-progress visible="true" message="Asking the model — this can take up to a minute"></goa-circular-progress>' : ''}
            ${st.analysis ? `<goa-callout type="${st.analysis.warning ? 'important' : 'success'}" heading="${st.analysis.mode === 'ai' ? 'AI analysis' : 'Rule-based analysis'}">${st.analysis.warning ? esc(st.analysis.warning) : `Completed ${esc(new Date(st.analysis.analyzedOn).toLocaleString())}`}</goa-callout>` : ''}
            <h3>Pattern matches</h3>
            ${st.patternMatches.length ? `<goa-table width="100%"><table><thead><tr><th>Pattern</th><th>Score</th><th>Confidence</th><th>Why</th></tr></thead><tbody>
              ${st.patternMatches.map((m) => `<tr><td>${esc(m.patternName)}</td><td>${m.score}</td><td><goa-badge type="${levelType(m.level)}" content="${esc(m.level)}"></goa-badge></td><td>${esc(m.explanation)}</td></tr>`).join('')}
              </tbody></table></goa-table>` : '<p class="muted">Not analyzed yet.</p>'}
          </div>`;
        }
        if (sec === 'hypotheses') {
          return st.hypotheses.length
            ? `<goa-accordion-group>${st.hypotheses.map((h, i) => `<goa-accordion heading="${esc(h.title)}" secondarytext="${esc(h.confidence)} confidence" ${i === 0 ? 'open="true"' : ''}>
                <p>${esc(h.rationale)}</p>
                <h4>Recommended services</h4>
                ${list([...h.recommendations].sort((a, b) => a.order - b.order).map((r) => `<strong>${r.order}. ${esc(r.service)}</strong> — ${esc(r.reason)}`))}
                <h4>Assumptions</h4>${list(h.assumptions.map(esc))}
                <h4>Unknowns</h4>${list(h.unknowns.map(esc))}
              </goa-accordion>`).join('')}</goa-accordion-group>`
            : '<p class="muted">Run an analysis to see solution hypotheses.</p>';
        }
        if (sec === 'concepts') {
          return st.concepts.length
            ? `<goa-table width="100%"><table><thead><tr><th>Type</th><th>Name</th><th>Source</th></tr></thead><tbody>
               ${st.concepts.map((c) => `<tr><td><goa-badge type="information" content="${esc(c.type)}"></goa-badge></td><td>${esc(c.name)}</td><td>${esc(c.source)}</td></tr>`).join('')}</tbody></table></goa-table>`
            : '<p class="muted">No concepts yet.</p>';
        }
        if (sec === 'questions') {
          const open = st.questions.filter((q) => q.status === 'open');
          return `<div class="stack">
            ${st.questions.length ? `<p class="muted">${open.length} open · ${st.questions.length - open.length} answered. Answer questions, then refine the analysis.</p>` : '<p class="muted">No questions yet. Run an analysis first.</p>'}
            ${st.questions.map((q) => `<goa-container type="non-interactive" accent="thin">
              <div class="row"><strong>${esc(q.question)}</strong> <goa-badge type="${q.status === 'open' ? 'important' : 'success'}" content="${esc(q.status)}"></goa-badge> <span class="muted">(${esc(q.raisedBy)})</span></div>
              <goa-spacer vspacing="s"></goa-spacer>
              <goa-textarea data-answer="${q.id}" name="a-${q.id}" rows="2" width="100%" value="${esc(answerDrafts[q.id] ?? q.answer ?? '')}" aria-label="Answer to: ${esc(q.question)}"></goa-textarea>
              <goa-spacer vspacing="s"></goa-spacer>
              <div class="row"><goa-button type="secondary" size="compact" data-save-answer="${q.id}">${q.status === 'answered' ? 'Update answer' : 'Save answer'}</goa-button></div>
            </goa-container>`).join('')}
            ${st.questions.length ? `<div class="row"><goa-button id="refineBtn" type="primary">${busy ? 'Refining…' : refineLabel}</goa-button></div>
            ${busy ? '<goa-circular-progress visible="true" message="Refining — this can take up to a minute"></goa-circular-progress>' : ''}` : ''}
          </div>`;
        }
        if (sec === 'conversation') {
          const msgs = st.conversation || [];
          return `<div class="stack">
            ${msgs.length ? msgs.map((m) => `<goa-callout type="${m.role === 'user' ? 'information' : 'success'}" heading="${m.role === 'user' ? 'You' : 'Planner'}">${esc(m.content)}</goa-callout>`).join('') : `<p class="muted">Ask a question, add detail, or correct the planner's understanding. ${mode === 'ai' ? 'The AI will answer and refine the analysis.' : 'Switch to AI analysis for conversational replies.'}</p>`}
            <goa-textarea id="chatInput" name="chat" rows="3" width="100%" value="${esc(chatDraft)}" placeholder="e.g. Applicants are small non-profits; decisions need a committee vote." aria-label="Message to the planner"></goa-textarea>
            <div class="row"><goa-button id="sendBtn" type="primary">${busy ? 'Thinking…' : 'Send'}</goa-button></div>
            ${busy ? '<goa-circular-progress visible="true" message="Asking the model — this can take up to a minute"></goa-circular-progress>' : ''}
          </div>`;
        }
        if (sec === 'steps') {
          return list(st.nextSteps.map((n) => `<strong>${esc(n.title)}</strong>${n.service ? ` <goa-badge type="information" content="${esc(n.service)}"></goa-badge>` : ''} — ${esc(n.reason)}`), 'Run an analysis to get next steps.');
        }
        if (sec === 'specialists') {
          const progress = Object.fromEntries(st.specialists.map((s) => [s.service, s.status]));
          return `<div class="stack"><goa-table width="100%"><table><thead><tr><th>Service</th><th>Purpose</th><th>Status</th><th></th></tr></thead><tbody>
            ${(specialists || []).map((s) => `<tr><td>${esc(s.displayName)}</td><td>${esc(s.purpose)}</td><td>${esc(progress[s.service] || 'not-started')}</td>
              <td><div class="row"><goa-button type="secondary" size="compact" data-consult="${s.service}">Consult</goa-button><goa-button type="tertiary" size="compact" data-spec="${s.service}">Chat</goa-button></div></td></tr>`).join('')}</tbody></table></goa-table>
            ${consultResult ? `<goa-callout type="information" heading="Specialist: ${esc(consultResult.service || '')}">${renderObject(consultResult)}</goa-callout>` : ''}
            ${renderSpecialistChat()}</div>`;
        }
        if (sec === 'patterns') {
          const block = (heading, items) =>
            items && items.length ? `<goa-details heading="${esc(heading)}"><ul>${items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul></goa-details>` : '';
          if (patternEdit) return renderPatternEditor();
          const sourceBadge = (s) => `<goa-badge type="${s === 'built-in' ? 'information' : s === 'custom' ? 'success' : 'important'}" content="${esc(s)}"></goa-badge>`;
          const actions = (p) => `<div class="row"><goa-button type="secondary" size="compact" data-pedit="${esc(p.id)}">Edit</goa-button>${p.source === 'built-in' ? '' : `<goa-button type="tertiary" size="compact" data-pdelete="${esc(p.id)}">${p.source === 'custom' ? 'Delete' : 'Reset to built-in'}</goa-button>`}</div>`;
          return `<div class="stack"><div class="row"><goa-button id="newPattern">New pattern</goa-button></div><goa-table width="100%"><table><thead><tr><th>Pattern</th><th>Description</th><th>Services</th><th></th></tr></thead><tbody>
            ${(patterns || []).map((p) => `<tr><td>${esc(p.name)}<br>${sourceBadge(p.source)}</td><td>${esc(p.description)}${block('Common domain language', p.domainLanguage)}${block('Common features', p.commonFeatures)}${block('Strong confidence signals', (p.strongSignals || []).map((s) => s.description))}${block('Weak or misleading signals', (p.weakSignals || []).map((s) => s.description))}${block('Clarifying questions', p.clarifyingQuestions)}${block('Assumptions', p.assumptions)}${block('Known unknowns', p.knownUnknowns)}</td><td>${p.serviceMappings.map((m) => `<div><b>${esc(m.service)}</b>: ${esc(m.reason)}</div>`).join('')}</td><td>${actions(p)}</td></tr>`).join('')}</tbody></table></goa-table></div>`;        }
        return '';
      }

      const tabs = [['problem', 'Problem & analysis'], ['conversation', 'Conversation'], ['hypotheses', 'Hypotheses'], ['concepts', 'Concepts'], ['questions', 'Questions'], ['steps', 'Next steps'], ['specialists', 'Specialists'], ['patterns', 'Pattern catalog']];

      const VIEWS = [['default', 'Default view'], ['compressed', 'Compressed view']];

      const cdet = (title, html, open = false) => `<goa-details heading="${esc(title)}" ${open ? 'open="true"' : ''}>${html}</goa-details>`;

      function alternativesHtml() {
        const st = current.state;
        const top = st.patternMatches[0];
        const alts = st.patternMatches.slice(1, 4).map((m) => {
          const p = (patterns || []).find((x) => x.id === m.patternId || x.name === m.patternName);
          return `<goa-container type="non-interactive" accent="thin"><div class="row"><strong>${esc(m.patternName)}</strong> <goa-badge type="${levelType(m.level)}" content="${esc(m.level)}"></goa-badge></div>
            <p>${esc(m.explanation)}</p>
            ${p ? `<p><strong>Typical workflow</strong></p>${list((p.commonFeatures || []).slice(0, 5).map(esc))}<p><strong>Services</strong></p>${list(p.serviceMappings.map((x) => `<b>${esc(x.service)}</b>: ${esc(x.reason)}`))}` : ''}</goa-container>`;
        });
        const otherHyp = st.hypotheses.slice(1).map((h) => `<goa-container type="non-interactive" accent="thin"><strong>${esc(h.title)}</strong> <goa-badge type="information" content="${esc(h.confidence)} confidence"></goa-badge><p>${esc(h.rationale)}</p>${list([...h.recommendations].sort((a, b) => a.order - b.order).map((r) => `<b>${esc(r.service)}</b> — ${esc(r.reason)}`))}</goa-container>`);
        const aiOk = options.modes.includes('ai');
        return `<div class="cv-panes">
          <goa-container accent="thin"><div class="stack pane">
            <h3>Current approach</h3>
            ${st.analysis ? `<p><strong>${esc(st.hypotheses[0]?.title || top?.patternName || 'Initial solution')}</strong></p><p>${esc(st.hypotheses[0]?.rationale || '')}</p>` : '<p class="muted">Analyze the problem first (Mode 1 or 2) to get a baseline to compare alternatives against.</p>'}
            <h3>Problem statement</h3><p>${esc(st.problemStatement || 'None')}</p>
          </div></goa-container>
          <goa-container accent="thin"><div class="stack pane">
            <h3>Alternative workflows</h3>
            ${st.analysis ? (alts.concat(otherHyp).join('') || '<p class="muted">No other strong patterns matched.</p>') : ''}
            <div class="row"><goa-button id="altAiBtn" type="primary" ${aiOk && st.analysis ? '' : 'disabled="true"'}>${busy ? 'Thinking…' : 'Ask AI for more alternatives'}</goa-button></div>
            ${busy ? '<goa-circular-progress visible="true" message="Asking the model — this can take up to a minute"></goa-circular-progress>' : ''}
            ${altReply ? `<goa-callout type="information" heading="AI-suggested alternatives"><div style="white-space:pre-wrap">${esc(altReply)}</div></goa-callout>` : ''}
          </div></goa-container></div>`;
      }

      function compressedHtml() {
        const st = current.state;
        const rail = `<nav class="cv-rail" aria-label="Navigation">
          <goa-button type="${cvFocus === 'solution' ? 'primary' : 'tertiary'}" size="compact" data-cv="solution">Solution workspace</goa-button>
          <h4>Specialists</h4>
          ${(specialists || []).map((s) => `<goa-button type="${cvFocus === s.service ? 'primary' : 'tertiary'}" size="compact" data-cv-spec="${s.service}">${chatCounts[s.service] ? `<strong>${esc(s.displayName.replace(/ service$/i, ''))} (${chatCounts[s.service]})</strong>` : esc(s.displayName.replace(/ service$/i, ''))}</goa-button>`).join('')}
          <h4>Reference</h4>
          <goa-button type="${cvFocus === 'patterns' ? 'primary' : 'tertiary'}" size="compact" data-cv="patterns">Patterns</goa-button>
        </nav>`;
        let main;
        if (cvFocus === 'patterns') main = sectionHtml('patterns');
        else if (cvFocus !== 'solution') {
          main = `<div class="stack"><div class="row"><goa-button type="secondary" size="compact" data-consult="${esc(cvFocus)}">Consult on this solution</goa-button></div>
            ${consultResult && consultResult.service === cvFocus ? `<goa-callout type="information" heading="Consultation">${renderObject(consultResult)}</goa-callout>` : ''}
            ${renderSpecialistChat()}</div>`;
        } else {
          const sm = getSolMode();
          const modeBar = `<div class="row" role="group" aria-label="Mode" style="margin-bottom:1rem"><strong>Mode:</strong>${SOL_MODES.map(([id, label]) => `<goa-button type="${sm === id ? 'primary' : 'secondary'}" size="compact" data-solmode="${id}">${label}</goa-button>`).join('')}</div>`;
          const hint = { mode1: 'Initial solution from the problem statement and follow-up questions; you refine it.', mode2: 'Give the problem statement, answer the AI follow-up questions, and get a final refined solution. Then refine by conversation or consult a specialist.', mode3: 'Compare other ways this problem could be solved.' }[sm];
          let panes;
          if (sm === 'mode3') panes = alternativesHtml();
          else if (sm === 'mode2') {
            refineLabel = 'Generate final refined solution';
            const fin = isFinal();
            const recs = (st.hypotheses[0]?.recommendations || []).slice().sort((a, b) => a.order - b.order);
            panes = `<div class="cv-panes">
              <goa-container accent="thin"><div class="stack pane">
                <h3>1. Problem statement</h3>${sectionHtml('problem')}
                <h3>2. Follow-up questions</h3>${st.analysis ? sectionHtml('questions') : '<p class="muted">Save and analyze the problem; the AI will ask follow-up questions here.</p>'}
                ${fin ? `<h3>4. Refine by conversation</h3>${sectionHtml('conversation')}` : ''}
              </div></goa-container>
              <goa-container accent="thin"><div class="stack pane">
                <h3>3. ${fin ? 'Final refined solution' : 'Draft solution (refined after your answers)'}</h3>
                ${fin ? '<goa-callout type="success" heading="Final refined solution" size="medium">Refine it in the conversation or consult a specialist.</goa-callout>' : '<goa-callout type="important" heading="Draft" size="medium">Answer the follow-up questions, then choose Generate final refined solution.</goa-callout>'}
                ${st.analysis ? `${cdet('Hypotheses', sectionHtml('hypotheses'), true)}${cdet('Concepts', sectionHtml('concepts'), fin)}${cdet('Next steps', sectionHtml('steps'), fin)}` : '<p class="muted">Analyze the problem to see the draft solution.</p>'}
                ${fin ? `<h3>5. Consult a specialist</h3><div class="row">${recs.map((r) => `<goa-button type="secondary" size="compact" data-cv-spec="${esc(r.service)}">${esc(r.service)}</goa-button>`).join('') || '<span class="muted">No recommended services yet.</span>'}</div>` : ''}
              </div></goa-container></div>`;
          } else {
            refineLabel = 'Refine analysis with my answers';
            const questions = st.analysis
              ? `<h3>Questions</h3>${sectionHtml('questions')}`
              : '<h3>Questions</h3><p class="muted">Save and analyze the problem first; questions to refine the solution will appear here.</p>';
            panes = `<div class="cv-panes">
              <goa-container accent="thin"><div class="stack pane">
                <h3>Problem, analysis &amp; conversation</h3>
                ${sectionHtml('problem')}
                ${questions}
                <h3>Conversation</h3>
                ${sectionHtml('conversation')}
              </div></goa-container>
              <goa-container accent="thin"><div class="stack pane">
                ${cdet('Hypotheses', sectionHtml('hypotheses'), true)}
                ${cdet('Concepts', sectionHtml('concepts'), true)}
                ${cdet('Next steps', sectionHtml('steps'), true)}
              </div></goa-container></div>`;
          }
          main = `${modeBar}<p class="muted" style="margin-top:0">${esc(hint)}</p>${panes}`;
        }
        return `<div class="cv">${rail}<div class="cv-main" id="cvMain">${main}</div></div>`;
      }

      const download = (filename, content, type) => {
        const url = URL.createObjectURL(new Blob([content], { type }));
        const a = Object.assign(document.createElement('a'), { href: url, download: filename });
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      };

      function toMarkdown(s) {
        const st = s.state;
        const lines = [`# ${s.name}`, '', `Status: ${s.status} · Exported ${new Date().toLocaleString()}`, '', '## Problem statement', '', st.problemStatement || '_None_', ''];
        if (st.analysis) lines.push(`_Analysis: ${st.analysis.mode === 'ai' ? 'AI' : 'rule-based'}${st.analysis.warning ? ` — ${st.analysis.warning}` : ''}_`, '');
        lines.push('## Pattern matches', '');
        st.patternMatches.forEach((m) => lines.push(`- **${m.patternName}** — ${m.level} (score ${m.score}). ${m.explanation}`));
        lines.push('', '## Hypotheses', '');
        st.hypotheses.forEach((h) => {
          lines.push(`### ${h.title} (${h.confidence} confidence)`, '', h.rationale, '', '**Recommended services (in order)**', '');
          [...h.recommendations].sort((a, b) => a.order - b.order).forEach((r) => lines.push(`${r.order}. **${r.service}** — ${r.reason}`));
          if (h.assumptions.length) lines.push('', '**Assumptions**', '', ...h.assumptions.map((a) => `- ${a}`));
          if (h.unknowns.length) lines.push('', '**Unknowns**', '', ...h.unknowns.map((a) => `- ${a}`));
          lines.push('');
        });
        lines.push('## Concepts', '');
        st.concepts.forEach((c) => lines.push(`- ${c.type}: ${c.name}`));
        lines.push('', '## Questions and answers', '');
        st.questions.forEach((q) => lines.push(`- **${q.question}** (${q.status})${q.answer ? `\n  - Answer: ${q.answer}` : ''}`));
        lines.push('', '## Next steps', '');
        st.nextSteps.forEach((n) => lines.push(`- **${n.title}** — ${n.reason}`));
        if ((st.conversation || []).length) {
          lines.push('', '## Conversation', '');
          st.conversation.forEach((m) => lines.push(`- **${m.role === 'user' ? 'You' : 'Planner'}:** ${m.content}`));
        }
        return lines.join('\n') + '\n';
      }

      const safeName = (s) => s.name.replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase() || 'solution';

      function renderWorkspace() {
        if (!current) return;
        $('workspace').innerHTML = `<goa-container accent="thick">
          <div class="row" style="justify-content:space-between;flex-wrap:wrap">
            ${renaming
              ? `<div class="row"><goa-input id="renameInput" name="rename" value="${esc(nameDraft)}" width="320px" aria-label="Solution name"></goa-input>
                  <goa-button id="renameSave" type="primary" size="compact">Save</goa-button><goa-button id="renameCancel" type="tertiary" size="compact">Cancel</goa-button></div>`
              : `<h2 style="margin:0">${esc(current.name)} <goa-icon-button id="renameBtn" icon="pencil" size="medium" title="Edit solution name" aria-label="Edit solution name"></goa-icon-button> <goa-badge type="information" content="${esc(current.status)}"></goa-badge></h2>`}
            <div class="row" aria-label="Export">
              <goa-button id="exportJsonBtn" type="secondary" size="compact" leadingicon="download">Download JSON</goa-button>
              <goa-button id="exportMdBtn" type="secondary" size="compact" leadingicon="document-text">Download report (.md)</goa-button>
            </div>
          </div>
<goa-spacer vspacing="m"></goa-spacer>
          <div class="row" role="group" aria-label="View"><strong>View:</strong>${VIEWS.map(([id, label]) => `<goa-button type="${view === id ? 'primary' : 'secondary'}" size="compact" data-view="${id}">${label}</goa-button>`).join('')}</div>
          <goa-spacer vspacing="m"></goa-spacer>
          ${view === 'compressed' ? compressedHtml() : `<div class="row" role="toolbar" aria-label="Sections">${tabs.map(([id, label]) => `<goa-button type="${section === id ? 'primary' : 'tertiary'}" size="compact" data-section="${id}">${esc(label)}</goa-button>`).join('')}</div>
          <goa-spacer vspacing="m"></goa-spacer>
          <div id="section">${sectionHtml()}</div>`}</goa-container>`;
        document.querySelector('main').classList.toggle('wide', view === 'compressed');
        $('workspace').querySelectorAll('[data-view]').forEach((b) => b.addEventListener('_click', () => run(async () => {
          view = b.dataset.view;
          if (!specialists) specialists = (await api('GET', '/specialists')).results;
          if (view === 'compressed' && !patterns) await reloadPatterns();
          renderWorkspace();
        })));
        $('workspace').querySelectorAll('[data-solmode]').forEach((b) => b.addEventListener('_click', () => run(async () => {
          localStorage.setItem(solModeKey(current.id), b.dataset.solmode);
          if (!patterns) await reloadPatterns();
          renderWorkspace();
        })));
        $('altAiBtn')?.addEventListener('_click', () => run(async () => {
          if (busy) return;
          busy = true;
          renderWorkspace();
          try {
            current = await api('POST', `/solutions/${current.id}/chat`, { message: 'Suggest 2-3 alternative workflows or solution approaches for this problem, with the ADSP services each would use and the trade-offs compared with the current approach.', mode: 'ai' });
            const msgs = current.state.conversation || [];
            altReply = [...msgs].reverse().find((m) => m.role !== 'user')?.content || '';
          } finally {
            busy = false;
            renderWorkspace();
          }
        }));
        $('workspace').querySelectorAll('[data-cv]').forEach((b) => b.addEventListener('_click', () => run(async () => {
          cvFocus = b.dataset.cv;
          if (cvFocus === 'patterns') { await reloadPatterns(); patternEdit = null; }
          renderWorkspace();
        })));
        $('workspace').querySelectorAll('[data-cv-spec]').forEach((b) => b.addEventListener('_click', () => run(async () => {
          cvFocus = b.dataset.cvSpec;
          spec = newSpec(cvFocus);
          await loadChats();
          renderWorkspace();
          $('specInput')?.scrollIntoView?.({ block: 'center' });
          $('specInput')?.focus?.();
        })));
        $('workspace').querySelectorAll('[data-section]').forEach((b) => b.addEventListener('_click', () => run(async () => {
          section = b.dataset.section;
          if (section === 'patterns') { await reloadPatterns(); patternEdit = null; if (!specialists) specialists = (await api('GET', '/specialists')).results; }
          if (section === 'specialists' && !specialists) specialists = (await api('GET', '/specialists')).results;
          renderWorkspace();
        })));
        $('workspace').querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('_click', () => { mode = b.dataset.mode; renderWorkspace(); }));
        $('exportJsonBtn')?.addEventListener('_click', () => run(async () => {
          const data = await api('GET', `/solutions/${current.id}/export`);
          download(`planner-${safeName(current)}.json`, JSON.stringify(data, null, 2), 'application/json');
        }));
        $('renameBtn')?.addEventListener('_click', () => { renaming = true; nameDraft = current.name; renderWorkspace(); $('renameInput')?.focus?.(); });
        $('renameInput')?.addEventListener('_change', (e) => (nameDraft = e.detail.value));
        $('renameCancel')?.addEventListener('_click', () => { renaming = false; renderWorkspace(); });
        $('renameSave')?.addEventListener('_click', () => run(async () => {
          const name = nameDraft.trim();
          if (!name) throw new Error('Enter a name for the solution.');
          current = await api('PATCH', `/solutions/${current.id}`, { name });
          renaming = false;
          await loadSolutions();
          renderWorkspace();
          notify('success', 'Solution renamed.');
        }));
        $('exportMdBtn')?.addEventListener('_click', () => download(`planner-${safeName(current)}.md`, toMarkdown(current), 'text/markdown'));
        $('chatInput')?.addEventListener('_change', (e) => (chatDraft = e.detail.value));
        $('sendBtn')?.addEventListener('_click', () => run(async () => {
          if (busy || !chatDraft.trim()) return;
          busy = true;
          renderWorkspace();
          try {
            current = await api('POST', `/solutions/${current.id}/chat`, { message: chatDraft.trim(), mode });
            chatDraft = '';
            await loadSolutions();
          } finally {
            busy = false;
            renderWorkspace();
          }
        }));
        $('workspace').querySelectorAll('[data-answer]').forEach((t) => t.addEventListener('_change', (e) => (answerDrafts[t.dataset.answer] = e.detail.value)));
        $('workspace').querySelectorAll('[data-save-answer]').forEach((b) => b.addEventListener('_click', () => run(async () => {
          const id = b.dataset.saveAnswer;
          const answer = answerDrafts[id] ?? current.state.questions.find((q) => q.id === id)?.answer ?? '';
          current = await api('PUT', `/solutions/${current.id}/questions/${id}`, { answer });
          delete answerDrafts[id];
          notify('success', 'Answer saved.');
          renderWorkspace();
        })));
        $('refineBtn')?.addEventListener('_click', () => run(async () => {
          if (busy) return;
          busy = true;
          renderWorkspace();
          try {
            current = await api('POST', `/solutions/${current.id}/analyze`, { mode });
            if (getSolMode() === 'mode2') localStorage.setItem(finalKey(current.id), '1');
            notify('success', 'Analysis refined using your answers.');
            await loadSolutions();
          } finally {
            busy = false;
            renderWorkspace();
          }
        }));
        $('problem')?.addEventListener('_change', (e) => (draftText = e.detail.value));
        $('mode')?.addEventListener('_change', (e) => (mode = e.detail.value));
        $('analyzeBtn')?.addEventListener('_click', () => run(async () => {
          if (busy) return;
          busy = true;
          renderWorkspace();
          try {
            await api('PATCH', `/solutions/${current.id}`, { problemStatement: draftText });
            current = await api('POST', `/solutions/${current.id}/analyze`, { mode });
            notify('success', 'Analysis complete.');
            await loadSolutions();
          } finally {
            busy = false;
            renderWorkspace();
          }
        }));
        $('deleteBtn')?.addEventListener('_click', () => run(async () => {
          await api('DELETE', `/solutions/${current.id}`);
          current = null;
          $('workspace').innerHTML = '<goa-callout type="information" heading="Solution deleted">Choose or create another solution.</goa-callout>';
          await loadSolutions();
        }));
        $('newPattern')?.addEventListener('_click', () => { patternEdit = { id: null, fields: patternToFields({}) }; renderWorkspace(); });
        $('cancelPattern')?.addEventListener('_click', () => { patternEdit = null; renderWorkspace(); });
        $('workspace').querySelectorAll('[data-pf]').forEach((t) => t.addEventListener('_change', (e) => (patternEdit.fields[t.dataset.pf] = e.detail.value)));
        $('savePattern')?.addEventListener('_click', () => run(async () => {
          const body = fieldsToPattern(patternEdit.fields);
          if (patternEdit.id) await api('PUT', `/patterns/${patternEdit.id}`, body);
          else await api('POST', '/patterns', body);
          patternEdit = null;
          await reloadPatterns();
          renderWorkspace();
        }));
        $('workspace').querySelectorAll('[data-pedit]').forEach((b) => b.addEventListener('_click', () => {
          const p = patterns.find((x) => x.id === b.dataset.pedit);
          patternEdit = { id: p.id, fields: patternToFields(p) };
          renderWorkspace();
        }));
        $('workspace').querySelectorAll('[data-pdelete]').forEach((b) => b.addEventListener('_click', () => run(async () => {
          await api('DELETE', `/patterns/${b.dataset.pdelete}`);
          await reloadPatterns();
          renderWorkspace();
        })));
        $('workspace').querySelectorAll('[data-spec]').forEach((b) => b.addEventListener('_click', () => run(async () => {
          spec = newSpec(b.dataset.spec);
          await loadChats();
          renderWorkspace();
        })));
        $('newChat')?.addEventListener('_click', () => { spec.chatId = null; spec.messages = []; renderWorkspace(); });
        $('workspace').querySelectorAll('[data-chat-open]').forEach((b) => b.addEventListener('_click', () => run(() => openChat(b.dataset.chatOpen))));
        $('workspace').querySelectorAll('[data-chat-delete]').forEach((b) => b.addEventListener('_click', () => run(async () => {
          await api('DELETE', `/specialists/chats/${b.dataset.chatDelete}`);
          if (spec.chatId === b.dataset.chatDelete) { spec.chatId = null; spec.messages = []; }
          await loadChats();
          renderWorkspace();
        })));
        $('dlChatJson')?.addEventListener('_click', () => run(async () => download(`planner-chat-${spec.chatId}.json`, JSON.stringify(await api('GET', `/specialists/chats/${spec.chatId}/export`), null, 2), 'application/json')));
        $('dlChatMd')?.addEventListener('_click', () => run(async () => download(`planner-chat-${spec.chatId}.md`, chatToMarkdown(await api('GET', `/specialists/chats/${spec.chatId}`)), 'text/markdown')));
        $('dlAllJson')?.addEventListener('_click', () => run(async () => download('planner-specialist-chats.json', JSON.stringify(await api('GET', '/specialists/chats/export'), null, 2), 'application/json')));
        $('dlAllMd')?.addEventListener('_click', () => run(async () => {
          const { chats } = await api('GET', '/specialists/chats/export');
          if (!chats.length) throw new Error('There is no chat history to download.');
          download('planner-specialist-chats.md', ['# ADSP Planner specialist chat history', '', `Exported ${fmtDate(new Date())}`, '', ...chats.map(chatToMarkdown)].join('\n\n'), 'text/markdown');
        }));
        $('workspace').querySelectorAll('[data-intent]').forEach((b) => b.addEventListener('_click', () => { spec.intent = b.dataset.intent; renderWorkspace(); }));
        $('specInput')?.addEventListener('_change', (e) => (spec.draft = e.detail.value));
        $('specSend')?.addEventListener('_click', () => run(() => sendSpecialist(spec.draft)));
        $('workspace').querySelectorAll('[data-followup]').forEach((b) => b.addEventListener('_click', () => run(() => sendSpecialist(b.dataset.followup))));
        $('workspace').querySelectorAll('[data-consult]').forEach((b) => b.addEventListener('_click', () => run(async () => {
          consultResult = await api('POST', `/solutions/${current.id}/consult/${b.dataset.consult}`, { mode });
          current = await api('GET', `/solutions/${current.id}`);
          if (spec.service === b.dataset.consult) await loadChats();
          else await loadChatCounts();
          renderWorkspace();
        })));
      }

      $('newName').addEventListener('_change', (e) => (newName = e.detail.value));
      $('createBtn').addEventListener('_click', () => run(async () => {
        if (!newName.trim()) throw new Error('Enter a name for the solution.');
        const created = await api('POST', '/solutions', { name: newName.trim() });
        newName = '';
        $('newName').setAttribute('value', '');
        await loadSolutions();
        section = 'problem';
        await select(created.id);
      }));

      run(async () => {
        options = await api('GET', '/analysis/options');
        mode = options.defaultMode;
        await loadSolutions();
      });
    </script>
  </body>
</html>
