components:
  parameters:
    Realm:
      name: realm
      in: query
      description: >
        Realm to act on. Required for core users, who name any realm except master. Tenant admins act on their own
        realm; naming another realm is forbidden.
      schema:
        type: string
      example: my-tenant
    ClientId:
      name: clientId
      in: path
      required: true
      description: Keycloak client ID of the client, URL encoded because it usually contains colons.
      schema:
        type: string
      example: urn%3Aads%3Amy-tenant%3Amy-service
  responses:
    RotationBadRequest:
      description: >
        Request is invalid: a core user did not give a realm, a value is not valid (mode, schedule, contacts), the
        action is not allowed in the current mode, or the realm has no admin with an email address.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RotationError'
          example:
            errorMessage: The realm query parameter is required.
    RotationUnauthorized:
      description: Request does not include a valid bearer token from the core realm or a tenant realm.
      content:
        text/plain:
          schema:
            type: string
          example: Unauthorized
    RotationForbidden:
      description: >
        User has neither the client-secret-admin nor the tenant-admin role, or is a tenant user acting on a realm other than their own.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RotationError'
          example:
            errorMessage: 'User Test User (ID: 3f2b8c1e-5d4a-4f6b-9c7e-1a2b3c4d5e6f) not permitted to manage client secret rotation.'
    RotationNotFound:
      description: The realm or the client was not found. Clients of the rotation service itself are not listed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RotationError'
          example:
            errorMessage: "Client with ID 'urn:ads:my-tenant:my-service' could not be found."
  schemas:
    RotationError:
      type: object
      properties:
        errorMessage:
          type: string
    RotationMode:
      type: string
      enum: [off, selected]
      description: >
        off: nothing rotates. selected: only clients that opt in with the rotation-enabled role. all: every
        confidential client of the realm.
    RealmRotation:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/RotationMode'
        expiryDays:
          type: integer
          description: Days a secret lives before it is rotated.
        noticeWindowDays:
          type: integer
          description: Days before expiry that contacts are notified.
        rotatedSecretOverlapDays:
          type: integer
          description: Days the previous secret keeps working after a rotation.
        minNoticeGapDays:
          type: integer
          description: Minimum days between notices. Set by platform administrators.
          readOnly: true
        editable:
          type: boolean
          description: False for the core realm, which platform administrators configure in the service configuration.
          readOnly: true
        defaults:
          type: object
          description: Platform defaults used for schedule values the realm does not set.
          readOnly: true
          properties:
            expiryDays:
              type: integer
            noticeWindowDays:
              type: integer
            rotatedSecretOverlapDays:
              type: integer
      example:
        mode: selected
        expiryDays: 90
        noticeWindowDays: 60
        rotatedSecretOverlapDays: 7
        minNoticeGapDays: 7
        editable: true
        defaults:
          expiryDays: 90
          noticeWindowDays: 60
          rotatedSecretOverlapDays: 7
    RotationClient:
      type: object
      properties:
        id:
          type: string
          description: Keycloak internal ID of the client.
          readOnly: true
        clientId:
          type: string
          description: Keycloak client ID.
          readOnly: true
        name:
          type: string
          readOnly: true
        optedIn:
          type: boolean
          description: Whether the client holds the rotation-enabled role.
          readOnly: true
        covered:
          type: boolean
          description: Whether rotation applies to the client under the realm mode.
          readOnly: true
        expiresAt:
          type: string
          format: date-time
          readOnly: true
        rotatedSecretExpiresAt:
          type: string
          format: date-time
          description: When the previous secret stops working. Only present after a rotation.
          readOnly: true
        lastRotatedAt:
          type: string
          format: date-time
          readOnly: true
        contacts:
          type: array
          items:
            type: string
          description: Extra email addresses notified for this client. Realm admins are always notified.
        status:
          type: string
          enum: [ok, notice-sent, rotated, failed]
          description: failed means the secret has expired.
          readOnly: true
      example:
        id: 5b3c0f9e-6c1d-4f6a-9d1e-2f7a8b9c0d1e
        clientId: urn:ads:my-tenant:my-service
        name: My service
        optedIn: true
        covered: true
        expiresAt: '2026-09-01T00:00:00.000Z'
        lastRotatedAt: '2026-06-01T00:00:00.000Z'
        contacts: [test.user@gov.ab.ca]
        status: ok
paths:
  /rotation/v1/realm:
    get:
      tags: [Realm]
      summary: Get realm rotation settings
      description: >
        Returns the rotation mode and schedule that apply to the realm. Requires the client-secret-admin role.
        Tenant admins read their own realm; core users name the realm with the realm parameter.
      operationId: getRealmRotation
      parameters:
        - $ref: '#/components/parameters/Realm'
      responses:
        '200':
          description: Settings of the realm.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealmRotation'
        '400':
          $ref: '#/components/responses/RotationBadRequest'
        '401':
          $ref: '#/components/responses/RotationUnauthorized'
        '403':
          $ref: '#/components/responses/RotationForbidden'
        '404':
          $ref: '#/components/responses/RotationNotFound'
    put:
      tags: [Realm]
      summary: Change realm rotation settings
      description: >
        Sets the rotation mode and schedule of the realm. Send only the values to change. Values must be whole numbers
        above zero, noticeWindowDays and rotatedSecretOverlapDays must be less than expiryDays, and turning rotation on
        needs at least one realm admin with an email address. The rotation policy in Keycloak is updated right away.
        The core realm cannot be changed here. Requires the
        client-secret-admin role.
      operationId: setRealmRotation
      parameters:
        - $ref: '#/components/parameters/Realm'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  $ref: '#/components/schemas/RotationMode'
                expiryDays:
                  type: integer
                noticeWindowDays:
                  type: integer
                rotatedSecretOverlapDays:
                  type: integer
            example:
              mode: selected
              expiryDays: 90
      responses:
        '200':
          description: Settings of the realm after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealmRotation'
        '400':
          $ref: '#/components/responses/RotationBadRequest'
        '401':
          $ref: '#/components/responses/RotationUnauthorized'
        '403':
          $ref: '#/components/responses/RotationForbidden'
        '404':
          $ref: '#/components/responses/RotationNotFound'
  /rotation/v1/clients:
    get:
      tags: [Client]
      summary: List clients
      description: >
        Lists the confidential clients of the realm with their rotation status. Secrets are never returned. Requires
        the client-secret-admin role.
      operationId: getRotationClients
      parameters:
        - $ref: '#/components/parameters/Realm'
      responses:
        '200':
          description: Clients of the realm.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RotationClient'
        '400':
          $ref: '#/components/responses/RotationBadRequest'
        '401':
          $ref: '#/components/responses/RotationUnauthorized'
        '403':
          $ref: '#/components/responses/RotationForbidden'
        '404':
          $ref: '#/components/responses/RotationNotFound'
  /rotation/v1/clients/{clientId}:
    patch:
      tags: [Client]
      summary: Set client contacts
      description: >
        Sets the extra email addresses notified about the client's secret. Send an empty list to clear them. The
        addresses together may be at most 255 characters. Requires the client-secret-admin role.
      operationId: setRotationClientContacts
      parameters:
        - $ref: '#/components/parameters/Realm'
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contacts]
              properties:
                contacts:
                  type: array
                  items:
                    type: string
            example:
              contacts: [test.user@gov.ab.ca]
      responses:
        '200':
          description: The updated client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotationClient'
        '400':
          $ref: '#/components/responses/RotationBadRequest'
        '401':
          $ref: '#/components/responses/RotationUnauthorized'
        '403':
          $ref: '#/components/responses/RotationForbidden'
        '404':
          $ref: '#/components/responses/RotationNotFound'
  /rotation/v1/clients/{clientId}/opt-in:
    put:
      tags: [Client]
      summary: Opt a client in or out
      description: >
        Adds or removes the rotation-enabled role of the client. Only allowed when the realm mode is selected, and
        opting in needs at least one realm admin with an email address. Requires the client-secret-admin role.
      operationId: setRotationClientOptIn
      parameters:
        - $ref: '#/components/parameters/Realm'
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
            example:
              enabled: true
      responses:
        '200':
          description: The updated client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotationClient'
        '400':
          $ref: '#/components/responses/RotationBadRequest'
        '401':
          $ref: '#/components/responses/RotationUnauthorized'
        '403':
          $ref: '#/components/responses/RotationForbidden'
        '404':
          $ref: '#/components/responses/RotationNotFound'
  /rotation/v1/clients/{clientId}/rotate:
    post:
      tags: [Client]
      summary: Rotate a client secret now
      description: >
        Generates a new secret. The previous secret keeps working for the overlap period. The new secret is never
        returned; read it in Keycloak. The client must be covered by rotation. Raises the client-secret-rotated event.
        Requires the client-secret-admin role.
      operationId: rotateClientSecret
      parameters:
        - $ref: '#/components/parameters/Realm'
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Dates of the new secret and of the previous one.
          content:
            application/json:
              schema:
                type: object
                properties:
                  expiresAt:
                    type: string
                    format: date-time
                  rotatedSecretExpiresAt:
                    type: string
                    format: date-time
              example:
                expiresAt: '2026-09-01T00:00:00.000Z'
                rotatedSecretExpiresAt: '2026-06-08T00:00:00.000Z'
        '400':
          $ref: '#/components/responses/RotationBadRequest'
        '401':
          $ref: '#/components/responses/RotationUnauthorized'
        '403':
          $ref: '#/components/responses/RotationForbidden'
        '404':
          $ref: '#/components/responses/RotationNotFound'
  /rotation/v1/clients/{clientId}/invalidate-previous:
    post:
      tags: [Client]
      summary: Invalidate the previous secret
      description: >
        Ends the overlap early by deleting the previous secret, for example if it may have been exposed. The current
        secret is untouched. Fails if there is no previous secret still in use. Raises the client-secret-revoked event.
        Requires the client-secret-admin role.
      operationId: invalidatePreviousClientSecret
      parameters:
        - $ref: '#/components/parameters/Realm'
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: The previous secret was removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  expiresAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/RotationBadRequest'
        '401':
          $ref: '#/components/responses/RotationUnauthorized'
        '403':
          $ref: '#/components/responses/RotationForbidden'
        '404':
          $ref: '#/components/responses/RotationNotFound'
  /rotation/v1/clients/{clientId}/notify:
    post:
      tags: [Client]
      summary: Send the expiry notice now
      description: >
        Raises the client-secret-rotation-due event for the client's current expiry, instead of waiting for the notice
        window. The client must be covered and have an expiry. Requires the client-secret-admin role.
      operationId: notifyClientSecretExpiry
      parameters:
        - $ref: '#/components/parameters/Realm'
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: The notice was sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifiedAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/RotationBadRequest'
        '401':
          $ref: '#/components/responses/RotationUnauthorized'
        '403':
          $ref: '#/components/responses/RotationForbidden'
        '404':
          $ref: '#/components/responses/RotationNotFound'
