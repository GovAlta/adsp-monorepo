components:
  schemas:
    EventError:
      type: object
      properties:
        errorMessage:
          type: string
    EventDefinition:
      type: object
      properties:
        namespace:
          type: string
          description: The namespace of the event definition.
        name:
          type: string
          description: The name of the event definition.
        description:
          type: string
          nullable: true
        payloadSchema:
          type: object
          description: JSON schema used to validate the payload of events sent with this namespace and name.
        isCore:
          type: boolean
          description: True if the definition is a core (platform) definition rather than tenant specific.
    EventCount:
      type: object
      properties:
        count:
          type: integer
          description: Number of logged events matching the supplied criteria.

/event/v1/events:
  post:
    tags:
      - Event
    description: >
      Send an event. Requires the event-sender role. The event is sent in the tenant of the user; core (platform)
      users can send an event for a specific tenant with the tenantId query parameter or body property.


      If the tenant has an event definition for the namespace and name, the payload is validated against the
      definition's payload schema. If there is no matching definition, the event is treated as an ad hoc event:
      it is still sent and logged, but the payload is not validated.


      Event definitions, the event log, and event streams are provided by the configuration, value, and push
      services; see the [event service guide](https://govalta.github.io/adsp-monorepo/services/event-service.html).
    parameters:
      - name: tenantId
        description: ID of the tenant to send the event for. Only used for core (platform) users.
        in: query
        required: false
        schema:
          type: string
        example: urn:ads:platform:tenant-service:v2:/tenants/61f2e3a8c9b1d2e3f4a5b6c7
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              namespace:
                type: string
                description: The namespace of the event definition.
                minLength: 1
                maxLength: 50
                example: application-events
              name:
                type: string
                description: The name of the event definition.
                minLength: 1
                maxLength: 50
                example: user-registration
              correlationId:
                type: string
                nullable: true
                description: An optional reference to an object that can be used by the event receiver for matching purposes.
                example: Bobs-user-id
              context:
                type: object
                nullable: true
                additionalProperties: true
                description: An optional object that can be used by the event receiver for matching purposes.
              timestamp:
                type: string
                description: The time the event was triggered, in ISO 8601 format.
                format: date-time
              payload:
                type: object
                description: An object with values matching the schema specified in the Event Definition that can be used by the event receiver.
              tenantId:
                type: string
                description: >
                  ID of the tenant to send the event for. Only core (platform) users can specify a tenant other than
                  their own.
            required:
              - namespace
              - name
              - timestamp
              - payload
          example:
            namespace: application-events
            name: user-registration
            correlationId: Bobs-user-id
            context:
              applicationId: application-1234
            timestamp: '2026-09-24T17:00:00.000Z'
            payload:
              userId: Bobs-user-id
              registeredOn: '2026-09-24'
    responses:
      200:
        description: Event successfully sent.
      400:
        description: >
          Event is invalid, for example namespace or name is missing or too long, the timestamp is not in ISO 8601
          format, the payload does not match the event definition schema, or there is no tenant context.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventError'
            example:
              errorMessage: 'Validation failed with error(s): timestamp (body) - Invalid value'
      401:
        description: Request does not include a valid bearer token.
      403:
        description: User does not have the event-sender role, or is sending an event for another tenant.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventError'
            example:
              errorMessage: 'User Test User (ID: 1234) not permitted to send event.'

/event/v1/events/count:
  get:
    tags:
      - Event
    description: >
      Count logged events matching the supplied criteria. Requires the event-reader role and a tenant context.
      Namespace and event name are each optional and independent of one another; other supplied criteria
      (timestamp range, correlation ID) are combined with namespace and name when determining the count. The
      count represents all events accessible to the tenant that match the supplied criteria.


      Event logging is provided via the value service, but consumers of this API do not need to call the value
      service directly.
    parameters:
      - name: namespace
        description: Namespace of the events to count. If omitted, events of all namespaces are counted.
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 50
        example: application-events
      - name: name
        description: Name of the events to count. If omitted, events of all names are counted.
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 50
        example: user-registration
      - name: timestampMin
        description: Inclusive minimum value of the event timestamp.
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: timestampMax
        description: Inclusive maximum value of the event timestamp.
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: correlationId
        description: Correlation ID associated with the events.
        in: query
        required: false
        schema:
          type: string
    responses:
      200:
        description: Events successfully counted.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCount'
            example:
              count: 1024
      400:
        description: >
          Request is invalid, for example namespace or name is too long, a timestamp is not in ISO 8601 format,
          or there is no tenant context.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventError'
            example:
              errorMessage: 'Validation failed with error(s): timestampMin (query) - Invalid value'
      401:
        description: Request does not include a valid bearer token.
      403:
        description: User does not have the event-reader role, or the tenant context does not match the user's tenant.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventError'
            example:
              errorMessage: 'User Test User (ID: 1234) not permitted to count events.'

/event/v1/definitions:
  get:
    tags:
      - Event Definition
    description: >
      Retrieves event definitions for the tenant of the user as well as core (platform) definitions, as a flat
      array. Requires configuration-reader or event-admin roles
    responses:
      200:
        description: Event definitions successfully retrieved.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/EventDefinition'
      401:
        description: Request does not include a valid bearer token.
      403:
        description: User does not have the event-admin or configuration-reader role.
  post:
    tags:
      - Event Definition
    description: >
      Creates an event definition in the tenant of the user, merging it into its namespace. Requires the
      event-admin role. Core (platform) definitions are not writable via this endpoint.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              namespace:
                type: string
                description: Namespace of the event definition.
              name:
                type: string
                description: Name of the event definition.
              description:
                type: string
                nullable: true
              payloadSchema:
                type: object
            required:
              - namespace
              - name
              - payloadSchema
          example:
            namespace: application-events
            name: user-registration
            description: A new user registered.
            payloadSchema:
              type: object
              properties:
                userId:
                  type: string
              required:
                - userId
    responses:
      200:
        description: Event definition successfully created.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventDefinition'
      400:
        description: Request is invalid, for example the payload schema is not a valid JSON schema, or there is no tenant context.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventError'
      401:
        description: Request does not include a valid bearer token.
      403:
        description: User does not have the event-admin role.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventError'
      409:
        description: An event definition with the same namespace and name already exists.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventError'

/event/v1/definitions/{namespace}/{name}:
  get:
    tags:
      - Event Definition
    description: >
      Retrieves a single tenant or core event definition.
      Requires configuration-reader and event-reader roles.
    parameters:
      - name: namespace
        description: Namespace of the event definition.
        in: path
        required: true
        schema:
          type: string
        example: application-events
      - name: name
        description: Name of the event definition.
        in: path
        required: true
        schema:
          type: string
        example: user-registration
    responses:
      200:
        description: Event definition successfully retrieved.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventDefinition'
      401:
        description: Request does not include a valid bearer token.
      403:
        description: User does not have the event-admin or configuration-reader role.
      404:
        description: Event definition not found.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventError'
  patch:
    tags:
      - Event Definition
    description: >
      Updates an event definition in the tenant of the user, merging it into its namespace. Requires the
      event-admin role. Core (platform) definitions are not writable via this endpoint.
    parameters:
      - name: namespace
        description: Namespace of the event definition.
        in: path
        required: true
        schema:
          type: string
        example: application-events
      - name: name
        description: Name of the event definition.
        in: path
        required: true
        schema:
          type: string
        example: user-registration
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              description:
                type: string
                nullable: true
              payloadSchema:
                type: object
            required:
              - payloadSchema
          example:
            description: A new user registered.
            payloadSchema:
              type: object
              properties:
                userId:
                  type: string
              required:
                - userId
    responses:
      200:
        description: Event definition successfully updated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventDefinition'
      400:
        description: Request is invalid, for example the payload schema is not a valid JSON schema, or there is no tenant context.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventError'
      401:
        description: Request does not include a valid bearer token.
      403:
        description: User does not have the event-admin role.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventError'
      404:
        description: Event definition not found in the tenant configuration.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventError'
  delete:
    tags:
      - Event Definition
    description: >
      Deletes an event definition from the tenant of the user. Requires the event-admin role. Core (platform)
      definitions are not deletable via this endpoint. The namespace itself is removed when its last definition
      is deleted.
    parameters:
      - name: namespace
        description: Namespace of the event definition.
        in: path
        required: true
        schema:
          type: string
        example: application-events
      - name: name
        description: Name of the event definition.
        in: path
        required: true
        schema:
          type: string
        example: user-registration
    responses:
      200:
        description: Event definition successfully deleted.
      401:
        description: Request does not include a valid bearer token.
      403:
        description: User does not have the event-admin role.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventError'
      404:
        description: Event definition not found in the tenant configuration.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventError'
