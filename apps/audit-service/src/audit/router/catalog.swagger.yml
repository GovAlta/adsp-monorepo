paths:
  /audit/v1/retention:
    get:
      tags:
        - Retention
      summary: Get the configured retention periods for the caller's tenant.
      description: |
        Requires the `audit-reader` role, held in the tenant or as a Core role. Returns the retention periods as the
        service applies them at write time: the active configuration revision (falling back to the latest), with Core
        settings merged. Only configured periods are returned, not the built-in defaults. Application entries are
        included for registered action catalogs that override at least one class. Precedence is built-in defaults,
        then `tenant`, then the application entry.

        Tenant callers read their token's tenant. Core callers select a tenant with `tenantId`; without it both
        properties are empty.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Configured retention periods.
          content:
            application/json:
              schema:
                type: object
                required:
                  - tenant
                  - applications
                properties:
                  tenant:
                    $ref: '#/components/schemas/RetentionClasses'
                  applications:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/RetentionClasses'
                example:
                  tenant:
                    standard:
                      days: 120
                  applications:
                    case-service:
                      compliance:
                        days: 730
        '400':
          $ref: '#/components/responses/AuditBadRequest'
        '401':
          $ref: '#/components/responses/AuditUnauthorized'
        '403':
          $ref: '#/components/responses/AuditForbidden'
        '503':
          description: Retention settings could not be resolved or are out of bounds. Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditError'
              example:
                errorMessage: Audit retention settings are temporarily unavailable.
  /audit/v1/actions:
    get:
      tags:
        - Action catalogs
      summary: List all action catalogs visible to the caller.
      description: |
        Requires the `audit-reader` role, held in the tenant or as a Core role. Returns every catalog registered in
        audit-service:actions-<application> for the caller's tenant and for Core (such as the platform services), so a
        client can discover the available namespaces and actions. As for the single-namespace endpoint, each catalog
        merges tenant and Core actions with Core winning.

        Tenant callers read their token's tenant. Core callers select a tenant with `tenantId`; without it only Core
        catalogs are returned.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Catalogs ordered by application; an empty array means none are registered.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditActionCatalog'
        '400':
          $ref: '#/components/responses/AuditBadRequest'
        '401':
          $ref: '#/components/responses/AuditUnauthorized'
        '403':
          $ref: '#/components/responses/AuditForbidden'
        '503':
          $ref: '#/components/responses/AuditCatalogUnavailable'
  /audit/v1/{namespace}/actions:
    get:
      tags:
        - Action catalogs
      summary: List a namespace's action definitions.
      description: |
        Requires the `audit-reader` role, held in the tenant or as a Core role. Returns a JSON array of action
        definitions from the caller's tenant merged with Core, with Core winning on duplicate action names.
        The namespace is the application identifier in audit-service:actions-<application>.
        This endpoint does not require ownership of the namespace.

        Tenant callers read their token's tenant. Core callers select a tenant with `tenantId`; without it only the
        Core catalog is read.
      parameters:
        - $ref: '#/components/parameters/AuditNamespace'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Resolved definitions; an empty array means the catalog is registered but empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditAction'
        '400':
          $ref: '#/components/responses/AuditBadRequest'
        '401':
          $ref: '#/components/responses/AuditUnauthorized'
        '403':
          $ref: '#/components/responses/AuditForbidden'
        '404':
          description: No action catalog is registered for this namespace (neither Core nor the tenant supplied one). Register the namespace's actions in the audit-service configuration (actions-<application>) and retry. Configuration HTTP or converter failures handled by the SDK can also produce this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditError'
              example:
                errorMessage: action catalog with ID 'case-service' could not be found.
        '503':
          $ref: '#/components/responses/AuditCatalogUnavailable'
    post:
      tags:
        - Action catalogs
      summary: Add an action to the caller's tenant catalog for a namespace.
      description: |
        Requires the `audit-admin` role, held in the tenant or as a Core role. The caller's token is forwarded to the
        configuration service, so configuration write permission is also required; without it the request responds
        401. The action is added to the tenant's actions-<namespace> catalog, which is created if missing.

        Tenant callers add to their token's tenant. Core callers must select a tenant with `tenantId`; without it the
        request responds 400.

        The name is compared in full and case-insensitively with the namespace's own catalog in fresh configuration,
        not the cache: 409 when it already exists there or when the namespace is a Core namespace. Names in other
        namespaces, including Core ones, are not conflicts.
      parameters:
        - $ref: '#/components/parameters/AuditNamespace'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditAction'
            example:
              name: case.update
              version: 1
              category: administrative
              severity: info
              retentionClass: compliance
              description: A case worker updated a case.
              resourceType: case
              captureChangeSet: true
      responses:
        '201':
          description: The action was added. The response echoes the added definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditAction'
        '400':
          $ref: '#/components/responses/AuditBadRequest'
        '401':
          description: >-
            Missing or invalid bearer token (plain-text `Unauthorized` body), or the caller lacks permission to change
            configuration (JSON body).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditError'
              example:
                errorMessage: Writing the action catalog requires permission to change configuration.
        '403':
          $ref: '#/components/responses/AuditForbidden'
        '409':
          description: The action name exists in the namespace's own catalog, or the namespace is a Core namespace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditError'
              example:
                errorMessage: Action "case.update" already exists in the case-service catalog.
        '503':
          $ref: '#/components/responses/AuditCatalogUnavailable'
components:
  parameters:
    AuditNamespace:
      in: path
      name: namespace
      required: true
      description: Audit namespace, the application name of the writing service (for example `case-service`).
      schema:
        type: string
        minLength: 1
        maxLength: 40
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      example: case-service
  responses:
    AuditBadRequest:
      description: >-
        The request is invalid: a path or query parameter failed validation, `tenantId` is not a tenant URN, or a
        required tenant context is missing. Fix the request; do not retry unchanged.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuditError'
          example:
            errorMessage: 'Validation failed with error(s): namespace (params) - Invalid value'
    AuditUnauthorized:
      description: Missing or invalid bearer token. Obtain a valid token and retry.
      content:
        text/plain:
          schema:
            type: string
          example: Unauthorized
    AuditForbidden:
      description: >-
        The caller lacks the role the operation requires, or a tenant caller set `tenantId` to another tenant. Have the
        role granted to the caller; provisioning a role in the realm does not assign it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuditError'
          example:
            errorMessage: 'User Case reader (ID: 4f9e2d1c-8a7b-4c6d-9e5f-1a2b3c4d5e6f) not permitted to access audit data requiring audit-reader.'
    AuditCatalogUnavailable:
      description: Action catalogs could not be read or checked. Retry; do not re-register actions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuditError'
          example:
            errorMessage: Action catalog is temporarily unavailable. Retry the request; do not re-register actions.
  schemas:
    AuditError:
      type: object
      required:
        - errorMessage
      properties:
        errorMessage:
          type: string
      example:
        errorMessage: 'Validation failed with error(s): top (query) - Invalid value'
    RetentionClasses:
      type: object
      description: Retention class name to period.
      additionalProperties:
        type: object
        required:
          - days
        properties:
          days:
            type: integer
            minimum: 1
      example:
        standard:
          days: 120
    AuditActionCatalog:
      type: object
      required:
        - application
        - core
        - actions
      properties:
        application:
          type: string
          example: case-service
        core:
          type: boolean
          description: True when Core registers a catalog for the application, so its actions are not tenant-managed.
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AuditAction'
      example:
        application: case-service
        core: false
        actions:
          - name: case.update
            version: 1
            category: administrative
            severity: info
            retentionClass: compliance
            resourceType: case
            captureChangeSet: true
            forwardToSiem: false
    AuditAction:
      type: object
      required:
        - name
        - version
        - category
        - severity
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-zA-Z0-9]+(?:[._:-][a-zA-Z0-9]+)*$'
          description: Base action name, without a terminal `.succeeded` or `.failed` suffix.
          example: case.update
        version:
          type: integer
          minimum: 1
        category:
          type: string
          enum: [administrative, runtime, security, data-access, diagnostic]
        severity:
          type: string
          enum: [info, warning, critical]
        retentionClass:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: >-
            Named retention class; custom classes are allowed. Never a duration. Optional: when omitted, the class
            is derived from the category (administrative and data-access: compliance, security: security,
            runtime and diagnostic: standard). A class set on the action overrides the category default.
        description:
          type: string
          minLength: 1
        resourceType:
          type: string
          minLength: 1
        captureChangeSet:
          type: boolean
          default: false
        forwardToSiem:
          type: boolean
          default: false
        metadataSchema:
          type: object
          additionalProperties: true
          description: Optional JSON Schema draft-07 for metadata; omitted means no action-specific metadata constraint.
      example:
        name: case.update
        version: 1
        category: administrative
        severity: info
        retentionClass: compliance
        description: A case worker updated a case.
        resourceType: case
        captureChangeSet: true
        forwardToSiem: false
