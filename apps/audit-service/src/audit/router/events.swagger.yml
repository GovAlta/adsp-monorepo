paths:
  /audit/v1/{namespace}/events:
    get:
      tags:
        - Audit events
      summary: List events in a namespace for the caller's tenant, newest first.
      description: |
        Requires `audit-reader`. Any reader in the tenant may read any namespace; ownership is not required for reads.
        Filters combine; paginate with `top` and `after`.

        Responses include `actor.name` and `actor.email` as recorded by the writer, and `audit-reader` callers
        receive them. Name and email are omitted from aggregate and export responses unless the caller has
        `audit-admin`; no such endpoint exists yet. `retentionUntil` is fixed when the event is written.
      parameters:
        - in: path
          name: namespace
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Top'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Actor'
        - $ref: '#/components/parameters/ResourceType'
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Severity'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/OccurredFrom'
        - $ref: '#/components/parameters/OccurredTo'
      responses:
        '200':
          $ref: '#/components/responses/AuditEventPage'
        '400':
          description: Invalid namespace or query parameter. Fix the request.
        '401':
          description: Missing or invalid bearer token.
        '403':
          description: Missing `audit-reader` role, or a tenant caller attempting to select another tenant.
        '503':
          description: Audit event storage is not configured or unavailable. Retry.
    post:
      tags:
        - Audit events
      summary: Validate and submit a batch of audit events.
      description: |
        **A `202` does not mean every event was stored.** The body reports a per-event outcome:
        `accepted`, `duplicates` and `rejected`. Always inspect `rejected`; rejected events are
        not stored and are never retried by the service, so the caller must correct and resend them.

        **Role:** requires `audit-writer`, including for Core callers.

        **Namespace ownership:** the verified token's `azp` must be a service URN. A non-Core caller may
        write only to the namespace equal to that service's name, and only for its own tenant; any other
        namespace returns `403`. Core service accounts with `audit-writer` are exempt from the namespace
        check, may select any namespace, and must provide `tenantId`. Grant the writer role only to
        authorized service accounts; the platform Core check does not distinguish service accounts from human users.

        **Limits:** 1 to 500 events per request; `metadata` and `changeSet` are each limited to 16 KiB.
        `eventId` must be a UUID. `occurredAt` must be no more than 7 days in the past and no more than
        5 minutes in the future.

        **Server-set fields:** `tenantId`, `writtenBy`, `namespace`, `receivedAt`, `category`, `severity`
        and `retentionClass` are set by the service from the verified token, the path, the clock and the
        registered action. If supplied in an event they are ignored.

        Malformed envelopes fail the request; invalid events are rejected individually.
        Metadata and changeSet each have a 16 KiB UTF-8 JSON limit, including JSON syntax.
        The complete request body is limited to 20 MiB. Server-owned row fields are
        always derived from the verified caller, path, clock and resolved action/policy;
        additional event fields are not copied into trusted row columns.

        Each pod buffers at most 1,000 events and 8 MiB of serialized enriched events,
        including retained original input. A batch that cannot fit in an empty buffer
        returns 413 without storing any events; split it into smaller requests.
        Temporary buffer pressure returns 503 with Retry-After instead.

        Configuration uses the SDK's existing error handling: HTTP and conversion
        failures can resolve to null. Such failures cannot reliably be distinguished
        from missing documents and may produce unknown-action rejections, partial
        catalogs or fallback retention periods. Only errors that propagate reach
        the endpoint's 503 handling.

        A 202 waits for the submitter to commit valid events or durably park storage
        failures in PostgreSQL. Duplicate eventId values within the same tenant and
        namespace do not overwrite existing events. If neither event nor failed-event
        storage succeeds, the request returns 503. Requests with only validation
        rejections can return 202 without storage.
      parameters:
        - in: path
          name: namespace
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 40
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        - in: query
          name: tenantId
          description: Tenant URN, for example urn:ads:platform:tenant-service:v2:/tenants/case-team. Required for Core writers; leave empty as a tenant caller, who cannot select a different tenant.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    $ref: '#/components/schemas/AuditEventInput'
      responses:
        '202':
          description: |
            The request was processed, **not** necessarily stored in full. Every input is accepted, a duplicate,
            or rejected; accepted + duplicates + rejected.length equals the input count. Check `rejected`:
            rejected events are not stored and are not resent. Correct them and submit again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditWriteResponse'
              example:
                accepted: 1
                duplicates: 0
                rejected:
                  - index: 1
                    eventId: 0b9f6a8e-5d8c-4f6f-9a52-7c2d1f0e4b11
                    code: unknown_action
                    reason: "Action 'case.remove.failed' is not registered."
        '400':
          description: Malformed JSON or envelope (for example no events or more than 500), invalid namespace or tenant ID, or missing Core tenant context. Fix the request; do not retry unchanged.
        '401':
          description: Missing or invalid bearer token. Obtain a valid token and retry.
        '403':
          description: |
            Either the caller lacks the `audit-writer` role (have it granted to the service account), or the
            namespace is not the caller's: a non-Core caller can write only to its own service's namespace and
            tenant. A token whose `azp` is not a service URN is also refused.
        '413':
          description: Request body exceeds 20 MiB, or the enriched batch exceeds the 8 MiB buffer capacity. Split the batch; retrying it unchanged will not help.
        '503':
          description: Configuration, retention policy or durable storage is unavailable, or the buffer is temporarily full; retry without re-registering actions.
          headers:
            Retry-After:
              description: Minimum suggested retry delay in seconds.
              schema:
                type: integer
                example: 1
  /audit/v1/events:
    get:
      tags:
        - Audit events
      summary: List events across every namespace in the caller's tenant, newest first.
      description: |
        Requires `audit-reader`. Returns only the resolved tenant's events and accepts the same filters as the
        namespace listing. Actor `name` and `email` are included as recorded.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Top'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Actor'
        - $ref: '#/components/parameters/ResourceType'
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Severity'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/OccurredFrom'
        - $ref: '#/components/parameters/OccurredTo'
      responses:
        '200':
          $ref: '#/components/responses/AuditEventPage'
        '400':
          description: Invalid query parameter. Fix the request.
        '401':
          description: Missing or invalid bearer token.
        '403':
          description: Missing `audit-reader` role, or a tenant caller attempting to select another tenant.
        '503':
          description: Audit event storage is not configured or unavailable. Retry.
  /audit/v1/{namespace}/events/{id}:
    get:
      tags:
        - Audit events
      summary: Read one event by its service-generated id.
      description: |
        Requires `audit-reader`. An id belonging to another tenant returns 404. Actor `name` and `email`
        are included as recorded.
      parameters:
        - in: path
          name: namespace
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/TenantId'
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
        '400':
          description: Invalid namespace or id. Fix the request.
        '401':
          description: Missing or invalid bearer token.
        '403':
          description: Missing `audit-reader` role, or a tenant caller attempting to select another tenant.
        '404':
          description: Event not found in the caller's tenant and namespace.
        '503':
          description: Audit event storage is unavailable. Retry.
components:
  parameters:
    TenantId:
      in: query
      name: tenantId
      description: Tenant URN, for example urn:ads:platform:tenant-service:v2:/tenants/case-team. Available to Core service accounts only, and required for them. Leave empty as a tenant caller; supplying any other tenant returns 403.
      schema:
        type: string
    Top:
      in: query
      name: top
      schema: { type: integer, minimum: 1, maximum: 5000, default: 10 }
    After:
      in: query
      name: after
      description: Opaque keyset cursor from page.next of the previous response. Stable while new events arrive.
      schema: { type: string }
    Actor:
      in: query
      name: actor
      description: Actor id.
      schema: { type: string }
    ResourceType:
      in: query
      name: resourceType
      schema: { type: string }
    ResourceId:
      in: query
      name: resourceId
      schema: { type: string }
    Action:
      in: query
      name: action
      schema: { type: string }
    Status:
      in: query
      name: status
      schema: { type: string, enum: [success, failure, blocked, error] }
    Category:
      in: query
      name: category
      schema: { type: string, enum: [administrative, runtime, security, data-access] }
    Severity:
      in: query
      name: severity
      schema: { type: string, enum: [info, warning, critical] }
    CorrelationId:
      in: query
      name: correlationId
      schema: { type: string, minLength: 1 }
    SessionId:
      in: query
      name: sessionId
      schema: { type: string, minLength: 1, maxLength: 128 }
    Scope:
      in: query
      name: scope
      description: Matches events whose scopeIds contain this value.
      schema: { type: string }
    OccurredFrom:
      in: query
      name: occurredFrom
      schema: { type: string, format: date-time }
    OccurredTo:
      in: query
      name: occurredTo
      schema: { type: string, format: date-time }
  responses:
    AuditEventPage:
      description: A page of events, newest first by occurredAt.
      content:
        application/json:
          schema:
            type: object
            properties:
              results:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
              page:
                type: object
                properties:
                  after: { type: string }
                  size: { type: integer }
                  next: { type: string, description: Present when more results may exist. }
  schemas:
    AuditEvent:
      type: object
      description: A stored event. tenant_id is never returned.
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        namespace: { type: string }
        writtenBy: { type: string }
        occurredAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        action: { type: string }
        actionVersion: { type: integer }
        category: { type: string }
        status: { type: string }
        severity: { type: string }
        actor:
          type: object
          properties:
            id: { type: string }
            type: { type: string }
            name: { type: string }
            email: { type: string }
            roles: { type: array, items: { type: string } }
        resource:
          type: object
          properties:
            type: { type: string }
            id: { type: string }
            name: { type: string }
        scopeIds: { type: array, items: { type: string } }
        correlationId: { type: string }
        sessionId: { type: string }
        changeSet:
          type: object
          properties:
            before: { type: object, nullable: true }
            after: { type: object, nullable: true }
        metadata: { type: object }
        retentionClass: { type: string }
        retentionUntil: { type: string, format: date-time }
    AuditEventInput:
      type: object
      description: One event to write. Server-set fields (tenantId, writtenBy, namespace, receivedAt, category, severity, retentionClass) are ignored if supplied.
      required: [eventId, occurredAt, action, status, actor]
      properties:
        eventId:
          type: string
          format: uuid
          description: Caller UUID; database uniqueness is scoped to tenant and namespace.
        occurredAt:
          type: string
          format: date-time
          description: No more than 7 days old or 5 minutes in the future, inclusive.
        action:
          type: string
          pattern: '^[a-zA-Z0-9]+(?:[._:-][a-zA-Z0-9]+)*$'
          example: case.update.succeeded
          description: Registered base action with an optional terminal .succeeded or .failed suffix.
        actionVersion:
          type: integer
          minimum: 1
          description: Omitted means the current catalog version; an explicit mismatch is rejected individually.
        status:
          type: string
          enum: [success, failure, blocked, error]
        actor:
          type: object
          required: [id, type]
          properties:
            id:
              type: string
              minLength: 1
            type:
              type: string
              enum: [user, service, system]
            name:
              type: string
            email:
              type: string
            roles:
              type: array
              items:
                type: string
                minLength: 1
              default: []
        resource:
          type: object
          description: Required if the action declares resourceType; type must match.
          required: [type, id]
          properties:
            type:
              type: string
              minLength: 1
            id:
              type: string
              minLength: 1
            name:
              type: string
        scopeIds:
          type: array
          items:
            type: string
            minLength: 1
          default: []
        correlationId:
          type: string
          minLength: 1
        sessionId:
          type: string
          maxLength: 128
        metadata:
          type: object
          additionalProperties: true
          default: {}
          description: At most 16 KiB serialized UTF-8 JSON. Validated against metadataSchema without coercion or adding defaults.
        changeSet:
          type: object
          additionalProperties: false
          description: |
            At most 16 KiB serialized UTF-8 JSON. Shape is validated only when the
            action captures change sets; otherwise the value is dropped from row
            columns rather than rejected for its shape. The byte limit still applies.
          properties:
            before:
              type: object
              nullable: true
              additionalProperties: true
            after:
              type: object
              nullable: true
              additionalProperties: true
    AuditWriteResponse:
      type: object
      required: [accepted, duplicates, rejected]
      properties:
        accepted:
          type: integer
          minimum: 0
        duplicates:
          type: integer
          minimum: 0
        rejected:
          type: array
          items:
            type: object
            required: [index, code, reason]
            properties:
              index:
                type: integer
                minimum: 0
                description: Zero-based index in the original request; results are sorted by index. Use it, and eventId when present, to identify which event the entry concerns.
              eventId:
                type: string
                description: Caller-provided event identifier when available.
              code:
                type: string
                enum:
                  [
                    invalid_event,
                    unknown_action,
                    action_version_mismatch,
                    invalid_resource,
                    invalid_metadata,
                    storage_failed,
                  ]
              reason:
                type: string
