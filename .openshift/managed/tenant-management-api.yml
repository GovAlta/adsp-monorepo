apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: tenant-management-service
  annotations:
    tags: core-services, tenant-management
    template.openshift.io/provider-display-name: platform team
    description: Tenant Management API
labels:
  application: tenant-management
parameters:
  - name: APP_NAME
    displayName: App Name
    value: tenant-management-api
    required: true
  - name: INFRA_NAMESPACE
    description: Name of the infrastructure project.
    displayName: Infra Namespace
    value: core-services-infra
    required: true
  - name: NAMESPACE
    description: Namespace of the environment.
    displayName: Namespace
    value: core-services-dev
    required: true
  - name: BUILD_TAG
    description: Name of the ImageStreamTag to build.
    displayName: Build Tag
    value: latest
  - name: DEPLOY_TAG
    description: Name of the ImageStreamTag to deploy.
    displayName: Deploy Tag
    value: latest
  - name: ROUTE_HOST
    description: Host for the route.
    displayName: Route Host
    value: ''
  - name: CPU_LIMIT
    description: CPU limit for the API container.
    displayName: CPU Limit
    value: '200m'
  - name: MEMORY_LIMIT
    description: Memory limit for the API container.
    displayName: Memory Limit
    value: '200Mi'
  - name: CPU_REQUEST
    description: CPU request for the API container.
    displayName: CPU Request
    value: '20m'
  - name: MEMORY_REQUEST
    description: Memory request for the API container.
    displayName: Memory Request
    value: '50Mi'
objects:
  # Tenant Management API Objects

  # ImageStream is here for reference.
  # There is a single ImageStream created in the infra project.
  - apiVersion: v1
    kind: ImageStream
    metadata:
      labels:
        app: tenant-management
        component: api
        apply-infra: 'true'
      name: ${APP_NAME}
      namespace: ${INFRA_NAMESPACE}
    spec:
      tags:
        - name: ${BUILD_TAG}
          from:
            kind: DockerImage
            name: ghcr.io/govalta/${APP_NAME}:${BUILD_TAG}
          referencePolicy:
            type: Local

  # DeploymentConfig (and Service and Route) is created in each environment
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: tenant-management
        component: api
        apply-dev: 'true'
        apply-test: 'true'
        apply-uat: 'true'
        apply-prod: 'true'
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
      annotations:
        image.openshift.io/triggers: |-
          [
            {
              "from": {
                "kind": "ImageStreamTag",
                "name": "${APP_NAME}:${DEPLOY_TAG}",
                "namespace": "${INFRA_NAMESPACE}"
              },
              "fieldPath": "spec.template.spec.containers[0].image",
              "paused": true
            }
          ]
    spec:
      replicas: 3
      selector:
        matchLabels:
          app: tenant-management
          component: api
      template:
        metadata:
          labels:
            app: tenant-management
            component: api
        spec:
          containers:
            - image: >-
                image-registry.openshift-image-registry.svc:5000/adsp-build/${APP_NAME}@${DEPLOY_TAG}
              envFrom:
                - configMapRef:
                    name: ${APP_NAME}
                - secretRef:
                    name: ${APP_NAME}
              env:
                - name: PORT
                  value: '3333'
                # Overrides envFrom so a ConfigMap value cannot start the purge on serving pods.
                - name: TENANT_PURGE_ENABLED
                  value: 'false'
                # Recovery runs only in the single job pod, so serving pods never remove a tenant another pod is provisioning.
                - name: TENANT_PROVISIONING_RECOVERY_ENABLED
                  value: 'false'
                - name: MONGO_USER
                  valueFrom:
                    secretKeyRef:
                      key: database-user
                      name: tenant-management-mongodb
                - name: MONGO_URI
                  valueFrom:
                    secretKeyRef:
                      key: database-uri
                      name: tenant-management-mongodb
                - name: MONGO_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: database-password
                      name: tenant-management-mongodb
                - name: MONGO_DB
                  valueFrom:
                    secretKeyRef:
                      key: database-name
                      name: tenant-management-mongodb
                - name: MONGO_TLS
                  valueFrom:
                    secretKeyRef:
                      key: database-tls
                      name: tenant-management-mongodb
              imagePullPolicy: IfNotPresent
              name: ${APP_NAME}
              ports:
                - containerPort: 3333
                  name: http
                  protocol: TCP
              resources:
                limits:
                  cpu: ${CPU_LIMIT}
                  memory: ${MEMORY_LIMIT}
                requests:
                  cpu: ${CPU_REQUEST}
                  memory: ${MEMORY_REQUEST}
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              readinessProbe:
                httpGet:
                  path: /
                  port: 3333
                  scheme: HTTP
                initialDelaySeconds: 2
                timeoutSeconds: 1
                periodSeconds: 5
                successThreshold: 1
                failureThreshold: 20
              livenessProbe:
                httpGet:
                  path: /
                  port: 3333
                  scheme: HTTP
                initialDelaySeconds: 60
                timeoutSeconds: 2
                periodSeconds: 60
                successThreshold: 1
                failureThreshold: 5
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 25%
          maxSurge: 25%
      revisionHistoryLimit: 10
      progressDeadlineSeconds: 600
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: tenant-management
        component: job
        apply-dev: 'true'
        apply-test: 'true'
        apply-uat: 'true'
        apply-prod: 'true'
      name: ${APP_NAME}-job
      namespace: ${NAMESPACE}
      annotations:
        image.openshift.io/triggers: |-
          [
            {
              "from": {
                "kind": "ImageStreamTag",
                "name": "${APP_NAME}:${DEPLOY_TAG}",
                "namespace": "${INFRA_NAMESPACE}"
              },
              "fieldPath": "spec.template.spec.containers[0].image",
              "paused": true
            }
          ]
    spec:
      # One purge scheduler, independent of API scaling; do not autoscale this Deployment.
      replicas: 1
      selector:
        matchLabels:
          app: tenant-management
          component: job
      template:
        metadata:
          labels:
            app: tenant-management
            component: job
        spec:
          containers:
            - image: >-
                image-registry.openshift-image-registry.svc:5000/adsp-build/${APP_NAME}@${DEPLOY_TAG}
              envFrom:
                - configMapRef:
                    name: ${APP_NAME}
                - secretRef:
                    name: ${APP_NAME}
              env:
                - name: PORT
                  value: '3333'
                - name: TENANT_PURGE_ENABLED
                  value: 'true'
                - name: TENANT_RETENTION_DAYS
                  value: '365'
                - name: TENANT_PROVISIONING_RECOVERY_ENABLED
                  value: 'true'
                - name: MONGO_USER
                  valueFrom:
                    secretKeyRef:
                      key: database-user
                      name: tenant-management-mongodb
                - name: MONGO_URI
                  valueFrom:
                    secretKeyRef:
                      key: database-uri
                      name: tenant-management-mongodb
                - name: MONGO_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: database-password
                      name: tenant-management-mongodb
                - name: MONGO_DB
                  valueFrom:
                    secretKeyRef:
                      key: database-name
                      name: tenant-management-mongodb
                - name: MONGO_TLS
                  valueFrom:
                    secretKeyRef:
                      key: database-tls
                      name: tenant-management-mongodb
              imagePullPolicy: IfNotPresent
              name: ${APP_NAME}
              ports:
                - containerPort: 3333
                  name: http
                  protocol: TCP
              resources:
                limits:
                  cpu: ${CPU_LIMIT}
                  memory: ${MEMORY_LIMIT}
                requests:
                  cpu: ${CPU_REQUEST}
                  memory: ${MEMORY_REQUEST}
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              # The Service's component=api selector excludes this pod.
              readinessProbe:
                httpGet:
                  path: /
                  port: 3333
                  scheme: HTTP
                initialDelaySeconds: 2
                timeoutSeconds: 1
                periodSeconds: 5
                successThreshold: 1
                failureThreshold: 20
              livenessProbe:
                httpGet:
                  path: /
                  port: 3333
                  scheme: HTTP
                initialDelaySeconds: 60
                timeoutSeconds: 2
                periodSeconds: 60
                successThreshold: 1
                failureThreshold: 5
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
      # Recreate so a rollout never overlaps two scheduler pods.
      strategy:
        type: Recreate
      revisionHistoryLimit: 3
      progressDeadlineSeconds: 600
  - apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      labels:
        app: tenant-management
        component: api
        apply-dev: 'true'
        apply-test: 'true'
        apply-uat: 'true'
        apply-prod: 'true'
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
    spec:
      # Node drains evict one API pod at a time; the job pod is not selected.
      maxUnavailable: 1
      selector:
        matchLabels:
          app: tenant-management
          component: api
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: tenant-management
        component: api
        apply-dev: 'true'
        apply-test: 'true'
        apply-uat: 'true'
        apply-prod: 'true'
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
    spec:
      ports:
        - name: http
          port: 3333
          protocol: TCP
          targetPort: 3333
      selector:
        app: tenant-management
        component: api
      sessionAffinity: None
      type: ClusterIP
  - apiVersion: v1
    kind: Route
    metadata:
      labels:
        app: tenant-management
        component: api
        apply-dev: 'true'
        apply-test: 'true'
        apply-uat: 'true'
        apply-prod: 'true'
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
    spec:
      host: ${ROUTE_HOST}
      port:
        targetPort: http
      tls:
        termination: edge
      to:
        kind: Service
        name: ${APP_NAME}
        weight: 100
      wildcardPolicy: None
