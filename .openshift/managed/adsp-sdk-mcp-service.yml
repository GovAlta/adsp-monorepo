apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: adsp-sdk-mcp-service
  annotations:
    tags: core-services, adsp-sdk-mcp-service
    template.openshift.io/provider-display-name: platform team
    description: Hosted ADSP SDK MCP server (docs and SDK reference tools over streamable HTTP)
labels:
  application: adsp-sdk-mcp-service
parameters:
  - name: APP_NAME
    displayName: App Name
    value: adsp-sdk-mcp-service
    required: true
  - name: INFRA_NAMESPACE
    description: Name of the infrastructure project.
    displayName: Infra Namespace
    value: core-services-infra
    required: true
  - name: NAMESPACE
    description: Namespace of the environment.
    displayName: Namespace
    value: core-services-dev
    required: true
  - name: BUILD_TAG
    description: Name of the ImageStreamTag to build.
    displayName: Build Tag
    value: latest
  - name: DEPLOY_TAG
    description: Name of the ImageStreamTag to deploy.
    displayName: Deploy Tag
    value: latest
  - name: ROUTE_HOST
    description: Host for the route.
    displayName: Route Host
    value: ""
objects:
  # ImageStream is here for reference.
  # There is a single ImageStream created in the infra project.
  - apiVersion: v1
    kind: ImageStream
    metadata:
      labels:
        app: ${APP_NAME}
        component: api
        apply-infra: "true"
      name: ${APP_NAME}
      namespace: ${INFRA_NAMESPACE}
    spec:
      tags:
        - name: ${BUILD_TAG}
          from:
            kind: DockerImage
            name: ghcr.io/govalta/${APP_NAME}:${BUILD_TAG}
          referencePolicy:
            type: Local

  # Dev only until hosted auth (CS-5617) lands: there are no apply-test/uat/prod labels on purpose.
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: ${APP_NAME}
        component: api
        apply-dev: "true"
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
      annotations:
        image.openshift.io/triggers: |-
          [
            {
              "from": {
                "kind": "ImageStreamTag",
                "name": "${APP_NAME}:${DEPLOY_TAG}",
                "namespace": "${INFRA_NAMESPACE}"
              },
              "fieldPath": "spec.template.spec.containers[0].image",
              "paused": true
            }
          ]
    spec:
      # Stateless (no session affinity needed), so any replica can serve any request.
      replicas: 3
      selector:
        matchLabels:
          app: ${APP_NAME}
          component: api
      template:
        metadata:
          labels:
            app: ${APP_NAME}
            component: api
        spec:
          containers:
            - image: >-
                image-registry.openshift-image-registry.svc:5000/adsp-build/${APP_NAME}@${DEPLOY_TAG}
              envFrom:
                - configMapRef:
                    name: ${APP_NAME}
                - secretRef:
                    name: ${APP_NAME}
              env:
                - name: PORT
                  value: "3333"
                - name: MCP_SHUTDOWN_DELAY_MS
                  value: "5000"
                - name: MCP_SHUTDOWN_TIMEOUT_MS
                  value: "30000"
              imagePullPolicy: IfNotPresent
              name: ${APP_NAME}
              ports:
                - containerPort: 3333
                  name: http
                  protocol: TCP
              resources:
                requests:
                  cpu: 50m
                  memory: 160Mi
                limits:
                  cpu: 500m
                  memory: 384Mi
              # /ready fails until the docs index is built (the server listens only after) and from the start of
              # shutdown; /health stays up while the pod drains, so liveness doesn't kill it mid-request.
              readinessProbe:
                httpGet:
                  path: /ready
                  port: http
                  scheme: HTTP
                initialDelaySeconds: 2
                timeoutSeconds: 2
                periodSeconds: 5
                successThreshold: 1
                failureThreshold: 2
              livenessProbe:
                httpGet:
                  path: /health
                  port: http
                  scheme: HTTP
                initialDelaySeconds: 30
                timeoutSeconds: 5
                periodSeconds: 30
                successThreshold: 1
                failureThreshold: 5
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          # Longer than MCP_SHUTDOWN_TIMEOUT_MS, so the server's own drain decides when it exits.
          terminationGracePeriodSeconds: 45
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
      revisionHistoryLimit: 10
      progressDeadlineSeconds: 600
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: ${APP_NAME}
        component: api
        apply-dev: "true"
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
    spec:
      ports:
        - name: http
          port: 3333
          protocol: TCP
          targetPort: 3333
      selector:
        app: ${APP_NAME}
        component: api
      sessionAffinity: None
      type: ClusterIP
  - apiVersion: v1
    kind: Route
    metadata:
      labels:
        app: ${APP_NAME}
        component: api
        apply-dev: "true"
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
      annotations:
        # Covers the slowest tool call: requests are answered within the 30 s request and drain deadlines.
        haproxy.router.openshift.io/timeout: 60s
        # Stateless, so sticky-session cookies would only skew load across replicas.
        haproxy.router.openshift.io/disable_cookies: "true"
    spec:
      host: ${ROUTE_HOST}
      port:
        targetPort: http
      tls:
        termination: edge
      to:
        kind: Service
        name: ${APP_NAME}
        weight: 100
      wildcardPolicy: None
