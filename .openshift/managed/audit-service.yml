apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: audit-service
  annotations:
    tags: core-services, audit-service
    template.openshift.io/provider-display-name: platform team
    description: Audit service
labels:
  application: audit-service
parameters:
  - name: APP_NAME
    displayName: App Name
    value: audit-service
    required: true
  - name: INFRA_NAMESPACE
    description: Name of the infrastructure project.
    displayName: Infra Namespace
    value: core-services-infra
    required: true
  - name: NAMESPACE
    description: Namespace of the environment.
    displayName: Namespace
    value: core-services-dev
    required: true
  - name: BUILD_TAG
    description: Name of the ImageStreamTag to build.
    displayName: Build Tag
    value: latest
  - name: DEPLOY_TAG
    description: Name of the ImageStreamTag to deploy.
    displayName: Deploy Tag
    value: latest
  - name: ROUTE_HOST
    description: Host for the route.
    displayName: Route Host
    value: ''
objects:
  # Service Objects

  # ImageStream is here for reference.
  # There is a single ImageStream created in the infra project.
  - apiVersion: v1
    kind: ImageStream
    metadata:
      labels:
        app: ${APP_NAME}
        component: api
        apply-infra: 'true'
      name: ${APP_NAME}
      namespace: ${INFRA_NAMESPACE}
    spec:
      tags:
        - name: ${BUILD_TAG}
          from:
            kind: DockerImage
            name: ghcr.io/govalta/${APP_NAME}:${BUILD_TAG}
          referencePolicy:
            type: Local

  # Deployment (and Service and Route) is created in each environment
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: ${APP_NAME}
        component: api
        apply-dev: 'true'
        apply-test: 'true'
        apply-uat: 'true'
        apply-prod: 'true'
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
      annotations:
        image.openshift.io/triggers: |-
          [
            {
              "from": {
                "kind": "ImageStreamTag",
                "name": "${APP_NAME}:${DEPLOY_TAG}",
                "namespace": "${INFRA_NAMESPACE}"
              },
              "fieldPath": "spec.template.spec.containers[0].image",
              "paused": true
            }
          ]
    spec:
      replicas: 3
      revisionHistoryLimit: 3
      selector:
        matchLabels:
          app: ${APP_NAME}
          component: api
      template:
        metadata:
          labels:
            app: ${APP_NAME}
            component: api
        spec:
          containers:
            - image: >-
                image-registry.openshift-image-registry.svc:5000/adsp-build/${APP_NAME}@${DEPLOY_TAG}
              envFrom:
                - configMapRef:
                    name: ${APP_NAME}
                - secretRef:
                    name: ${APP_NAME}
              env:
                - name: PORT
                  value: '3352'
                - name: RETENTION_ENABLED
                  value: 'false'
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      key: database-host
                      name: ${APP_NAME}-postgres
                - name: DB_PORT
                  valueFrom:
                    secretKeyRef:
                      key: database-port
                      name: ${APP_NAME}-postgres
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      key: database-name
                      name: ${APP_NAME}-postgres
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      key: database-user
                      name: ${APP_NAME}-postgres
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: database-password
                      name: ${APP_NAME}-postgres
                - name: DB_TLS
                  valueFrom:
                    secretKeyRef:
                      key: database-tls
                      name: ${APP_NAME}-postgres
                - name: DB_POOL_MAX
                  value: '5'
              imagePullPolicy: IfNotPresent
              name: ${APP_NAME}
              ports:
                - containerPort: 3352
                  name: http
                  protocol: TCP
              resources:
                limits:
                  cpu: 100m
                  # Keep the original limit: 4 * 8Mi buffer allowance leaves 168Mi for runtime/requests/GC.
                  # This is a planning budget, not measured peak RSS; see docs/services/audit-service.md.
                  memory: 200Mi
                requests:
                  cpu: 20m
                  memory: 50Mi
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              # Deliberate deviation from platform defaults: DB loss must NEVER fail liveness.
              startupProbe:
                httpGet:
                  path: /health/live
                  port: http
                timeoutSeconds: 2
                periodSeconds: 5
                failureThreshold: 60
              readinessProbe:
                httpGet:
                  path: /health/ready
                  port: http
                timeoutSeconds: 1
                periodSeconds: 5
                failureThreshold: 1
              livenessProbe:
                httpGet:
                  path: /health/live
                  port: http
                timeoutSeconds: 2
                periodSeconds: 60
                failureThreshold: 3
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          # 10s withdrawal + 25s flush + 10s cleanup = 45s process deadline; 15s platform headroom.
          terminationGracePeriodSeconds: 60
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 25%
          maxSurge: 25%
      progressDeadlineSeconds: 600
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: ${APP_NAME}
        component: job
        apply-dev: 'true'
        apply-test: 'true'
        apply-uat: 'true'
        apply-prod: 'true'
      name: ${APP_NAME}-job
      namespace: ${NAMESPACE}
      annotations:
        image.openshift.io/triggers: |-
          [
            {
              "from": {
                "kind": "ImageStreamTag",
                "name": "${APP_NAME}:${DEPLOY_TAG}",
                "namespace": "${INFRA_NAMESPACE}"
              },
              "fieldPath": "spec.template.spec.containers[0].image",
              "paused": true
            }
          ]
    spec:
      # One cron scheduler, independent of API scaling; do not autoscale this Deployment.
      replicas: 1
      revisionHistoryLimit: 3
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: ${APP_NAME}
          component: job
      template:
        metadata:
          labels:
            app: ${APP_NAME}
            component: job
        spec:
          containers:
            - image: >-
                image-registry.openshift-image-registry.svc:5000/adsp-build/${APP_NAME}@${DEPLOY_TAG}
              name: ${APP_NAME}
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: ${APP_NAME}
                - secretRef:
                    name: ${APP_NAME}
              env:
                - name: PORT
                  value: '3352'
                - name: RETENTION_ENABLED
                  value: 'true'
                # Single-account MVP: reuse the API's credentials, not an audit_retention secret.
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      key: database-host
                      name: ${APP_NAME}-postgres
                - name: DB_PORT
                  valueFrom:
                    secretKeyRef:
                      key: database-port
                      name: ${APP_NAME}-postgres
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      key: database-name
                      name: ${APP_NAME}-postgres
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      key: database-user
                      name: ${APP_NAME}-postgres
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: database-password
                      name: ${APP_NAME}-postgres
                - name: DB_TLS
                  valueFrom:
                    secretKeyRef:
                      key: database-tls
                      name: ${APP_NAME}-postgres
                - name: DB_POOL_MAX
                  value: '5'
              ports:
                - containerPort: 3352
                  name: http
                  protocol: TCP
              resources:
                limits:
                  cpu: 100m
                  memory: 200Mi
                requests:
                  cpu: 20m
                  memory: 50Mi
              # Same probe split as the API; the Service's component=api selector excludes this pod.
              startupProbe:
                httpGet:
                  path: /health/live
                  port: http
                timeoutSeconds: 2
                periodSeconds: 5
                failureThreshold: 60
              readinessProbe:
                httpGet:
                  path: /health/ready
                  port: http
                timeoutSeconds: 1
                periodSeconds: 5
                failureThreshold: 1
              livenessProbe:
                httpGet:
                  path: /health/live
                  port: http
                timeoutSeconds: 2
                periodSeconds: 60
                failureThreshold: 3
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
          # Matches the 45s process deadline, with 15s platform headroom.
          terminationGracePeriodSeconds: 60
          restartPolicy: Always
          dnsPolicy: ClusterFirst
      progressDeadlineSeconds: 600
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: ${APP_NAME}
        component: api
        apply-dev: 'true'
        apply-test: 'true'
        apply-uat: 'true'
        apply-prod: 'true'
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
    spec:
      ports:
        - name: http
          port: 3352
          protocol: TCP
          targetPort: 3352
      selector:
        app: ${APP_NAME}
        component: api
      sessionAffinity: None
      type: ClusterIP
  - apiVersion: v1
    kind: Route
    metadata:
      annotations:
        # History reads have a separate 60s query budget; allow pool acquisition and response overhead.
        haproxy.router.openshift.io/timeout: 120s
      labels:
        app: ${APP_NAME}
        component: api
        apply-dev: 'true'
        apply-test: 'true'
        apply-uat: 'true'
        apply-prod: 'true'
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
    spec:
      host: ${ROUTE_HOST}
      port:
        targetPort: http
      tls:
        termination: edge
      to:
        kind: Service
        name: ${APP_NAME}
        weight: 100
      wildcardPolicy: None
