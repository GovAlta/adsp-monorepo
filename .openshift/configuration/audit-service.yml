apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      labels:
        app: audit-service
        component: api
      name: audit-service
    data:
      KEYCLOAK_ROOT_URL: https://access.adsp-dev.gov.ab.ca
      DIRECTORY_URL: https://directory-service.adsp-dev.gov.ab.ca
      LOG_LEVEL: debug
      RETENTION_ENABLED: 'false'
      RETENTION_SCHEDULE: '0 2 * * *'
      RETENTION_BATCH_SIZE: '1000'
      RETENTION_MAX_BATCHES: '10'
      RETENTION_MIN_DAYS: '1'
      RETENTION_MAX_DAYS: '3650'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  - apiVersion: v1
    kind: Secret
    metadata:
      labels:
        app: audit-service
        component: api
      name: audit-service
    stringData:
      CLIENT_ID: urn:ads:platform:audit-service
      CLIENT_SECRET:
