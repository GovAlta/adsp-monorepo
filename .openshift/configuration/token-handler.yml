apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      labels:
        app: token-handler
        component: api
      name: token-handler
    data:
      KEYCLOAK_ROOT_URL: https://access.alberta.ca
      DIRECTORY_URL: http://directory-service:3333
      DIR_PLATFORM_CONFIGURATION_SERVICE_V2: http://configuration-service:3333/configuration/v2
      LOG_LEVEL: debug
      # Hosts that target upstreams can use; a comma separated list of host names (optionally with a port), and
      # '*.example.ca' for subdomains.
      # Upstreams are not restricted if it is not set. When set, upstreams in the platform namespace (urn:ads:platform:)
      # are not checked, so cluster internal URLs of platform services do not need to be listed.
      # Quote the value if it starts with '*', which is otherwise read as a YAML alias.
      # UPSTREAM_ALLOWED_DOMAINS: '*.example.ca,*.example.org'
  - apiVersion: v1
    kind: Secret
    metadata:
      labels:
        app: token-handler
        component: api
      name: token-handler
    # CLIENT_SECRET, STORE_SECRET, SESSION_SECRET and SECRET_SALT are required; the token handler does not start if
    # one is missing, or if a store or session secret or the salt is shorter than 16 characters. Use long random
    # values (32 characters or more).
    # Changing STORE_SECRET or SECRET_SALT makes stored client credentials and sessions unreadable, so registered
    # clients must be registered again. Changing SESSION_SECRET only ends current sessions.
    stringData:
      CLIENT_ID: urn:ads:platform:token-handler
      CLIENT_SECRET:
      STORE_SECRET:
      SESSION_SECRET:
      SECRET_SALT: 
