# DRAFT: Alert timing and thresholds remain implementation candidates pending Form Service DEV
# validation and team approval. DEV previously verified the namespace/container selector and
# collector JSON Error-level filter. Explicit message extraction, anchored Winston severity
# matching, the complete three-minute Error metric expression, Critical positive matching, Loki
# Ruler evaluation, pending-to-firing transitions, recovery and notification delivery remain
# unverified for Form Service.
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: form-service-log-alerts
  annotations:
    description: >-
      Candidate Loki log alerts for actual form-service Winston Critical, Alert and Error severity.
      Collector-generated severity is not used because it may disagree with application severity.
parameters:
  - name: NAMESPACE
    description: Target namespace, e.g. adsp-dev.
    required: true
objects:
  - apiVersion: loki.grafana.com/v1
    kind: AlertingRule
    metadata:
      name: form-service-log-alerts
      namespace: ${NAMESPACE}
      labels:
        # LokiStack only loads AlertingRules carrying this label.
        loki.grafana.com/rules: 'true'
    spec:
      tenantID: application
      groups:
        - name: form-service-log-alerts
          interval: 30s
          rules:
            - alert: ADSPLogCritical
              expr: |
                sum by (kubernetes_pod_name, kubernetes_container_name) (
                  count_over_time(
                    {kubernetes_namespace_name="${NAMESPACE}", kubernetes_container_name="form-service"}
                      | json app_message="message"
                      | __error__=""
                      | line_format "{{.app_message}}"
                      |~ `^(\x1b\[[0-9;]*m)?(critical|alert)(\x1b\[[0-9;]*m)?:[[:space:]]`
                      [1m]
                  )
                ) > 0
              for: 0s
              labels:
                service: form-service
                namespace: ${NAMESPACE}
                severity: critical
              annotations:
                summary: Critical form-service application log detected
                description: >-
                  Form service emitted {{ $value }} Winston critical- or alert-severity log(s) in
                  the last minute for pod {{ $labels.kubernetes_pod_name }} and container
                  {{ $labels.kubernetes_container_name }}.
                impact: >-
                  Applicants may be unable to start, save or submit forms, and form-related emails,
                  PDFs and calendar bookings may not be produced.
                first_steps: |
                  1. Confirm the application message begins with critical: or alert: and read the first matching entry after the start time.
                  2. Check whether form-service restarted or was deployed in the last hour.
                  3. If a dependency is named, check it; otherwise follow Mitigate in the runbook.
                runbook_url: https://goa-dio.atlassian.net/wiki/spaces/ADSPA/pages/5226857671
            - alert: ADSPLogError
              expr: |
                sum by (kubernetes_pod_name, kubernetes_container_name) (
                  count_over_time(
                    {kubernetes_namespace_name="${NAMESPACE}", kubernetes_container_name="form-service"}
                      | json app_message="message"
                      | __error__=""
                      | line_format "{{.app_message}}"
                      |~ `^(\x1b\[[0-9;]*m)?error(\x1b\[[0-9;]*m)?:[[:space:]]`
                      [3m]
                  )
                ) > 0
              for: 30s
              labels:
                service: form-service
                namespace: ${NAMESPACE}
                severity: warning
              annotations:
                summary: Recent form-service application error logs detected
                description: >-
                  Form service emitted {{ $value }} Winston error-severity log(s) in the last three
                  minutes for pod {{ $labels.kubernetes_pod_name }} and container
                  {{ $labels.kubernetes_container_name }}; the condition persisted for at least 30
                  seconds. The lookback and threshold remain candidate settings pending DEV
                  baseline validation and team approval.
                impact: >-
                  Some applicants or administrators may see failures when saving, submitting or
                  viewing forms, or in downstream notification, PDF, calendar, SharePoint or task
                  processing. An isolated Error does not establish a service-wide or after-hours
                  outage.
                first_steps: |
                  1. Confirm the application message begins with error: and check whether it affects one tenant, one form or all requests.
                  2. Check whether form-service was deployed in the last hour or a dependency is failing.
                  3. If only one tenant or form is affected, contact its form administrator.
                runbook_url: https://goa-dio.atlassian.net/wiki/spaces/ADSPA/pages/5226857650
