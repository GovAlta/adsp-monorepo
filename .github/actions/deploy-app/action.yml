name: "Apply manifest and deploy application"
description: "Applies the Kubernetes manifest and deploys the application to the specified environment."
inputs:
  app:
    description: "Application to deploy."
    required: true
  to:
    description: "Environment to deploy to (e.g., dev, uat, prod)."
    required: true
  from:
    description: "Environment to deploy from (e.g., dev, uat, prod)."
    default: "latest"
    required: false
runs:
  using: "composite"
  steps:
    - name: Import image
      shell: bash
      if: ${{ inputs.from == 'latest' }}
      run: |
        oc import-image ghcr.io/govalta/${{ inputs.app }}:latest --reference-policy='local' --confirm
    - name: Tag ${{ inputs.to }}
      shell: bash
      run: |
        oc tag ${{ inputs.app }}:${{ inputs.from }} ${{ inputs.app }}:${{ inputs.to }} --reference-policy='local'
    - shell: bash
      run: oc project adsp-${{ inputs.to }}
    - name: Apply Manifests
      shell: bash
      run: |
        PARAM_FILE=.openshift/environments/${{ inputs.to }}/${{ inputs.app }}.env
        PARAM_FILE_ARGS=()
        if [ -f "$PARAM_FILE" ]; then
          echo "Using environment parameter overrides from $PARAM_FILE"
          PARAM_FILE_ARGS=(--param-file "$PARAM_FILE")
        fi
        oc process -f .openshift/managed/${{ inputs.app }}.yml "${PARAM_FILE_ARGS[@]}" -p INFRA_NAMESPACE=adsp-build -p NAMESPACE=adsp-${{ inputs.to }} -p DEPLOY_TAG=${{ inputs.to }} > ${{ inputs.app }}.${{ inputs.to }}.json
        oc apply -f ${{ inputs.app }}.${{ inputs.to }}.json -l apply-${{ inputs.to }}=true,component!=database
    - name: Deploy ${{ inputs.to }}
      shell: bash
      run: |
        # Roll out with image triggers on, then always switch them back to manual,
        # even when the rollout fails or times out (the step runs with bash -e) or
        # the job is cancelled. Otherwise the deployment would keep auto-rolling out
        # on every later image tag.
        active=""
        restore_triggers() {
          if [ -n "$active" ]; then
            oc set triggers "$active" --manual || true
            active=""
          fi
        }
        trap restore_triggers EXIT
        trap "restore_triggers; exit 130" INT TERM

        rollout_with_triggers() {
          active="$1"
          oc set triggers "$1" --auto
          local rc=0
          oc rollout status "$1" --timeout=300s || rc=$?
          restore_triggers
          return $rc
        }

        if oc get deployment/${{ inputs.app }} ; then
          rollout_with_triggers deployment/${{ inputs.app }}
        elif oc get dc/${{ inputs.app }} ; then
          oc rollout latest dc/${{ inputs.app }}
          oc rollout status dc/${{ inputs.app }} --timeout=300s
        else
          echo "No Deployment or DeploymentConfig found for ${{ inputs.app }}."
        fi

        if oc get deployment/${{ inputs.app }}-job ; then
          rollout_with_triggers deployment/${{ inputs.app }}-job
        fi
